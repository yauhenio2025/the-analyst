<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1600" height="900" fill="#fbfaf6"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#1d1d1b">The the house Study and the Fourth Field: A Scorecard of Shifts</text>
  <!-- panel 1: gains, top-left -->
  <rect x="40" y="90" width="750" height="380" fill="#e9f3e6" stroke="#1d1d1b" stroke-width="3"/>
  <rect x="40" y="90" width="750" height="52" fill="#a9d3a1"/>
  <text x="415" y="126" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1b">GAINS: The Three Fields Named</text>
  <g font-size="20" fill="#1d1d1b">
    <text x="70" y="185">↑ Heritage as a balance-sheet asset (Gucci archive, 1921 onward)</text>
    <text x="70" y="240">↑ Creative direction read as a governance decision</text>
    <text x="70" y="295">↑ Retail estate consolidated: 600 to 450 stores</text>
    <text x="70" y="350">↑ Wholesale share cut to protect price integrity</text>
    <text x="70" y="405">↑ Group-level capital allocation across the houses</text>
  </g>
  <!-- panel 2: losses, top-right -->
  <rect x="810" y="90" width="750" height="380" fill="#f9e7e5" stroke="#1d1d1b" stroke-width="3"/>
  <rect x="810" y="90" width="750" height="52" fill="#e5a49b"/>
  <text x="1185" y="126" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1b">LOSSES: What the Reset Cost</text>
  <g font-size="20" fill="#1d1d1b">
    <text x="840" y="185">↓ Two years of double-digit revenue decline at the flagship house</text>
    <text x="840" y="240">↓ Designer churn: three creative directors in five years</text>
    <text x="840" y="295">↓ Wholesale partners lost without a replacement channel</text>
    <text x="840" y="350">↓ Aspirational customer priced out at the entry tier</text>
    <text x="840" y="405">↓ Margin compression from store closures and severance</text>
  </g>
  <!-- panel 3: gains, bottom-left -->
  <rect x="40" y="490" width="750" height="370" fill="#e9f3e6" stroke="#1d1d1b" stroke-width="3"/>
  <rect x="40" y="490" width="750" height="52" fill="#a9d3a1"/>
  <text x="415" y="526" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1b">GAINS: The Fourth Field</text>
  <g font-size="20" fill="#1d1d1b">
    <text x="70" y="585">↑ Cultural production as a field of its own</text>
    <text x="70" y="640">↑ Collaborations priced as cultural capital, not licensing</text>
    <text x="70" y="695">↑ Archive exhibitions convert heritage into audience</text>
    <text x="70" y="750">↑ Creative director as author of a house language</text>
    <text x="70" y="805">↑ A vocabulary executives can use in the board room</text>
  </g>
  <!-- panel 4: losses, bottom-right -->
  <rect x="810" y="490" width="750" height="370" fill="#f9e7e5" stroke="#1d1d1b" stroke-width="3"/>
  <rect x="810" y="490" width="750" height="52" fill="#e5a49b"/>
  <text x="1185" y="526" text-anchor="middle" font-size="24" font-weight="700" fill="#1d1d1b">LOSSES: Persistent Tensions</text>
  <g font-size="20" fill="#1d1d1b">
    <text x="840" y="585">↓ Heritage versus novelty is managed, never resolved</text>
    <text x="840" y="640">↓ Group control versus house autonomy</text>
    <text x="840" y="695">↓ Price integrity versus volume in Asia</text>
    <text x="840" y="750">↓ Cultural capital does not yet show on the balance sheet</text>
    <text x="840" y="805">↓ The fourth field has no owner in the org chart</text>
  </g>
  <!-- cross on panel 2 -->
  <g stroke="#c0392b" stroke-width="14" stroke-linecap="round" opacity="0.35">
    <line x1="860" y1="160" x2="1510" y2="450"/><line x1="1510" y1="160" x2="860" y2="450"/>
  </g>
  <text x="1185" y="472" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">RESET ABSORBED THE LOSSES</text>
  <!-- link arrow -->
  <path d="M 1560 300 C 1595 400, 1595 560, 1560 660" fill="none" stroke="#1d1d1b" stroke-width="4"/>
  <polygon points="1560,660 1550,642 1572,646" fill="#1d1d1b"/>
  <text x="1590" y="480" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1b" transform="rotate(90 1590 480)">EVOLVED TENSIONS</text>
</svg>
