      texts are excluded from the comparison and retained only in a separate metadata annex. Unknown dates remain
      unknown. Do not claim influence, mutual reading, personal affiliation, ignorance or intent from shared names
      or scoped zeros.'
    indicators: []
    scope: document
    load_bearing: true
    id_prefix: O2
    answer_shape: '[O2.F<n>] <one bounded finding> — dim: passage_use — move: <move> — stance: <stance> — proposition:
      <bounded reading> — cited-work: <key or unknown> — voice: <speaker/attributor chain> — qualification: <limit>
      — inspected: <event/eligible> — author: <uid> — person: <P_uid> — pair: <author_uid>__<P_uid> — event-ids:
      <author-qualified canonical IDs> — anchor: "<exact passage>" — doc: <original key> — locus: <printed/PDF page
      or registry section, edition, how> — confidence: high|medium|low'
  - key: topic_alignment
    name: The question each side advances with P
    questions:
    - Do both authors use P to answer the same question, or does a shared phrase conceal different explanatory tasks?
    - Where do comparable passages agree, disagree or remain incomparable?
    method_card: 'Do: Align explicit propositions and their argumentative tasks, not topic keywords. Name each side’s
      question, concept and explanatory object, and retain difference of genre or target. Label theme origin plan_spine|passage_addition.
      Same text different reading requires an identified common work and a genuine interpretive contrast, not merely
      different page numbers; cite the registry equivalence if editions differ. Distinguish complementary uses from
      disagreement, and offer the strongest contrary passage or a coverage limit.


      Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
