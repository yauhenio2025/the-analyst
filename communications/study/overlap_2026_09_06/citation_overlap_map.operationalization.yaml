      texts are excluded from the comparison and retained only in a separate metadata annex. Unknown dates remain
      unknown. Do not claim influence, mutual reading, personal affiliation, ignorance or intent from shared names
      or scoped zeros.'
    - Check both author endpoints, every compared person, work identity rule, dated coverage and residue completeness;
      apply rulings to all final cells. Never count two authors as two shared persons.
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: a scholar with both authors’ passages open
    tables:
    - person_work_overlap
    - person_passage_uses
    - person_trajectories
    - person_asymmetries
    brief: "Do: Follow the approved plan, lead with the supported comparison, and keep every substantive sentence\
      \ and table cell attached to final retained IDs. Preserve all immutable ancestry and original witnesses after\
      \ critic rulings. Unknowns remain unresolved; a count table cannot supply a semantic conclusion. Complete\
      \ the passage inventory with explicit inspected/eligible counts; missing material prevents an exhaustive label.\
      \ No unilateral source or coauthored text can satisfy the cross-author gate. \n\nTables (full columns):\n\
      person_work_overlap: P | cited-work key/title per side | registry work/edition IDs | held copy per side |\
      \ shared exact key / registry equivalence / edition | unresolved | canonical event IDs | table row refs; interpretive\
      \ cells additionally cite map IDs and both passage anchors.\nperson_passage_uses: P | author UID | pair key\
      \ | original text key/title/year | event/ref ID/kind | work cited | proposition/topic/theme origin | move\
      \ | stance | voice/qualification | map ID | exact anchor | printed/PDF/section/edition/how. One row per event\
      \ × proposition; no max_rows truncation presented as exhaustive.\nperson_trajectories: P | author | dated\
      \ original text endpoints | continuity/change/argument hinge/unordered/insufficient | topic/work shift | alternative\
      \ | map IDs | every endpoint anchor/key/locus.\nperson_asymmetries: P | primary verdict/coexisting tags |\
      \ affected author UID | joint reliance reasoning | weaker-side events | inspected/eligible each side | contrary\
      \ finding | map IDs | both sides’ anchors/keys/loci.\n\nThe mandatory partiality paragraph names both authors\
      \ and the ordered axis; held, inspected and missing text keys/counts and years per side; A+B co-authored keys\
      \ excluded from both analytical universes (other coauthors and attribution limits separately); kinds/types/self-citation\
      \ settings; ledger and identity/alias snapshots; exact shared threshold, eligible shared size, selected K,\
      \ owner additions/strikes, unselected shared and below-threshold positives; person/work intersection and union\
      \ denominators and identity rule; unresolved works/editions, held/fetched/wanted per side; inspected canonical\
      \ events and rejected/unlocated anchors; unknown years; complete or top-N residues and omitted counts; separate\
      \ collective terms and missing collective analyses; audits run/not run/unavailable with assessed denominators.\
      \ Synthetic content disqualifies release even when mixed with a real pilot. Say which missing source or changed\
      \ snapshot could change the result.\n\nClose with three to five source passages worth opening, using existing\
      \ memo links, original keys and inherited loci."
