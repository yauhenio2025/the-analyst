# Review candidate; withheld until source reads, owner read and both-order validation.
engine_key: citation_overlap_map
engine_name: Two authors on a shared cited person
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: What does each author do with this shared figure, and what does the comparison mean?
  framing: 'What does each author do with this shared figure, and what does the comparison mean? Distinguish common
    names from common works, readings and argumentative reliance. Explain contrasts through the supplied passages
    and preserve the author axis, dated coverage and scoped residues.


    Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
    A cross-author interpretation requires at least one exact passage anchor from each author, with distinct original
    document keys and author-qualified event IDs; repeated copies, a shared P witness, and co-authored texts cannot
    supply the second author. Keep every necessary qualification and nested voice. Counts and missingness come only
    from the frozen overlap table, never the number of findings. The plan is context, never evidence. Distinguish
    bibliographic sharing, argumentative sharing and fidelity. A missing or unresolved witness cannot become an
    adverse verdict. Code checks identities, arithmetic and anchors; the model must explain what the passages warrant.
    No new quotation from memory, repaired OCR, stitched anchor or unsourced chapter title. Rejected, superseded,
    unresolved or anchor-failed rows cannot support retained prose or a table cell. Co-authored A+B texts are excluded
    from the comparison and retained only in a separate metadata annex. Unknown dates remain unknown. Do not claim
    influence, mutual reading, personal affiliation, ignorance or intent from shared names or scoped zeros.


    Required input: One two-author evidence index for P, both authors’ actual citing passages/full texts, P held
    cited-work windows, role overlap_table and plan contexts. The transport, identity admission, metadata-only routing
    and structured provenance sidecar described in the design are required runtime work. YAML loading alone proves
    none of these. The plan is not citable; context:overlap can support metadata only and cannot count as an author
    or person.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: works_overlap
    name: Which works of P are actually shared?
    questions:
    - Which works of P does each side cite, and which are shared under the declared work-identity rule?
    - Is the apparent common person a shared text, different texts, different editions, or an unresolved bibliographic
      match?
    method_card: 'Do: Read each side’s cited-work inventory and its passage-to-work links. Report exact key and
      edition intersections separately from supplied registry work-family equivalences; a held copy is not the cited
      edition. Preserve titles as cited, cited key, registry work/edition IDs, held copies, retrieval how and unresolved
      matches. Cite table rows for inventory arithmetic; accompany an interpretive claim with both sides’ passages.
      A person-only mention does not identify a work. The brief’s 0.2% works and 2.9% persons are global Jaccards
      from one snapshot, not P-specific probabilities or proof most shared people cite different texts. Test that
      sharper question per P. Distinguish no common identified work from proven disjoint reading.


      Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
      A cross-author interpretation requires at least one exact passage anchor from each author, with distinct original
      document keys and author-qualified event IDs; repeated copies, a shared P witness, and co-authored texts cannot
      supply the second author. Keep every necessary qualification and nested voice. Counts and missingness come
      only from the frozen overlap table, never the number of findings. The plan is context, never evidence. Distinguish
      bibliographic sharing, argumentative sharing and fidelity. A missing or unresolved witness cannot become an
      adverse verdict. Code checks identities, arithmetic and anchors; the model must explain what the passages
      warrant. No new quotation from memory, repaired OCR, stitched anchor or unsourced chapter title. Rejected,
      superseded, unresolved or anchor-failed rows cannot support retained prose or a table cell. Co-authored A+B
      texts are excluded from the comparison and retained only in a separate metadata annex. Unknown dates remain
      unknown. Do not claim influence, mutual reading, personal affiliation, ignorance or intent from shared names
      or scoped zeros.'
    indicators: []
    scope: corpus
    load_bearing: true
    id_prefix: O1
    answer_shape: '[O1.F<n>] <one bounded finding> — dim: works_overlap — person: <P_uid> — claim-kind: bibliographic|interpretive
      — work-rule: key|registry_work|edition — works-a: <keys> — works-b: <keys> — intersection: <keys> — unresolved:
      <entries> — metadata-refs: <rows> — author-a: <A_uid> — pair-row-a: <immutable ref or direct map row> — anchor:
      "<A exact passage>" — doc: <A original key> — locus: <A locus> — author-b: <B_uid> — pair-row-b: <immutable
      ref or direct map row> — anchor-b: "<B exact passage>" — doc-b: <B distinct original key> — locus-b: <B locus>;
      repeat labelled groups for every additional endpoint and qualification — confidence: high|medium|low'
  - key: passage_use
    name: Move and stance in the passage
    questions:
    - What does this author accomplish with P at this exact place in the argument?
    - Whose proposition is voiced, and which qualification changes the apparent move or stance?
    method_card: 'Do: On a citing_author document read the actual surrounding argument for every indexed canonical
      event. Emit proposition-specific rows, preserving reference/footnote/intext/mention kind. Use move authority|evidence|foil|dialogue|genealogy|illustration|courtesy|self-positioning
      and stance adopts|builds_on|qualifies|disputes|mentions. Keep adopted_framework from older engagement maps
      as an explicit inherited move or proposition qualifier; do not silently relabel it authority. A quote attributed
      to a reviewer or third party is not automatically A or B’s view. Unlocated ledger hits are explicitly unlocated;
      they support neither page verification nor a decisive comparison. Primary windows are outside this dimension;
      reading them does not license a new fidelity audit.


