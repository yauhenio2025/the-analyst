      unknown. Do not claim influence, mutual reading, personal affiliation, ignorance or intent from shared names
      or scoped zeros.'
    indicators: []
    scope: corpus
    load_bearing: true
    id_prefix: O4
    answer_shape: '[O4.F<n>] <one bounded finding> — dim: side_trajectory — author: <uid> — person: <P_uid> — relation:
      continuity|change|argument_hinge|unordered|insufficient — endpoints: <text keys/years/events> — alternative:
      <coverage or changed question> — anchor: "<earlier passage>" — doc: <earlier original key> — locus: <locus>
      — anchor-b: "<later passage>" — doc-b: <later original key> — locus-b: <locus> — confidence: high|medium|low'
  - key: asymmetry_verdict
    name: What sharing P means
    questions:
    - Is P a shared authority, one’s authority and the other’s foil, or a name covering different texts or readings?
    - Is courtesy or a consequential argumentative hinge confined to one side, and how much of the eligible evidence
      supports that judgment?
    method_card: 'Do: Give a primary verdict and optional coexisting tags: shared_authority|authority_vs_foil|same_person_different_texts|same_text_different_reading|courtesy_one_side|turning_point_one_side,
      plus mixed or unresolved. Name the authority/foil/courtesy/turning side by UID, not “first”. These tags can
      coexist. Joint authority requires substantive use on both sides; sparse counts alone prove neither courtesy
      nor a hinge. A one-sided hinge needs the argument’s before/after warrant and evidence of what the other side
      does, without asserting it never turns unless its full eligible scope was read. Give reliance a reasoned partial
      ordering with ties/incomparability, alongside weaker-side and normalized count measures labelled descriptive.


