    indicators: []
    scope: corpus
    load_bearing: true
    id_prefix: O5
    answer_shape: '[O5.F<n>] <one bounded finding> — dim: asymmetry_verdict — person: <P_uid> — verdict: <tag> —
      tags: <list> — affected-author: <uid or both> — joint-reliance: <argued assessment> — asymmetry: <bounded
      contrast> — inspected-a/b: <eligible denominators> — exception: <row or limit> — author-a: <A_uid> — pair-row-a:
      <immutable ref or direct map row> — anchor: "<A exact passage>" — doc: <A original key> — locus: <A locus>
      — author-b: <B_uid> — pair-row-b: <immutable ref or direct map row> — anchor-b: "<B exact passage>" — doc-b:
      <B distinct original key> — locus-b: <B locus>; repeat labelled groups for every additional endpoint and qualification
      — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 20
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - 'Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
      A cross-author interpretation requires at least one exact passage anchor from each author, with distinct original
      document keys and author-qualified event IDs; repeated copies, a shared P witness, and co-authored texts cannot
