    indicators: []
    scope: corpus
    load_bearing: true
    id_prefix: O3
    answer_shape: '[O3.F<n>] <one bounded finding> — dim: topic_alignment — person: <P_uid> — theme: <key/origin>
      — topic-a: <task> — topic-b: <task> — relation: agreement|complement|disagreement|different_question|unresolved
      — counterevidence: <rows or limit> — author-a: <A_uid> — pair-row-a: <immutable ref or direct map row> — anchor:
      "<A exact passage>" — doc: <A original key> — locus: <A locus> — author-b: <B_uid> — pair-row-b: <immutable
      ref or direct map row> — anchor-b: "<B exact passage>" — doc-b: <B distinct original key> — locus-b: <B locus>;
      repeat labelled groups for every additional endpoint and qualification — confidence: high|medium|low'
  - key: side_trajectory
    name: Each author’s dated trajectory
    questions:
    - How does each side’s use of P persist or change across dated texts?
    - Is a proposed turn in the argument visible in passages, or only in counts and publication dates?
    method_card: 'Do: Emit a separate trajectory for each author. A before/after claim needs that author in at least
      two distinct dated texts with ordered years; same-year material is unordered unless explicit sequence provenance
      is supplied. Quote every endpoint. Separate a turn within one text (argumentative hinge, with before/after
      clauses) from a career change. Report single-observation or unknown-date limits for the other side; do not
      invent a parallel trajectory. Distinguish altered works, topics and held coverage from conversion.


      Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
      A cross-author interpretation requires at least one exact passage anchor from each author, with distinct original
