# Review candidate; withheld until source reads, owner read and both-order validation.
engine_key: citation_overlap_map
engine_name: Two authors on a shared cited person
version: 1
category: scholarly
kind: comparison
problematique: What does each author do with this shared figure, and what does the comparison mean? Distinguish
  common names from common works, readings and argumentative reliance. Explain contrasts through the supplied passages
  and preserve the author axis, dated coverage and scoped residues.
researcher_question: What does each author do with this shared figure, and what does the comparison mean?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: works_overlap
  description: Which works of P are actually shared?
  probing_questions:
  - Which works of P does each side cite, and which are shared under the declared work-identity rule?
  - Is the apparent common person a shared text, different texts, different editions, or an unresolved bibliographic
    match?
- key: passage_use
  description: Move and stance in the passage
  probing_questions:
  - What does this author accomplish with P at this exact place in the argument?
  - Whose proposition is voiced, and which qualification changes the apparent move or stance?
- key: topic_alignment
  description: The question each side advances with P
  probing_questions:
  - Do both authors use P to answer the same question, or does a shared phrase conceal different explanatory tasks?
  - Where do comparable passages agree, disagree or remain incomparable?
- key: side_trajectory
  description: Each author’s dated trajectory
  probing_questions:
  - How does each side’s use of P persist or change across dated texts?
  - Is a proposed turn in the argument visible in passages, or only in counts and publication dates?
- key: asymmetry_verdict
  description: What sharing P means
  probing_questions:
  - Is P a shared authority, one’s authority and the other’s foil, or a name covering different texts or readings?
  - Is courtesy or a consequential argumentative hinge confined to one side, and how much of the eligible evidence
    supports that judgment?
apps:
- critic
function: genealogy
family: analytical
