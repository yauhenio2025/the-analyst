      and dated endpoint — confidence: high|medium|low'
  - key: residues_collective_partiality
    name: What lies outside the overlap
    questions:
    - Which figures belong only to each checked universe, and which merely fall below the shared threshold or top-K
      selection?
    - What can the residues and each side’s collective terms suggest within the actual coverage?
    method_card: 'Do: Read only context:overlap. Emit every R_A and R_B entry (including explicit empty lists),
      with own count, other-side checked zero and coverage/alias authority. Unshared means zero, not below threshold:
      put positive-but-below-threshold, unknown and unselected shared persons in separate lists. If only top 15
      is supplied, report a truncated residue sample with total size, rank rule, cutoff and omitted count; never
      “all unshared”. Significance is a hypothesis tied to supplied identity/tradition metadata, not a reading or
      evidence of ignorance. Collective terms have separate event IDs per side and never inflate person counts.
      Record held/inspected/missing texts and excluded A+B coauthors by key, threshold and works rule. Metadata
      alone permits no semantic finding.


