# Review candidate; withheld until source reads, owner read and both-order validation.
engine_key: citation_overlap_synthesis
engine_name: The shared canon of two authors
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: What do the shared and unshared figures reveal about these two citation universes?
  framing: 'What do the shared and unshared figures reveal about these two citation universes? Distinguish common
    names from common works, readings and argumentative reliance. Explain contrasts through the supplied passages
    and preserve the author axis, dated coverage and scoped residues.


    Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
    A cross-author interpretation requires at least one exact passage anchor from each author, with distinct original
    document keys and author-qualified event IDs; repeated copies, a shared P witness, and co-authored texts cannot
    supply the second author. Keep every necessary qualification and nested voice. Counts and missingness come only
    from the frozen overlap table, never the number of findings. The plan is context, never evidence. Distinguish
    bibliographic sharing, argumentative sharing and fidelity. A missing or unresolved witness cannot become an
    adverse verdict. Code checks identities, arithmetic and anchors; the model must explain what the passages warrant.
    No new quotation from memory, repaired OCR, stitched anchor or unsourced chapter title. Rejected, superseded,
    unresolved or anchor-failed rows cannot support retained prose or a table cell. Co-authored A+B texts are excluded
    from the comparison and retained only in a separate metadata annex. Unknown dates remain unknown. Do not claim
    influence, mutual reading, personal affiliation, ignorance or intent from shared names or scoped zeros.


    Do: Read final applied ledgers, with immutable overlap-row and pair-row references, as the evidence layer. Tables
    and memos are navigation, never additional witnesses. Every substantive synthesis finding inherits ALL anchors
    from every cited row, its pair::<author_uid>__<person_uid> or shared::<overlap_uid>__<person_uid> document key,
    original source key/locus, and canonical row lineage. Do not silently re-anchor or broaden the upstream claim.
    Cross-person claims need at least two distinct shared persons, with BOTH authors supported for EACH person compared.
    Metadata rows can establish counts, work identities, scoped residue and partiality only. If the evidence needs
    a new passage reading, return that question to the map. Keep optional fidelity verdicts attached to the exact
    side, assessed citation and held edition; never majority-vote or average them.


    Required input: overlap-packet/v1 assembled by the Mastermind from the approved overlap table, plan and completed
    map/pair jobs. Retain cohort row/anchor/hash primitives; add the authors axis and explicit side projections.
    The transport, identity admission, metadata-only routing and structured provenance sidecar described in the
    design are required runtime work. YAML loading alone proves none of these. The plan is not citable; context:overlap
    can support metadata only and cannot count as an author or person.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: shared_person_readings
    name: The preserved per-person comparison
    questions:
    - What does the final map establish about this shared person, and what remains uncertain?
    - Do its side-specific qualifications survive condensation into the overlap memo?
    method_card: 'Do: Read one shared-person document at a time. Preserve its works, passage uses, topics, trajectories
      and verdict; distinguish restating one map from a cross-person finding. Follow every inherited side-pair ref
      and preserve existing memo links. On table/plan documents return outside scope.


      Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
