  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 20
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - 'Do: Preserve the ordered authors axis as UIDs, never infer the side from prose, names or a document''s position.
      A cross-author interpretation requires at least one exact passage anchor from each author, with distinct original
      document keys and author-qualified event IDs; repeated copies, a shared P witness, and co-authored texts cannot
