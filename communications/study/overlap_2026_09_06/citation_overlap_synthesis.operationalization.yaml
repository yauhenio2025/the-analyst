  - key: convergence_periods
    name: Convergence and divergence over time
    questions:
    - When do the two citation universes converge or diverge in their use of the same figures?
    - Can the change be explained by changing holdings, interlocutors or different publication careers?
    method_card: 'Do: An overlap-level before/after finding needs at least two shared persons, both authors for
      each person, and two dated endpoints per author-person pair. Keep a single-person evolution under S1 and a
      one-side change explicitly one-sided. Use comparable calendar windows with their coverage, not automatically
      aligned ages or first/last citation years. Missing dates cannot anchor periods. Same-year sequence needs supplied
      ordering provenance. Mark replacement of figures as composition_shift rather than conversion; cite metadata
      and read every substantive endpoint. Do not infer mutual influence from convergence.


