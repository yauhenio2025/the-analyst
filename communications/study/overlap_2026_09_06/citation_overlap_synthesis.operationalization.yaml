      document key, original source key/locus, and canonical row lineage. Do not silently re-anchor or broaden the
      upstream claim. Cross-person claims need at least two distinct shared persons, with BOTH authors supported
      for EACH person compared. Metadata rows can establish counts, work identities, scoped residue and partiality
      only. If the evidence needs a new passage reading, return that question to the map. Keep optional fidelity
      verdicts attached to the exact side, assessed citation and held edition; never majority-vote or average them.'
    indicators: []
    scope: document
    load_bearing: true
    id_prefix: S1
    answer_shape: '[S1.F<n>] <one bounded finding> — dim: shared_person_readings — persons: <P_uid> — basis: shared_person_map
      — verdict: <inherited> — qualification: <limit> — overlap-rows: <immutable refs> — pair-rows: <all endpoint
      refs> — carried-anchors: <all inherited spans, author UIDs, original keys and loci> — anchor: "<A carried
      span>" — doc: <pair or shared document key> — source-doc: <A original key> — anchor-b: "<B carried span>"
      — doc-b: <pair or shared document key> — source-doc-b: <B distinct original key>; repeat groups for each shared
      person and dated endpoint — confidence: high|medium|low'
  - key: joint_reliance
    name: Joint reliance against asymmetry
    questions:
    - Which shared persons sustain both arguments, and which expose the sharpest unequal uses?
    - How does the explanatory ordering differ from the weaker-side citation-count selection order?
    method_card: 'Do: Compare at least two shared persons, with each author represented for each. Produce a reasoned
      partial ranking, retaining ties and incomparability: joint substantive reliance against differences of move,
      stance, text or topic. Display min(events_A,events_B), per-side event shares and inspected/eligible coverage
      separately. No formula converts counts into intellectual reliance. A rare consequential citation can outrank
      a repeated courtesy only with passage warrant. State the strongest exception.


