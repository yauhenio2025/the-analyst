  - key: side_fidelity
    name: Fidelity on each side where audited
    questions:
    - Where audits ran, which attributions are accurate, fair, selective, stretched, misattributed or unverifiable
      on each side?
    - Does the assessed coverage permit any comparison of reading practice across the overlap?
    method_card: 'Do: Retain each audit verdict and reason under its author-person pair, with A-or-B attribution
      AND P’s held primary witness, cited/held edition, locus, how and assessed/eligible denominator. Report not_run|unavailable
      separately from unverifiable. No new audit here. A one-side audit can yield that side’s scoped inventory only;
      no cross-author superiority. A cross-author fidelity pattern requires assessed verdicts for BOTH authors for
      EACH of at least two shared persons, comparable assessed propositions and explicit sampling limits. Unverifiable/rejected
      rows are coverage, never adverse verdicts. No averaged accuracy score.


