      key> — source-doc-b: <B distinct original key>; repeat groups for each shared person and dated endpoint —
      confidence: high|medium|low'
  - key: shared_canon
    name: The shape of the common canon
    questions:
    - Does the overlap look like a shared tradition, a debate, a common teacher, a house bibliography, or a mixture?
    - Which explanation survives differences of texts, genres, venues, dates and the unshared figures?
    method_card: 'Do: Treat tradition|debate|common_teacher|house_bibliography|mixed|unresolved as hypotheses tested
      across at least two shared persons and both sides of each. Common teacher needs explicit textual or supplied
      audited biographical evidence of teaching/acknowledgment; named together is insufficient. House bibliography
      needs supplied venue/editor metadata plus patterned courtesy references, not journal stereotyping. A tradition
      requires shared substantive propositions. A debate can share opponents. Keep collective terms as per-side
      metadata unless separate verified school-reading ledgers exist; do not allocate collective citations to persons.
      Give rival explanation and disconfirming row.


