      or scoped zeros.'
    - Check both author endpoints, every compared person, work identity rule, dated coverage and residue completeness;
      apply rulings to all final cells. Never count two authors as two shared persons.
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: a scholar with both authors’ passages open
    tables:
    - shared_person_side_counts
    - works_by_side
    - moves_stances_by_side
    - joint_reliance_asymmetries
    - overlap_periods
    - residues_by_side
    - fidelity_by_side
    brief: "Do: Follow the approved plan, lead with the supported comparison, and keep every substantive sentence\
      \ and table cell attached to final retained IDs. Preserve all immutable ancestry and original witnesses after\
      \ critic rulings. Unknowns remain unresolved; a count table cannot supply a semantic conclusion. Zero selected\
      \ shared persons yields metadata only; one yields a one-person comparison with residues, never a common-canon\
