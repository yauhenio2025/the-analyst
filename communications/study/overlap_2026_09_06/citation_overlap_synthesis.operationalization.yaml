  - key: overlap_disagreements
    name: Disagreement inside the overlap
    questions:
    - Where does one author adopt what the other contests, and do those readings address comparable propositions?
    - Do disagreements cluster around a theme, or merely share a person’s name?
    method_card: 'Do: Compare final proposition-level moves/stances from at least two shared persons with both author
      endpoints. Separate direct disagreement, distinct questions and divergent texts. A one-person disagreement
      is reported under S1, not inflated to a pattern. Keep same-text different-reading distinct from accuracy:
      incompatible uses do not establish which reading is faithful. Quote all qualifications and retain counterexamples.


