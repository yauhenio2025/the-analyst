# Review candidate; withheld until source reads, owner read and both-order validation.
engine_key: citation_overlap_synthesis
engine_name: The shared canon of two authors
version: 1
category: scholarly
kind: comparison
problematique: What do the shared and unshared figures reveal about these two citation universes? Distinguish common
  names from common works, readings and argumentative reliance. Explain contrasts through the supplied passages
  and preserve the author axis, dated coverage and scoped residues.
researcher_question: What do the shared and unshared figures reveal about these two citation universes?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: shared_person_readings
  description: The preserved per-person comparison
  probing_questions:
  - What does the final map establish about this shared person, and what remains uncertain?
  - Do its side-specific qualifications survive condensation into the overlap memo?
- key: joint_reliance
  description: Joint reliance against asymmetry
  probing_questions:
  - Which shared persons sustain both arguments, and which expose the sharpest unequal uses?
  - How does the explanatory ordering differ from the weaker-side citation-count selection order?
- key: shared_canon
  description: The shape of the common canon
  probing_questions:
  - Does the overlap look like a shared tradition, a debate, a common teacher, a house bibliography, or a mixture?
  - Which explanation survives differences of texts, genres, venues, dates and the unshared figures?
- key: overlap_disagreements
  description: Disagreement inside the overlap
  probing_questions:
  - Where does one author adopt what the other contests, and do those readings address comparable propositions?
  - Do disagreements cluster around a theme, or merely share a person’s name?
- key: convergence_periods
  description: Convergence and divergence over time
  probing_questions:
  - When do the two citation universes converge or diverge in their use of the same figures?
  - Can the change be explained by changing holdings, interlocutors or different publication careers?
- key: residues_collective_partiality
  description: What lies outside the overlap
  probing_questions:
  - Which figures belong only to each checked universe, and which merely fall below the shared threshold or top-K
    selection?
  - What can the residues and each side’s collective terms suggest within the actual coverage?
- key: side_fidelity
  description: Fidelity on each side where audited
  probing_questions:
  - Where audits ran, which attributions are accurate, fair, selective, stretched, misattributed or unverifiable
    on each side?
  - Does the assessed coverage permit any comparison of reading practice across the overlap?
apps:
- critic
function: genealogy
family: analytical
