  - key: school_fidelity
    name: The reach and fidelity of A’s reading
    questions:
    - Across audited members, on what propositions is A’s reading accurate, fair, selective, stretched, misattributed
      or unverifiable?
    - Do those local verdicts support a characterization of A’s reading of the school, and which missing works or
      contrary verdicts constrain it?
    method_card: 'Do: Read only final citable fidelity-audit verdicts, preserving their reasons, A-side and P-side
      anchors, editions, retrieval how and canonical citation IDs. Show every verdict by member without majority
      voting or averaging. Count each assessed citation once and distinguish not run, unverifiable and rejected
      evidence. A school-level characterization requires assessed verdicts for at least two members and explicit
      denominators; with one audit provide only its member-level entry and state insufficient school coverage. An
      unverifiable row can report a missing witness but cannot support a fidelity judgment. No supplied contrary
      primary witness means no new stretched or misattributed verdict. This engine never re-audits a text from memory.


