    - Check every member endpoint, event-count denominator, dated trajectory and attribution chain. Preserve contrary
      rows and disputed membership. Distinguish not_run from unverifiable and zero from missing. Rulings apply to
      every final cell and prose citation; no rejected row survives.
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: a scholar of A with the pair ledgers and original cited passages open
    tables:
    - member_text_year_counts
    - member_move_stance
    - fidelity_by_member
    - not_engaged_members
    - cohort_periods
    brief: 'Do: Follow the approved plan''s section order while answering only questions supported by this packet.
      Lead with an argued cross-member reading, then the asymmetries, qualified periodization, audited fairness
      and scoped silence. Cite final cohort IDs in every substantive sentence and positive table cell; those IDs
      resolve to immutable pair rows AND their carried verbatim anchors. A row that repeats one pair''s interpretation
      is labelled as such, not a cross-member finding. With fewer than two engaged pairs produce a clearly limited
      one-pair coverage report plus the full residue, never a simulated school synthesis. With no engaged pairs
      produce the metadata report only. Missing optional lenses reduce the claim, not the cohort.


      Reconcile every final table cell after critic rulings and anchor walls. Do not leave a rejected, superseded,
      anchor-failed or dangling row in a table or prose; multiple supporting rows retain separate anchors. Coverage
      counts canonical citation events, not findings or memo restatements. Tables and memo copies are navigation,
      not independent corroboration. A refusal lists missing required artifacts before any interpretive output.


      Render the following tables with these columns:

      member_text_year_counts: member UID/name | membership reason [cohort-row] | engaged yes/no/unknown | A text
      key/title | year or unknown | canonical citation events | mentions | bibliography-only | inspected events/eligible
      | works cited | cohort-row refs. One row per member × A text × year, including explicit scoped zeros. A separate
      member-total row uses unique events, never sums duplicated renditions; collective-school events have their
      own identity.

      member_move_stance: member | A text/year | canonical event(s) | proposition | move | stance | inherited qualification
      | final cohort finding IDs | immutable pair-row refs | verbatim carried anchors | original doc keys/loci.
      Give separate cells/rows for distinct propositions; all substantive cells have complete evidence.

      fidelity_by_member: member | citation-event/audit-pair ID | A attribution | P position | verdict | reason
      | how (page/section/search when retrieved) | edition/locus | audited/eligible counts | final cohort finding
      IDs | immutable fidelity-row refs | A and P carried anchors. Preserve not_run, unverifiable and rejected counts
      outside the citable verdict totals; no averaged school score.

      not_engaged_members: member | role/reason for membership | engaged: no; not engaged in checked corpus | explicit
      ledger zero | checked texts/years and alias-resolution scope | cohort-row ID and verbatim metadata anchor
      | limits/possible significance (hypothesis only). Include every residue member once. With a verified empty
      residue say “none in the approved checked cohort”; unknowns get a separate unresolved list.

      cohort_periods: proposed period | members and dated A texts | continuity/change/composition shift | alternative/exception
      | final cohort finding IDs | all immutable endpoint refs and their carried anchors. If unsupported, one unresolved
      entry stating why; never fill periods from biography.


      The partiality paragraph must enumerate the approved cohort and disputed/excluded membership boundaries; A''s
      held, inspected and missing texts and dates, coauthored coverage and ledger/alias/search completeness; each
      member''s cited, held, fetched and still-wanted works and edition/translation or section/page ambiguities;
      engaged pairs supplied versus awaiting analysis; canonical events eligible/inspected/assessed, rejected rows
      and failed anchors; which fidelity and reception lenses ran or did not run and their checked denominators;
      collective-school mentions not allocated to people; unknown years; synthetic fixture content (if any, output
      is never release evidence); and the precise scope of silence and any periodization. Distinguish no evidence
