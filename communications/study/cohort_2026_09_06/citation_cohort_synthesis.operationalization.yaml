  - key: school_periodization
    name: A’s changing engagement with the school
    questions:
    - What persists or changes in A’s treatment of the cohort across dated texts, and which members carry each period?
    - Is an apparent shift a change in A’s position, a change of interlocutor, or a change in the supplied coverage?
    method_card: 'Do: Align dated propositions across at least two engaged members and at least two dated A texts
      before making a school-level period claim. For a before/after trajectory of a member require that member on
      both sides; a replacement of members is a compositional shift, not a conversion of either. Supply every endpoint
      row and qualifying span. Preserve coauthorship and unknown dates; same-year texts have no order unless explicit.
      Use periods as provisional model judgments, never bins generated by code or a career story supplied by the
      plan. When only one pair supports a trajectory keep it under member_uses as a reported pair trajectory and
      say school periodization is unresolved.


