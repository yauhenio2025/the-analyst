  - key: reception_alignment
    name: Optional reception comparisons across members
    questions:
    - Where the reception lens ran, how does A’s position align with or oppose held readers on the plan’s themes?
    - Which apparent interlocutors are reference points only, and which engagements or silences have ledger evidence?
    method_card: 'Do: Use supplied reception-map rows for at least two members; otherwise report the one-pair comparison
      under member_uses or state lens not run. Keep plan_spine versus reader_addition, reader identity, reference-point
      role and excerpt scope. Analytical consonance is not demonstrated citation or influence. “Never engages” needs
      A-to-reader citation-ledger zeros with checked scope, not absence from the reception sample. Do not expand
      the cohort from reception readers or import their words as A’s.


