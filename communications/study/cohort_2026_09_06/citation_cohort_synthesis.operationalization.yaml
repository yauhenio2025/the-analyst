# Design candidate; no production registration before live validation.
engine_key: citation_cohort_synthesis
engine_name: Engagement with a school across its members
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: How does this author use, contest and selectively read the members of this cohort across the supplied
    work?
  framing: 'A school is neither a single author nor the sum of its citation counts. Reconstruct A''s pattern of
    reliance, authority, evidence, foil and dialogue across the approved members, the imbalance between frequency
    and argumentative consequence, and the dated changes that the pair ledgers support. Preserve the cohort''s non-engaged
    residue and contested membership. Judge the reach and fidelity of A''s reading only through the supplied audits.
    Distinguish a school named collectively from an engagement with a named person. The result is a scholarly reading
    with auditable tables, bounded by the work actually held and checked.


    Do: Treat the pair ledgers as the evidence layer and pair tables and memos as navigation. Every substantive
    finding cites an immutable pair-row reference (<A_uid>__<P_uid>::<engine_key>::<row_id>) AND copies a verbatim
    anchor carried by that very row, with its pair document key and original source key/locus. Copy the scholar''s
    words without correction or fresh quotation from memory. When the inherited anchor is insufficient, narrow the
    claim or request a new pair analysis; never silently re-anchor in this engine. For a cross-member claim supply
    separate anchor/row/doc groups for every member and every qualification needed, at least two distinct engaged
    member keys. Two engines, texts or memo restatements of one pair do not make two members. Rejected, unresolved-anchor
    and superseded rows cannot support prose or a table cell. Check nested attribution, coauthorship, modality,
    edition, dates and counterevidence in the inherited context; code checks shape and provenance, the model judges
    what the passages warrant. A restatement links its canonical row; never file or count it twice. The plan orders
    questions; it is not evidence. Cohort metadata citations are allowed only for membership, recorded counts, coverage
    and not-engaged reports, with an exact cohort-row anchor and explicit metadata basis. A missing analysis or
    unknown count is not zero engagement.


    Required input: cohort-packet/v1, one author UID, approved cohort table with explicit not_engaged_residue (including
    [] when empty), role: plan, one document per engaged pair keyed pair::<A_uid>__<P_uid>, each with a final engagement-map
    ledger. Fidelity/reception ledgers optional. Refuse missing engagement ledgers, absent residue, inconsistent
    identities, count conflicts, and invalid or unverifiable provenance before calls. The transport/preflight adapter
    described in the memo is required; YAML alone does not enforce admission.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: member_uses
    name: Each member’s argumentative work
    questions:
    - For each engaged member, what proposition does A take over, use as authority or evidence, contest as a foil,
      or develop in dialogue?
    - Which exact pair rows establish the move and stance, and which inherited qualification prevents a global label
      for this member?
    method_card: 'Do: Read each supplied pair’s engagement-map ledger first. Join move, stance, text and cited work
      by citation-event ID, not adjacency or matching theme. Retain adopted framework, authority, evidence, foil,
      dialogue, genealogy, illustration, courtesy and self-positioning as distinct moves, and adopts, builds_on,
      qualifies, disputes and mentions as proposition-specific stances. Use an optional reception row only as a
      labelled comparison, never as evidence A read that reader. On the cohort and plan return outside scope.


      Do: Treat the pair ledgers as the evidence layer and pair tables and memos as navigation. Every substantive
      finding cites an immutable pair-row reference (<A_uid>__<P_uid>::<engine_key>::<row_id>) AND copies a verbatim
      anchor carried by that very row, with its pair document key and original source key/locus. Copy the scholar''s
      words without correction or fresh quotation from memory. When the inherited anchor is insufficient, narrow
      the claim or request a new pair analysis; never silently re-anchor in this engine. For a cross-member claim
      supply separate anchor/row/doc groups for every member and every qualification needed, at least two distinct
      engaged member keys. Two engines, texts or memo restatements of one pair do not make two members. Rejected,
      unresolved-anchor and superseded rows cannot support prose or a table cell. Check nested attribution, coauthorship,
      modality, edition, dates and counterevidence in the inherited context; code checks shape and provenance, the
      model judges what the passages warrant. A restatement links its canonical row; never file or count it twice.
      The plan orders questions; it is not evidence. Cohort metadata citations are allowed only for membership,
      recorded counts, coverage and not-engaged reports, with an exact cohort-row anchor and explicit metadata basis.
      A missing analysis or unknown count is not zero engagement.'
    indicators: []
    scope: document
    load_bearing: true
    id_prefix: C1
    answer_shape: '[C1.F<n>] <one bounded finding> — dim: member_uses — pair: <pair key> — member: <P_uid> — event-ids:
      <canonical events> — move: <move> — stance: <stance> — proposition: <bounded proposition> — limit: <qualification>
      — pair-row: <immutable pair-row ref> — anchor: "<verbatim anchor carried by that row>" — doc: <pair::<pair
      key>> — source-doc: <original key> — locus: <inherited printed/PDF page or registry section> — confidence:
      high|medium|low'
  - key: cohort_residue
    name: Membership, counts and the members not engaged
    questions:
    - Which approved members are engaged, not engaged, or unresolved according to the checked citation ledger, and
      why was each included?
    - What exact corpus, date range, alias resolution and counting unit make a recorded zero meaningful?
    method_card: 'Do: Read only role: cohort for this dimension. Emit one not engaged row for every member in not_engaged_residue,
      quoting its cohort row; give the membership reason, ledger zero, search scope and limit, never a reading of
      that member. Emit unresolved rather than not engaged for incomplete identity resolution or unchecked counts.
      An engaged member lacking a required engagement ledger is a refusal before execution, not a negative finding.
      An empty residue is valid only when explicitly supplied and reconciled to the complete approved table. Count
      canonical citation events per member/text/year, keeping mention, bibliographic and collective-school events
      separate. Explain silence as a bounded observation. Any suggestion about its intellectual significance must
      be explicitly hypothetical and linked to a documented membership reason; never infer intent or ignorance.


