  - key: cross_member_reliance
    name: Reliance and opposition across members
    questions:
    - Whose framework does A build on, whose authority or evidence does A invoke, and whom does A make a foil or
      dialogue partner?
    - Does the contrast concern comparable propositions and texts, or different parts of the school; what would
      weaken the proposed ordering?
    method_card: 'Do: Compare at least two engaged members through their engagement rows on named propositions.
      Give an argued partial ordering of reliance with ties and incomparability, not a score computed from frequency.
      Distinguish borrowing a framework from citing an authority and distinguish an interlocutor from a foil. Preserve
      indirect engagement A → P → Q without turning it into a direct A → Q citation. Keep a collective-school address
      separate from personal pairs; its supporting rows cannot be allocated to a member by inference.


