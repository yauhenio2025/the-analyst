  - key: engagement_asymmetries
    name: Frequency, concentration and consequence
    questions:
    - Which member recurs frequently around one idea, and which appears rarely at a consequential turn in A’s argument?
    - Do event counts and inspected readings warrant that asymmetry, and what proportion of the ledger remains unread?
    method_card: 'Do: Pair authoritative cohort event counts with engagement-map rows that show what the citations
      do. Frequency alone cannot establish influence, narrowness, neglect or a turning point. For “only one idea”
      require inspected coverage of all relevant canonical events, report the denominator and include the strongest
      exception; otherwise say “in the inspected passages.” For a turning point require an inherited reading of
      the argument’s change, not merely a single citation or a new publication year. If one side lacks that warrant,
      retain the numerical asymmetry and mark consequence unsettled.


