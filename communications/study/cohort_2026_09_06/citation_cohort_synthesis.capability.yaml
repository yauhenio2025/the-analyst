# Design candidate; no production registration before live validation.
engine_key: citation_cohort_synthesis
engine_name: Engagement with a school across its members
version: 1
category: scholarly
kind: comparison
problematique: A school is neither a single author nor the sum of its citation counts. Reconstruct A's pattern of
  reliance, authority, evidence, foil and dialogue across the approved members, the imbalance between frequency
  and argumentative consequence, and the dated changes that the pair ledgers support. Preserve the cohort's non-engaged
  residue and contested membership. Judge the reach and fidelity of A's reading only through the supplied audits.
  Distinguish a school named collectively from an engagement with a named person. The result is a scholarly reading
  with auditable tables, bounded by the work actually held and checked.
researcher_question: How does this author use, contest and selectively read the members of this cohort across the
  supplied work?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: member_uses
  description: Each member’s argumentative work
  probing_questions:
  - For each engaged member, what proposition does A take over, use as authority or evidence, contest as a foil,
    or develop in dialogue?
  - Which exact pair rows establish the move and stance, and which inherited qualification prevents a global label
    for this member?
- key: cohort_residue
  description: Membership, counts and the members not engaged
  probing_questions:
  - Which approved members are engaged, not engaged, or unresolved according to the checked citation ledger, and
    why was each included?
  - What exact corpus, date range, alias resolution and counting unit make a recorded zero meaningful?
- key: cross_member_reliance
  description: Reliance and opposition across members
  probing_questions:
  - Whose framework does A build on, whose authority or evidence does A invoke, and whom does A make a foil or dialogue
    partner?
  - Does the contrast concern comparable propositions and texts, or different parts of the school; what would weaken
    the proposed ordering?
- key: engagement_asymmetries
  description: Frequency, concentration and consequence
  probing_questions:
  - Which member recurs frequently around one idea, and which appears rarely at a consequential turn in A’s argument?
  - Do event counts and inspected readings warrant that asymmetry, and what proportion of the ledger remains unread?
- key: school_periodization
  description: A’s changing engagement with the school
  probing_questions:
  - What persists or changes in A’s treatment of the cohort across dated texts, and which members carry each period?
  - Is an apparent shift a change in A’s position, a change of interlocutor, or a change in the supplied coverage?
- key: school_fidelity
  description: The reach and fidelity of A’s reading
  probing_questions:
  - Across audited members, on what propositions is A’s reading accurate, fair, selective, stretched, misattributed
    or unverifiable?
  - Do those local verdicts support a characterization of A’s reading of the school, and which missing works or
    contrary verdicts constrain it?
- key: reception_alignment
  description: Optional reception comparisons across members
  probing_questions:
  - Where the reception lens ran, how does A’s position align with or oppose held readers on the plan’s themes?
  - Which apparent interlocutors are reference points only, and which engagements or silences have ledger evidence?
apps:
- critic
function: genealogy
family: analytical
