# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: quote_attribution_voice
engine_name: Whose voices count
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Whose voices appear in the text, and what authority or role is each given? A text or collection with
    quoted, reported or narrated voices.
  framing: A speaker-and-statement inventory with direct/reported/narrating level, quoted proposition, the authority
    or objection it supplies, and the narrator’s stance. A voice-relation table makes nested attribution and disagreement
    visible without numerical authority rankings. Preserve the original core question and speaker/quote/function
    coverage. Translate the legacy noun checklist into questions. Replace obligatory dominance metrics with declared
    counted scope; nested quotations require separate speaker and reporting voice.
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: speakers
    id_prefix: D1
    name: Speakers and statements
    scope: document
    load_bearing: true
    questions:
    - Who is speaking, what are they saying, and why does their voice matter?
    answer_shape: '[D1.F<n>] <one source-scoped finding> — dim: speakers — speaker: <value or unknown> — statement:
      <value or unknown> — reporting-voice: <value or unknown> — anchor: "<literal actor and predicate span, <=200
      chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Identify each speaker from an explicit attribution span and keep the full attributed predicate.
      A bibliography entry alone is not a speaking voice. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - writes
    - argues
    - according to
  - key: attribution
    id_prefix: D2
    name: Attribution levels
    scope: document
    load_bearing: true
    questions:
    - Which words are directly quoted, paraphrased or reported through another speaker?
    answer_shape: '[D2.F<n>] <one source-scoped finding> — dim: attribution — utterance: <value or unknown> — direct-or-reported:
      <value or unknown> — attribution-chain: <value or unknown> — anchor: "<literal actor and predicate span, <=200
      chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Trace nested quotations without collapsing the essayist, commentator and quoted author. Use
      a second span for an antecedent outside the quoted clause. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - quotes
    - citing
    - in her reading
  - key: functions
    id_prefix: D3
    name: Roles in the argument
    scope: document
    load_bearing: true
    questions:
    - What claim does this voice support, qualify, exemplify or oppose in this passage?
    answer_shape: '[D3.F<n>] <one source-scoped finding> — dim: functions — voice: <value or unknown> — role: <value
      or unknown> — claim: <value or unknown> — anchor: "<literal actor and predicate span, <=200 chars>" — doc:
      <source key> — confidence: high|medium|low'
    method_card: 'Do: Anchor both the statement and its uptake; a quoted position is not automatically endorsed.
      Select literal spans that together carry the finding’s actor, predicate, object and necessary qualification.
      If one span of at most 200 characters cannot do so, use anchor-b/doc-b for another span, including within
      one document. Do not join separated text or normalize a quote into invented wording. Retain both poles of
      a contrast. A verbatim name or prefix without the claimed predicate is insufficient: re-anchor, narrow or
      reject it. Keep source voice, status, chronology and uncertainty in the final claim. No scope record supplies
      positive evidence.'
    indicators:
    - against
    - follows
    - criticizes
  - key: relations
    id_prefix: D4
    name: Agreement and disagreement
    scope: document
    load_bearing: false
    questions:
    - Where does the narrator align or contrast the voices on the same question?
    answer_shape: '[D4.F<n>] <one source-scoped finding> — dim: relations — voice-a: <value or unknown> — voice-b:
      <value or unknown> — question: <value or unknown> — relation: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Keep both attributed positions with their qualifications. Reconcile an apparent reversal by
      rereading speaker boundaries. Select literal spans that together carry the finding’s actor, predicate, object
      and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b for another
      span, including within one document. Do not join separated text or normalize a quote into invented wording.
      Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - however
    - whereas
    - instead
  - key: coverage
    id_prefix: D5
    name: Voice distribution and limits
    scope: document
    load_bearing: false
    questions:
    - Which voices recur in the inspected argument, and what does the text establish about their roles or absence?
    answer_shape: '[D5.F<n>] <one source-scoped finding> — dim: coverage — voice: <value or unknown> — inspected-section:
      <value or unknown> — recurrence: <value or unknown> — limit: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Distinguish a reading inventory from exhaustive quote counting. Put scoped missing-voice searches
      in scope records; do not infer deliberate silencing. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - introduction
    - conclusion
    - quotation
  - key: across_sources
    id_prefix: X6
    name: Aligned objects across supplied sources
    scope: corpus
    load_bearing: false
    questions:
    - Which supplied sources address the same object on this method’s question, and what aligned agreement or difference
      do their passages support?
    answer_shape: '[X6.F<n>] <scoped relation> — dim: across_sources — object: <aligned object> — relation: <agreement
      or difference> — anchor: "<literal supporting span>" — doc: <A> — anchor-b: "<literal supporting span>" —
      doc-b: <different B> — confidence: high|medium|low'
    method_card: 'Do: Establish a local inventory in each supplied document first. Match identity, question, time
      and scope before relating findings. Preserve two distinct source keys and the predicate on each side. One
      article quoting several authors is still one supplied document. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - same object in two sources
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the source open who needs to answer: Whose voices appear in the text, and what authority
      or role is each given?'
    tables:
    - quote_attribution_voice_inventory
    - quote_attribution_voice_relations
    brief: '1. A speaker-and-statement inventory with direct/reported/narrating level, quoted proposition, the authority
      or objection it supplies, and the narrator’s stance. A voice-relation table makes nested attribution and disagreement
      visible without numerical authority rankings.

      2. Lead with the most consequential supported distinction, organized around source objects and questions.
      Useful inventory coverage is the deliverable; do not force a novel thesis.

      3. Render the two named Markdown tables, with explicit limits and citable rows; end with what is established
      and the evidence still needed.

      4. With multiple supplied texts, establish local inventories before an aligned relation; with one text do
      not pretend there is a supplied corpus.

      Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
