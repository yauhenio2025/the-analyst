engine_key: field_investigation_adjudicate
engine_name: Adjudicate tensions and revise the account
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Adjudicate tensions and revise the account
  framing: 'Investigate a bilateral question between a named thinker and a topical
    research field. The field is a collection of independently authored arguments,
    competing mechanisms, methods and cases, never a homogeneous position and never
    merely secondary commentary on the thinker. Identify what each side can teach
    or challenge in the other, and what should change in the researcher''s own account.
    Distinguish description, causal explanation, normative commitments, strategy,
    historical scope, level of analysis, and conditions of applicability. A field
    author''s finding is not the thinker''s claim: only a verified quotation from
    a supplied primary source can support thinker attribution. A proposed extension
    or application belongs explicitly to this inquiry. Prior memos and profiles are
    provisional context, not primary testimony; compare against them when supplied
    and work independently when they are absent. Attribute coauthors, interviewers,
    opponents and quoted speakers carefully. Edition/reprint dates do not establish
    a new intervention. Search hits guide reading; lexical silence, missing texts,
    excluded sources and inspected windows cannot establish absence across an oeuvre
    or field. Keep counterevidence, qualifications and unresolved cases. Use only
    supplied evidence identities and exact source anchors; never invent a quote, page,
    author position, event or factual claim. Inspected ranges and coverage constrain
    every conclusion. Method interpretation is not mechanically verified by a citation
    match. If validation_errors and a previous_draft are supplied, reconsider the
    identified unsupported claims against the same evidence and return a complete
    corrected output; preserve uncertainty and never manufacture support identities
    or quotations. When field_evidence_representation is reference_index_to_supplied_argument_maps,
    the complete original field support identities are retained while quotations live
    in the durable source readings. Use only claims and meanings present in the supplied
    argument maps; do not infer new details from an evidence identity. Evidence selection
    or compression never licenses an absence claim.'
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: judgment
    name: Judge compatibility, tension and evidence
    questions:
    - Use thinker_position only with primary evidence_ids, field_finding only with
      field evidence_ids, and comparison only with evidence from BOTH populations.
      An unresolved claim may lack support but cannot assert facts. Explain the warrant,
      alternative interpretation, level/scale mismatch and what would reverse the
      judgment. Do not award generic convergence by common vocabulary.
    method_card: Use thinker_position only with primary evidence_ids, field_finding
      only with field evidence_ids, and comparison only with evidence from BOTH populations.
      An unresolved claim may lack support but cannot assert facts. Explain the warrant,
      alternative interpretation, level/scale mismatch and what would reverse the
      judgment. Do not award generic convergence by common vocabulary.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E1
    answer_shape: '[E1.F<n>] <finding in one sentence> — dim: judgment — claim_kind:
      thinker_position|field_finding|comparison|unresolved — evidence_ids: <semicolon-separated
      exact supplied uid/E1.Fn identities; no invented ids> — relation: compatible|tension|scope_difference|revision|unresolved
      — warrant: <why> — counterevidence: <strongest contrary evidence or explicit
      gap> — anchor: "<verbatim supplied passage, <=200 chars>" — doc: <actual supplied
      source key> — confidence: high|medium|low'
  - key: revision
    name: Specify what should change
    questions:
    - Compare the researcher's conclusion with the actual supplied prior baseline,
      or mark standalone when no prior exists. Preserve positions that survive, revise
      overbroad claims, add new distinctions and leave insufficiently supported claims
      open. A revision to the researcher's account is not a historical change in the
      thinker's beliefs.
    method_card: Compare the researcher's conclusion with the actual supplied prior
      baseline, or mark standalone when no prior exists. Preserve positions that survive,
      revise overbroad claims, add new distinctions and leave insufficiently supported
      claims open. A revision to the researcher's account is not a historical change
      in the thinker's beliefs.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E2
    answer_shape: '[E2.F<n>] <finding in one sentence> — dim: revision — disposition:
      changed|retained|new|unresolved — baseline: prior|standalone — before: <actual
      prior position or no prior> — after: <bounded revised position> — evidence_ids:
      <exact verified supporting identities> — anchor: "<verbatim supplied passage,
      <=200 chars>" — doc: <actual supplied source key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 35
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the researcher developing a position through the thinker and field
    brief: Write an explicit adjudication across the thinker and the field. Which
      apparent contradictions dissolve after distinguishing scale, scope or normative
      from causal claims? Which survive, and which side supplies stronger evidence
      for a bounded conclusion? State warranted extensions as this inquiry's proposals.
      Preserve counterevidence and questions. Then give the judgment ledger.
    max_rows: 60
  method_refs:
  - engine_key: multimedia_source_criticism
    version: 1
  - engine_key: causal_mechanism_audit
    version: 1
  - engine_key: concept_case_stress_test
    version: 1
  - engine_key: institutional_argument_criticism
    version: 1
version: 2
