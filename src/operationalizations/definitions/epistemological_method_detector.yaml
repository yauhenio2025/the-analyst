engine_key: epistemological_method_detector
engine_name: Epistemological Method Detector
# The process shape (2026-09-05): communications/study/REDESIGN_epistemological_method_detector_2026-09-05.md
# No stance operationalizations: the capability YAML's passes are reference only.
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: 'How the TEXT knows what it claims: what it counts as evidence, whose testimony it credits, where
    it speaks from and what it claims beyond that, what it professes about knowing against what it practises, and
    whether its standards apply to itself. Read off the page; never a claim about the authors'' identity or motives.'
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: evidence
    id_prefix: E1
    name: What counts as evidence
    load_bearing: true
    questions:
    - What is the text trying to establish, and what procedure does it enact? Distinguish a method it studies,
      a method it advocates, and the method it uses; quote the passages assigning those roles.
    - What kinds of evidence does the text use (primary passages, historical scholarship, documents, interviews,
      figures, cases), and what is each asked to establish? Quote one use of each and compare the stated procedure.
    - What does the text treat as settled without supplying the needed warrant? Distinguish a quotation establishing
      a source's position from a citation credited for the truth of a substantive claim.
    - Where does the text claim to suspend an assumption, and what is the first assumption it does not suspend?
    answer_shape: '[E1.F<n>] Evidence kind <kind> establishes <what> — dim: evidence — anchor: "<verbatim>" — sufficient-for:
      <the claim it carries> — method-role: studied|advocated|enacted|not applicable — confidence: …'
    method_card: 'Quine and Dewey. Do: identify the inquiry''s object and inventory its enacted knowing, keeping
      discussed and advocated methods distinct. Match evidence kinds to the claims they carry. Primary textual
      passages can establish interpretations; cited historical research supplies historical premises. Assess the
      actual warrant before demanding another genre of evidence. If the text brackets assumptions, quote the
      bracket and first assumption left standing; absence of bracketing is not itself a defect.'
    indicators:
    - '"we draw on", "archival", "interviews", "data"'
    - a source's position used as evidence for a further substantive claim
    - '"it is well established", "as is widely recognised"'
  - key: testimony
    id_prefix: E2
    name: Whose testimony is credited
    load_bearing: true
    questions:
    - Who is quoted as an authority, and for what kind of claim? Distinguish the position being interpreted or
      criticized from testimony credited as true. Quote one instance each.
    - Who is dismissed, and by what device (a label, a group citation, "vague", "insider", a single sentence)? Quote
      the device.
    - Whose experience or account does the argument concern and never hears (workers, officials, the actors explained)?
      Anchor to the claim made about them and specify which kind of knowledge this absence limits.
    - Where does the text credit a source's conclusion while rejecting the source's framework? Quote both.
    answer_shape: '[E2.F<n>] <who> is credited|dismissed|absent for <what> — dim: testimony — device: <label|citation|silence>
      — anchor: "<verbatim>" — confidence: …'
    method_card: 'Fricker. Do: list who speaks with authority in the text and who is spoken about; for every dismissal
      name the device that does it. Distinguish quotations establishing a target''s position from authority credited
      for a substantive claim. Ask whose experience is heard and which kind of knowledge its absence limits; note
      selective borrowing from a source whose framework the text rejects.'
    indicators:
    - '"as X argues", "X shows"'
    - '"vague concepts", "insider baseball", "commentary"'
    - actors explained by class or interest with no account of their own
  - key: position
    id_prefix: E3
    name: Where the text speaks from
    load_bearing: true
    questions:
    - What does the text say about where it speaks from — its discipline, its "we", its acknowledged limits? Quote
      it.
    - Which claims exceed what the stated sources and inferences establish — a generalisation from two cases,
      an attributed intention, an unsupported conceptual bridge? Quote the claim and relevant scope statement;
      specify whether its missing warrant is interpretive, empirical, constitutive, or normative.
    - Does the text use a standpoint (a position from which others' bias is visible) and does it turn that standpoint
      on itself? Quote both or say where it stops.
    - Where does the text write as if from nowhere (no agent, passive voice, "it is clear") about contested matters?
      Quote it.
    answer_shape: '[E3.F<n>] Claim <what> is supported|under-supported by <actual sources or inference> — dim: position
      — warrant-kind: interpretive|empirical|constitutive|normative — position: <stated context or limit>
      — anchor: "<claim>" — anchor-b: "<scope or evidential passage>" — confidence: …'
    method_card: 'Haraway and Harding. Do: locate the knower through stated position, sources and limits. Test
      the warrant appropriate to each claim; disciplinary identity alone does not establish incapacity. Separate
      claims about actual collective beliefs from claims about what those beliefs constitute. Inspect the context
      before calling a truth claim unlocated; ask whether the standpoint used to expose others'' bias is also
      examined when it bears on the text''s own claim.'
    indicators:
    - '"we", "our approach", "this paper"'
    - '"it is clear", "obviously", agentless passives'
    - two cases → a general law
  - key: professed_practised
    id_prefix: E4
    name: Professed against practised
    load_bearing: true
    questions:
    - What epistemic modesty does the text profess — hedges, "partial", "tentative", "only part of the story"? Quote
      it and name the claim it qualifies, including conditions and whether it is a future proposal.
    - What are the text's evidential verbs where it makes its central claims ("we observe", "attests", "clearly",
      "what is discernible")? Quote them.
    - Which framework does the text use in one section and drop in another? Quote both.
    - What would revise the central claim, and does the text say? Quote the closest it comes.
    answer_shape: '[E4.F<n>] Professed <modesty|method> compared with practised <certainty|method> concerning <same claim>
      — dim: professed_practised — relation: aligned|qualified|in tension — anchor: "<professed>"
      — anchor-b: "<practised>" — confidence: …'
    method_card: 'Dewey, warranted assertibility. Do: compare professions and practice concerning the same claim,
      retaining its conditions. Brief presentation, a tentative extension, and a firm conclusion need not conflict.
      Distinguish a framework dropped from one selectively revised; ask what would revise the claim. An unstated
      revision condition does not establish that the author holds a claim unrevisable.'
    indicators:
    - '"tentatively", "partial", "we do not claim"'
    - '"clearly", "attests", "demonstrates", "what is discernible"'
  - key: self_application
    id_prefix: E5
    name: Self-application
    questions:
    - What standard does the text apply to rivals (incompleteness, fetishism, state-centrism, vagueness)? Quote
      it.
    - Applied to the text, does its own central claim meet that standard? Quote the passage where it would fail
      or pass.
    - Does a qualification ("this is not to say", "we do not deny") exempt the text from its own standard, or
      distinguish claims to which the standard applies differently? Quote the qualification and explain the relation.
    - Which acknowledgement should qualify an existing claim, and does it? Quote both, explaining whether retaining
      the claim conflicts with the acknowledgement or expresses selective agreement.
    answer_shape: '[E5.F<n>] Standard <standard> applied to the text: meets|fails|exempted — dim: self_application
      — anchor: "<the standard>" — anchor-b: "<the text’s own passage>" — confidence: …'
    method_card: 'Harding, strong objectivity. Do: identify who owns each standard and whether it is explanatory,
      normative, or evidential before applying it to comparable claims. A shared normative criterion is not itself
      an explanatory monism. Distinguish a rival''s concession from self-reflection, a substantive distinction from
      an exemption, and exposing a defective theory from promising a complete replacement.'
    indicators:
    - a critique of others in the introduction
    - '"this is not to say", "we do not suggest"'
  - key: shared_theory
    id_prefix: X6
    name: The shared theory of knowledge across the corpus
    scope: corpus
    questions:
    - Which evidence kinds and testimony patterns do the texts share? Anchor each in each text.
    - Which standard does one text apply that another fails? Both anchors.
    answer_shape: '[X6.F<n>] <shared pattern | divergence> — dim: shared_theory — anchor: "<verbatim>" — doc: <A>
      — anchor-b: "<verbatim>" — doc-b: <B> — confidence: …'
    method_card: 'The literature''s theory of knowledge. Do: compare the evidence inventories and the credited voices
      across texts; state what the literature counts as knowing.'
    indicators:
    - the same sources credited across documents
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 16
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: a reader who must decide how far to trust the text's central claim and wants to know how the text knows
      it
    tables:
    - evidence
    - testimony
    - professed_practised
    brief: '1. How the text knows: what it investigates, the procedure it enacts, and any method it studies or
      advocates; the evidence kinds and claims they carry, against the stated method.

      2. Whose word counts: who is credited, who is dismissed and by what device, whose account is never heard.

      3. Where it speaks from: declared position, sources and limits; which claims exceed their warrants and what
      kind of warrant is missing. Match the evidential requirement to the claim.

      4. Professed and practised: compare modesty and verbs concerning the same claim, retaining conditions and
      programmatic scope; distinguish selective revision from abandonment; what would revise the claim.

      5. Self-application: the text''s own standard applied to comparable claims; distinguish an exemption from
      a substantive qualification and criticism from a promised replacement.

      6. The judgment: the text''s implicit theory of knowledge, where it breaks, and the one question a reader
      should ask before trusting the central claim.'
