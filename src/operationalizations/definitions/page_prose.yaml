# The page desks (2026-09-07). One call at surface depth; the call and the critic at standard.
engine_key: page_prose
engine_name: The page's prose, to plan
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: What does each planned section say, in its budget, so the reader grasps its one thing?
  framing: The document is the memo (verdicts, prose, rows with ids); the packet carries the plan (sections in order
    with headings, budgets and what each must make the reader grasp; the exhibits by section with what they will
    show) and the audience. Write every planned section under exactly its heading, within its budget (a tenth over
    is the limit), citing row ids in square brackets; do not describe an exhibit's content in prose beyond one sentence
    that points at it; do not add sections. Each row of the ledger is one section with its word count and the ids
    it cites; the anchor is a sentence of the memo the section rests on.
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: claude-sonnet-5
  dimensions:
  - key: prose
    name: A section written
    questions:
    - Does each section say, within its budget, what the plan asked, on the memo's rows?
    method_card: 'Do: One row per planned section: its heading exactly, its word count, the row ids it cites, the
      one thing it makes the reader grasp. The prose itself is the reading above the ledger, under the headings.
      Select literal spans that carry the claim. Code checks only anchors and IDs; the model must judge the page
      against the reader.'
    indicators:
    - shows
    - means
    scope: document
    load_bearing: true
    id_prefix: W1
    answer_shape: '[W1.F<n>] <the section heading exactly> — dim: prose — words: <count> — cites: <row ids> — grasp:
      <what the section makes the reader grasp> — anchor: "<verbatim from the memo document, <=200 chars>" — doc:
      <the memo document key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - name_must_keep
    - A section without its planned heading, or a tenth over its budget, is struck; a claim without a memo row id
      is struck.
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    max_rows: 8
    reader: the stated audience, reading the page once
    tables: []
    brief: '1. The page''s prose: every planned section under its heading in the plan''s order, within budget, citing
      row ids in square brackets, pointing at its exhibits in one sentence each. 2. Then the ledger: one row per
      section.'
