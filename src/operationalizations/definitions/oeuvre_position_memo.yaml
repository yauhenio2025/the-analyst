# The oeuvre family (2026-09-07). Corpus readings over one focal text and the profiles of the author's other texts.
engine_key: oeuvre_position_memo
engine_name: 'The paper''s place in the oeuvre: the memo'
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: What role does this paper play in the author's oeuvre, read whole?
  framing: 'The corpus is one author''s oeuvre around one FOCAL text: the focal text whole (key focal:<uid>), and
    one document per other text by the author carrying that text''s PROFILE (keys before:<uid> and after:<uid>,
    by date): thesis, question, object, tradition, concepts with glosses, people with roles and stances, works cited
    with loci, claims, positions, verified passages. A packet supplied as context lists the texts in order with
    years and what is held. A profile is a summary made by a model and checked against its text: quote it as what
    the profile records, never as the author''s words unless the passage is marked verified. Dates come from the
    packet; same-year texts are unordered. The held sample is not the whole oeuvre: say what it does not cover.
    The upstream phases'' findings are supplied as context with their row IDs; the memo joins them and may cite
    them; its own rows are the joined verdict, the reading route and the open question, each anchored in the focal
    text or a profile.'
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: position
    name: The joined verdict
    questions:
    - 'Read whole, what is the focal text in the oeuvre: the retrospective verdict, the prospective verdict and
      the rupture verdict joined into one position?'
    method_card: 'Do: One row: the position with the three verdicts it joins and the warrant. Anchor in the focal
      text. Select literal spans that carry the actor, predicate, object and necessary qualification. A name or
      topic alone cannot support a reading. Use separate anchor-b/doc-b for a second span; never stitch quotations.
      Keep attribution, negation, modality and chronology. Code checks only anchors and IDs; the model must judge
      the reading against the supplied profiles and the focal text.'
    indicators:
    - in the whole
    scope: corpus
    load_bearing: true
    id_prefix: M1
    answer_shape: '[M1.F<n>] <the position in one sentence> — dim: position — position: opening|culmination|middle|end|reorientation|outlier
      — retrospective: culmination|continuation|departure — prospective: origin|way_station|dead_end — rupture:
      rupture|reorientation|deepening|continuity|outlier — warrant: <one clause> — anchor: "<verbatim, <=200 chars>"
      — doc: <actual supplied source key> — confidence: high|medium|low'
  - key: read_next
    name: What to read next
    questions:
    - Which three to five texts (held or not) would a reader open next to see the place claimed, and why?
    method_card: 'Do: One row per text, ranked: why it shows the place, held or not. Select literal spans that carry
      the actor, predicate, object and necessary qualification. A name or topic alone cannot support a reading.
      Use separate anchor-b/doc-b for a second span; never stitch quotations. Keep attribution, negation, modality
      and chronology. Code checks only anchors and IDs; the model must judge the reading against the supplied profiles
      and the focal text.'
    indicators:
    - read
    scope: corpus
    load_bearing: true
    id_prefix: M2
    answer_shape: '[M2.F<n>] <the text and why> — dim: read_next — text: <uid/year or a work not held> — held: yes|no|unknown
      — rank: <1 first> — why: <one clause> — anchor: "<verbatim, <=200 chars>" — doc: <actual supplied source key>
      — confidence: high|medium|low'
  - key: open
    name: The open question
    questions:
    - What about the paper's place remains undecided, and what would decide it?
    method_card: 'Do: At most two rows: the open question and what would decide it (a text, a citation, a comparison).
      Select literal spans that carry the actor, predicate, object and necessary qualification. A name or topic
      alone cannot support a reading. Use separate anchor-b/doc-b for a second span; never stitch quotations. Keep
      attribution, negation, modality and chronology. Code checks only anchors and IDs; the model must judge the
      reading against the supplied profiles and the focal text.'
    indicators:
    - unclear
    scope: corpus
    load_bearing: false
    id_prefix: M3
    answer_shape: '[M3.F<n>] <the open question> — dim: open — decided_by: <one clause> — held: yes|no|unknown —
      anchor: "<verbatim, <=200 chars>" — doc: <actual supplied source key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 6
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the person who asked what this paper is in the author's oeuvre
    tables:
    - reading_route
    brief: '1. The memo in four short parts: the paper read backwards (what it culminates), read forwards (what
      it seeds), read whole (the joined verdict, with what breaks and what persists), and the reading route (three
      to five texts, ranked, with why). Then the open question. Name texts as uid/year with their titles. 2. Every
      claim cites an upstream finding ID or one of this memo''s own rows; do not restate the upstream tables.'
