# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: exemplar_catalog
engine_name: Cases and examples used by the sources
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Which cases and examples does the text use, and what does each illustrate or support? Texts containing
    cases, anecdotes, examples or precedents; identify their argumentative function.
  framing: 'A source-example inventory: case or hypothetical example, owner, attributes, claim illustrated or challenged,
    inferential function, and limits of representativeness. A case-to-claim table preserves distinct examples and
    the difference between illustrating a possibility and establishing a general history. Preserve What concrete
    cases illustrate the arguments? and identification/context/usage/quality. The old representativeness and recurrence
    fields invite unsupported population claims; distinguish invented thought experiments from historical cases
    and count only the inspected inventory.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: examples
    id_prefix: D1
    name: Cases and examples
    scope: document
    load_bearing: true
    questions:
    - What concrete cases illustrate the arguments?
    answer_shape: '[D1.F<n>] <one source-scoped finding> — dim: examples — example: <value or unknown> — kind: <value
      or unknown> — owner: <value or unknown> — passage-context: <value or unknown> — anchor: "<literal actor and
      predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Inventory historical cases, anecdotes, hypothetical cases and counterexamples separately.
      Name the source owner before treating the example as the author’s endorsement. Select literal spans that together
      carry the finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters
      cannot do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text
      or normalize a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without
      the claimed predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology
      and uncertainty in the final claim. No scope record supplies positive evidence.'
    indicators:
    - for example
    - imagine
    - case
  - key: attributes
    id_prefix: D2
    name: Relevant attributes
    scope: document
    load_bearing: true
    questions:
    - Which attributes of each example matter to the claim it is used to support?
    answer_shape: '[D2.F<n>] <one source-scoped finding> — dim: attributes — example: <value or unknown> — attribute:
      <value or unknown> — claim-relevance: <value or unknown> — anchor: "<literal actor and predicate span, <=200
      chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Give each materially different example its own finding. A quote for one case cannot carry
      attributes of another. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b for another
      span, including within one document. Do not join separated text or normalize a quote into invented wording.
      Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - because
    - illustrates
    - insofar
  - key: functions
    id_prefix: D3
    name: Inferential functions
    scope: document
    load_bearing: true
    questions:
    - Does the example illustrate, support, test or defeat a claim, and what passage establishes that role?
    answer_shape: '[D3.F<n>] <one source-scoped finding> — dim: functions — example: <value or unknown> — claim:
      <value or unknown> — function: <value or unknown> — warrant: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Anchor both the example and its argumentative uptake. An illustration of possibility is not
      an empirical estimate of frequency. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - shows
    - counterexample
    - suggests
  - key: comparisons
    id_prefix: D4
    name: Repeated and contrasting uses
    scope: document
    load_bearing: false
    questions:
    - Where does the text reuse or contrast examples, and does their argumentative role change?
    answer_shape: '[D4.F<n>] <one source-scoped finding> — dim: comparisons — example-a: <value or unknown> — example-b:
      <value or unknown> — contrast: <value or unknown> — role-change: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Pair the uses with their owners and conditions. Retain separate marriage, childhood, populism
      or other cases if the source distinguishes them; no forced exhaustive checklist. Select literal spans that
      together carry the finding’s actor, predicate, object and necessary qualification. If one span of at most
      200 characters cannot do so, use anchor-b/doc-b for another span, including within one document. Do not join
      separated text or normalize a quote into invented wording. Retain both poles of a contrast. A verbatim name
      or prefix without the claimed predicate is insufficient: re-anchor, narrow or reject it. Keep source voice,
      status, chronology and uncertainty in the final claim. No scope record supplies positive evidence.'
    indicators:
    - whereas
    - similarly
    - by contrast
  - key: limits
    id_prefix: D5
    name: Representativeness and qualifications
    scope: document
    load_bearing: false
    questions:
    - What does the source establish about the example’s scope, and which generalization would exceed it?
    answer_shape: '[D5.F<n>] <one source-scoped finding> — dim: limits — example: <value or unknown> — scope: <value
      or unknown> — qualification: <value or unknown> — generalization-limit: <value or unknown> — anchor: "<literal
      actor and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Preserve conditional and negative clauses. Distinguish an acknowledged unrepresentative illustration
      from a claimed general case; report absent population evidence as a limit. Select literal spans that together
      carry the finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters
      cannot do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text
      or normalize a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without
      the claimed predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology
      and uncertainty in the final claim. No scope record supplies positive evidence.'
    indicators:
    - only
    - if
    - not necessarily
  - key: across_sources
    id_prefix: X6
    name: Aligned objects across supplied sources
    scope: corpus
    load_bearing: false
    questions:
    - Which supplied sources address the same object on this method’s question, and what aligned agreement or difference
      do their passages support?
    answer_shape: '[X6.F<n>] <scoped relation> — dim: across_sources — object: <aligned object> — relation: <agreement
      or difference> — anchor: "<literal supporting span>" — doc: <A> — anchor-b: "<literal supporting span>" —
      doc-b: <different B> — confidence: high|medium|low'
    method_card: 'Do: Establish a local inventory in each supplied document first. Match identity, question, time
      and scope before relating findings. Preserve two distinct source keys and the predicate on each side. One
      article quoting several authors is still one supplied document. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - same object in two sources
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the source open who needs to answer: Which cases and examples does the text use, and
      what does each illustrate or support?'
    tables:
    - exemplar_catalog_inventory
    - exemplar_catalog_relations
    brief: '1. A source-example inventory: case or hypothetical example, owner, attributes, claim illustrated or
      challenged, inferential function, and limits of representativeness. A case-to-claim table preserves distinct
      examples and the difference between illustrating a possibility and establishing a general history.

      2. Lead with the most consequential supported distinction, organized around source objects and questions.
      Useful inventory coverage is the deliverable; do not force a novel thesis.

      3. Render the two named Markdown tables, with explicit limits and citable rows; end with what is established
      and the evidence still needed.

      4. With multiple supplied texts, establish local inventories before an aligned relation; with one text do
      not pretend there is a supplied corpus.

      Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
