engine_key: field_investigation_field_map
engine_name: Map disagreements across field arguments
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Map disagreements across field arguments
  framing: Investigate the supplied question through institutional originals without requiring a
    target thinker. Reconstruct arguments, mechanisms, constraints, interventions and disagreement
    from the actual documents and voices. Keep adoption, signed views, guest contributions and participant
    statements distinct. Prior maps are retained analysis; only original passages support new source
    claims. Describe the considered, searched, acquired and actually read population separately,
    including geographic, language and publication-date coverage. Search misses and unavailable originals
    cannot establish institutional silence. Group by institution without manufacturing consensus
    from internal disagreement, syndicated copies or several formats of one event. Preserve evidence
    identities, exact quotations and native page/time loci. Never invent missing originals, authority,
    dates, transcripts or positions. Treat question premises and causal inferences as hypotheses.
    If validation_errors and previous_draft are supplied, return a complete corrected answer supported
    by the same evidence; preserve uncertainty instead of manufacturing support. When inquiry_type
    is not institutional, also consider the supplied thinker/field question; never attribute a field
    claim to the thinker.
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: debate
    name: Identify substantive field disagreements
    questions:
    - 'Compare named arguments across sources: competing mechanisms, evidence, cases, organizational
      forms, causal direction and rival interpretations. Distinguish actual disagreement from a difference
      in scope. Give field_finding with field evidence_ids; unresolved is allowed when inspected
      texts cannot settle a dispute. Do not replace disagreement with a topical list or homogeneous
      field consensus.'
    method_card: 'Compare named arguments across sources: competing mechanisms, evidence, cases,
      organizational forms, causal direction and rival interpretations. Distinguish actual disagreement
      from a difference in scope. Give field_finding with field evidence_ids; unresolved is allowed
      when inspected texts cannot settle a dispute. Do not replace disagreement with a topical list
      or homogeneous field consensus.'
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E1
    answer_shape: '[E1.F<n>] <finding in one sentence> — dim: debate — claim_kind: field_finding|unresolved
      — evidence_ids: <exact original field uid/E1.Fn ids> — positions: <named authors and claims>
      — mechanism: <causal process> — discriminating_test: <evidence that would decide> — anchor:
      "<verbatim supplied passage, <=200 chars>" — doc: <actual supplied source key> — confidence:
      high|medium|low'
  - key: query
    name: Guide author reading from field tensions
    questions:
    - Produce literal phrases for finding the thinker's relevant causal concepts, assumptions and
      qualifications; do not assume the thinker discusses the same cases or field authors.
    method_card: Produce literal phrases for finding the thinker's relevant causal concepts, assumptions
      and qualifications; do not assume the thinker discusses the same cases or field authors.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E2
    answer_shape: '[E2.F<n>] <finding in one sentence> — dim: query — query: <literal phrase> — reason:
      <field tension that motivates reading> — anchor: "<verbatim supplied passage, <=200 chars>"
      — doc: <actual supplied source key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 35
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the researcher developing a position through the thinker and field
    brief: Build an argument map, naming individual texts at each fork. Explain competing mechanisms,
      different populations/scales and methods, empirical disagreements, compatible propositions
      and unresolved cases. In batch mode disclose that boundary. In global_reconciliation compare
      ALL batch maps, preserve minority and contrary findings, and identify cross-batch tensions.
      Each material claim must retain original evidence ids. Then supply the debate and targeted
      query ledger.
    max_rows: 60
  method_refs:
  - engine_key: multimedia_source_criticism
    version: 1
  - engine_key: causal_mechanism_audit
    version: 1
  - engine_key: institutional_argument_criticism
    version: 1
version: 3
method_metadata:
  applies_when: Reading or mapping field originals in a bilateral or author-independent institutional
    inquiry.
  required_inputs:
  - Question and declared institutional scope
  - Frozen institutional originals and source relationships
  - Actual discovery/acquisition/read coverage and optional prior analysis
  outputs:
  - Source-linked argument and mechanism findings
  - Policy interventions, disagreements, qualifications and open tests
  limitations:
  - Cannot establish official adoption or silence from hosting or search coverage
  - Does not classify an organization from its name or infer funding influence from affiliation
  provenance:
  - kind: commission
    date: '2026-09-09'
    source: the-reporter:communications/COMMISSION_2026-09-09_think_tank_inquiries_in_stacks.md
    evaluation: Deterministic routing tests; substantive evaluation pending
