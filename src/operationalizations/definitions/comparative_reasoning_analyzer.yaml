engine_key: comparative_reasoning_analyzer
engine_name: Audit comparisons and analogies
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Do the text's analogies, classifications and rankings support the conclusions drawn from them? A
    text making comparisons; source and target material when the comparison relies on facts outside it.
  framing: 'A compact audit ordered by the conclusions that depend on comparison: what is transferred, which correspondence
    warrants it, where disanalogies matter, and what weaker conclusion survives. The desks lift comparison → conclusion
    → correspondence → defeating difference → scoped verdict, plus criteria and alternatives. The reading’s categories
    are the consequential comparisons in this text. Replace the lifted block. Keep text-facing critical questions
    but regroup them by audit work, not six kinds of device. Replace unsupported case-selection motives, suppressed
    options and free-floating alternative rankings with source-supported alternatives and explicit analyst tests.
    Typology, scalar endpoints and dichotomy checks are conditional probes inside the audit.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: transfer_claim
    id_prefix: D1
    name: What the comparison must establish
    scope: document
    load_bearing: true
    questions:
    - What inferential work does the analogy perform—does it generate predictions, explanations, or evaluations?
    - Which conclusion depends on which comparison, and is the move illustrative, classificatory or an evidential
      transfer?
    answer_shape: '[D1.F<n>] <one scoped finding> — dim: transfer_claim — comparison: <items> — conclusion: <claim>
      — job: <function> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source key> — confidence:
      high|medium|low'
    method_card: 'Do: Start with the dependent conclusion and its force. An illustration need not prove a general
      law; an explanatory transfer needs a warrant.'
    indicators:
    - like
    - similarly
    - therefore
  - key: correspondence
    id_prefix: D2
    name: The relevant correspondence
    scope: document
    load_bearing: true
    questions:
    - What specific relations are mapped from source to target domain?
    - Which attributes of the source domain are transferred versus left behind?
    answer_shape: '[D2.F<n>] <one scoped finding> — dim: correspondence — comparison: <items> — correspondence:
      <mapped relation> — warrant: <why relevant> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source
      key> — confidence: high|medium|low'
    method_card: 'Do: Map the relevant relation, not shared adjectives. Give supporting spans for both compared
      sides; unsupported external facts stay unverified. Repair discipline: Across page headers or intervening material,
      give two literal spans, never a silently joined quotation. Preserve the full asserted correspondence and its
      speaker. Inventory consequential comparisons inside worked economic, institutional and financial applications
      as well as headline classifications and historical analogies. Where the text contrasts a policy justification
      with distributional or financial-power effects, reconstruct that comparison separately: actors, resources,
      valuation or control mechanism, warranted consequence and strongest alternative. Do not reduce such a comparison
      to naming a new business class, and do not turn every financial term into an analogy. Keep the audit compact
      enough that each distinct inference is visible.'
    indicators:
    - corresponds
    - same relation
    - unlike
  - key: defeating_difference
    id_prefix: D3
    name: Differences that bear on the conclusion
    scope: document
    load_bearing: true
    questions:
    - Where does the analogy break down—which source domain features have no target domain counterpart?
    - Which stated disanalogy changes the transferred conclusion, and does the text answer it or merely acknowledge
      it?
    answer_shape: '[D3.F<n>] <one scoped finding> — dim: defeating_difference — comparison: <items> — difference:
      <scoped disanalogy> — consequence: <effect> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source
      key> — confidence: high|medium|low'
    method_card: 'Do: Test a difference for relevance to this transfer. Preserve disanalogies the text actually
      discusses; inadequate treatment differs from absence.'
    indicators:
    - however
    - unlike
    - only partially
  - key: criterion
    id_prefix: D4
    name: Criteria, scales and category boundaries
    scope: document
    load_bearing: false
    questions:
    - On what criteria are the compared items being evaluated?
    - How are the endpoints of the scale defined and anchored?
    - How does the typology handle borderline, mixed, or anomalous cases?
    answer_shape: '[D4.F<n>] <one scoped finding> — dim: criterion — comparison: <items> — criterion: <stated or
      reconstructed> — boundary: <endpoints or types> — anchor: "<verbatim supporting clause, <=200 chars>" — doc:
      <source key> — confidence: high|medium|low'
    method_card: 'Do: Run scale and typology probes only when used. Ask whether the same rule governs both items
      and whether overlap is allowed, without imposing exclusive categories. Repair discipline: Distinguish salient
      features, necessary conditions and sufficient criteria. Do not promote a feature list to a sufficient classification
      without an explicit warrant. Quote the actual criterion and any passage limiting its force.'
    indicators:
    - more than
    - best
    - type
    - between
  - key: alternatives
    id_prefix: D5
    name: Alternatives and representative cases
    scope: document
    load_bearing: false
    questions:
    - Are the two options presented as genuinely exhaustive of the possibility space?
    - What part, example, or case is made to stand for a larger whole or class?
    - Which supplied alternative or counter-case tests exhaustiveness or representativeness, and which proposed
      test needs more evidence?
    answer_shape: '[D5.F<n>] <one scoped finding> — dim: alternatives — comparison: <items> — coverage-claim: <scope>
      — alternative: <source case or analyst test> — anchor: "<verbatim supporting clause, <=200 chars>" — doc:
      <source key> — confidence: high|medium|low'
    method_card: 'Do: Use the text’s own third cases first. Do not infer case-selection motives or force an illustrative
      example to be a representative sample. Repair discipline: Read the strongest supplied alternative inference
      before ranking it. Anchor the complete alternative, including its actor, resources and power where asserted;
      a stock example alone cannot establish the conclusion. Inventory consequential comparisons inside worked economic,
      institutional and financial applications as well as headline classifications and historical analogies. Where
      the text contrasts a policy justification with distributional or financial-power effects, reconstruct that
      comparison separately: actors, resources, valuation or control mechanism, warranted consequence and strongest
      alternative. Do not reduce such a comparison to naming a new business class, and do not turn every financial
      term into an analogy. Keep the audit compact enough that each distinct inference is visible.'
    indicators:
    - either
    - all cases
    - for example
    - exception
  - key: surviving_conclusion
    id_prefix: D6
    name: Supported conclusion and repair
    scope: document
    load_bearing: false
    questions:
    - Once the relevant difference or criterion limit is retained, what conclusion still follows and at what force?
    - Which independent route supports the conclusion if this comparison fails?
    answer_shape: '[D6.F<n>] <one scoped finding> — dim: surviving_conclusion — comparison: <items> — supported-result:
      <qualified claim> — repair: <needed premise or comparison> — anchor: "<verbatim supporting clause, <=200 chars>"
      — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Keep a failed analogy distinct from a defeated conclusion. State a concrete repair in the
      text’s terms, or explain why the comparison holds.'
    indicators:
    - even without
    - on other grounds
    - at most
  - key: comparisons_across_works
    id_prefix: X7
    name: Comparison across supplied works
    scope: corpus
    load_bearing: false
    questions:
    - Do supplied texts make the same comparison under aligned criteria and conditions?
    - Which paired claims agree or diverge once source, target and transfer are matched?
    answer_shape: '[X7.F<n>] <one scoped finding> — dim: comparisons_across_works — relation: <aligned relation>
      — alignment: <object, sense, owner, scope> — order-basis: <dates, uptake, or unordered> — anchor: "<verbatim
      supporting clause, <=200 chars>" — doc: <source key> — anchor-b: "<verbatim supporting clause B>" — doc-b:
      <different source key> — confidence: high|medium|low'
    method_card: 'Do: Compare audits after each local inference is reconstructed. Paired anchors establish each
      side; dates alone do not show uptake.'
    indicators:
    - explicit reference
    - paired formulations
    - scope qualification
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - Judge the warrant appropriate to the claim; preserve owners, scope, modality and counter-passages. Inspect
      every declared question, not just retained positives.
    - Every consequential table cell must cite a final finding whose complete supporting spans contain the attributed
      fact and qualification. Split compound claims into several rows when <=200 characters cannot carry them. Use
      a separate [F1] [F2] citation per finding. Include an anchor-b with its doc-b for a second supporting span
      when needed, even in the same document; corpus relations always retain at least two distinct source keys.
      Never use a scope record as a positive finding. Use comma-separated full IDs in from:, never space-concatenated
      IDs. Judge meaning and completeness by reading the sources; code checks only anchors and IDs. Before returning,
      read the actual final tables against their cited final rows and the source contexts, including each source
      counted in coverage; repair or narrow unsupported cells. Keep execution/scope diagnostics separate from source
      interpretations; an unchecked record means the check was incomplete, not that the source is meaningless or
      silent.
    - check_matrix_cell_support
    - 'Apply these source-read repair checks: Across page headers or intervening material, give two literal spans,
      never a silently joined quotation. Preserve the full asserted correspondence and its speaker. Distinguish
      salient features, necessary conditions and sufficient criteria. Do not promote a feature list to a sufficient
      classification without an explicit warrant. Quote the actual criterion and any passage limiting its force.
      Read the strongest supplied alternative inference before ranking it. Anchor the complete alternative, including
      its actor, resources and power where asserted; a stock example alone cannot establish the conclusion.'
    - 'Inventory consequential comparisons inside worked economic, institutional and financial applications as well
      as headline classifications and historical analogies. Where the text contrasts a policy justification with
      distributional or financial-power effects, reconstruct that comparison separately: actors, resources, valuation
      or control mechanism, warranted consequence and strongest alternative. Do not reduce such a comparison to
      naming a new business class, and do not turn every financial term into an analogy. Keep the audit compact
      enough that each distinct inference is visible.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the supplied texts open who needs to answer: Do the text''s analogies, classifications
      and rankings support the conclusions drawn from them?'
    tables:
    - comparison_audit
    - criteria_and_alternatives
    brief: '1. A compact audit ordered by the conclusions that depend on comparison: what is transferred, which
      correspondence warrants it, where disanalogies matter, and what weaker conclusion survives. The desks lift
      comparison → conclusion → correspondence → defeating difference → scoped verdict, plus criteria and alternatives.
      The reading’s categories are the consequential comparisons in this text.

      2. Establish the most consequential local findings and their qualifications; organize the reading by the objects
      and claims in these texts.

      3. Render the named Markdown tables with final finding IDs in every positive cell. Explain the supported relation
      and the strongest counter-passage; end with what is settled and the exact remaining question.

      4. With multiple sources, build each work’s inventory before the paired comparison, and state alignment and
      chronology limits. With one source, label the result a local inventory where a corpus relation would require
      another work.

      Every consequential table cell must cite a final finding whose complete supporting spans contain the attributed
      fact and qualification. Split compound claims into several rows when <=200 characters cannot carry them. Use
      a separate [F1] [F2] citation per finding. Include an anchor-b with its doc-b for a second supporting span
      when needed, even in the same document; corpus relations always retain at least two distinct source keys.
      Never use a scope record as a positive finding. Use comma-separated full IDs in from:, never space-concatenated
      IDs. Judge meaning and completeness by reading the sources; code checks only anchors and IDs. Before returning,
      read the actual final tables against their cited final rows and the source contexts, including each source
      counted in coverage; repair or narrow unsupported cells. Keep execution/scope diagnostics separate from source
      interpretations; an unchecked record means the check was incomplete, not that the source is meaningless or
      silent.


      After the check, rewrite or drop cells resting on rejected or unverified findings; rewrite weakened claims
      everywhere they occur. A rejection tag is acceptable only in prose, not as validation of a table cell. Keep
      separate granular support when deduplicating. Apply the method-card repairs to the final reading and its tables.


      Final source-read repair: Inventory consequential comparisons inside worked economic, institutional and financial
      applications as well as headline classifications and historical analogies. Where the text contrasts a policy
      justification with distributional or financial-power effects, reconstruct that comparison separately: actors,
      resources, valuation or control mechanism, warranted consequence and strongest alternative. Do not reduce
      such a comparison to naming a new business class, and do not turn every financial term into an analogy. Keep
      the audit compact enough that each distinct inference is visible.'
