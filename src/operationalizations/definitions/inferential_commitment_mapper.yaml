engine_key: inferential_commitment_mapper
engine_name: Inferential Commitment Mapper
stance_operationalizations:
- stance_key: discovery
  label: Exhaustive Commitment Inventory
  description: |-
    Exhaustive inventory of every significant commitment: all explicit
    claims with centrality, originality, evidential basis, and
    management style; all implicit commitments with inference strength,
    author awareness, and assessment of whether each implication is
    welcome or awkward.
  focus_dimensions:
  - explicit_commitments
  - implicit_commitments
  focus_capabilities:
  - map_explicit_commitments
  - surface_implicit_commitments
- stance_key: confrontation
  label: Full Conflict & Dependency Analysis
  description: |-
    Full conflict analysis: every significant tension mapped with
    conflict type, navigation strategy, and success assessment.
    Complete dependency graph: foundational commitments, derived
    chains, circular dependencies, single-point-of-failure analysis,
    and load-bearing assessment for each foundational commitment.
  focus_dimensions:
  - commitment_conflicts
  - logical_dependencies
  focus_capabilities:
  - detect_conflicts
  - trace_dependencies
- stance_key: dialectical
  label: Dialectical Working-Through of Commitment Conflicts
  description: |-
    Do not resolve the commitment conflicts found in Pass 2 — inhabit
    them. For each significant tension between commitments, perform
    genuine dialectical work: state the thesis (the commitment in its
    strongest form), identify its internal negation (the point where
    the commitment's own logic undermines itself), and dwell in the
    collision until a higher-order understanding emerges.

    Which commitment conflicts are PRODUCTIVE — generating insight
    precisely because they cannot be resolved? The tension between a
    commitment to individual autonomy and a commitment to social
    determination, for instance, may be the engine that drives the
    entire argument forward. Collapsing it would not fix the argument
    but destroy it. Identify these generative contradictions and
    articulate what they produce that neither side could generate alone.

    Which conflicts are genuinely DESTRUCTIVE — where the author is
    committed to incompatible positions and the incompatibility is not
    productive but simply a flaw? For these, trace what a determinate
    negation would look like: not just "this fails" but "this fails in
    a way that points toward what is actually needed." Every negation
    should contain, in embryo, the specification of what would succeed.

    Pay special attention to commitment chains where accepting premise A
    forces commitment B, which contradicts commitment C, which the
    author also needs. These cascading contradictions often reveal that
    the author's real position is not any of the stated commitments but
    an unstated position that would require restructuring the entire
    commitment landscape. Articulate what that unstated position might be.
  focus_dimensions:
  - commitment_conflicts
  - logical_dependencies
  - implicit_commitments
  focus_capabilities:
  - detect_conflicts
  - trace_dependencies
- stance_key: integration
  label: Hidden Implications & Commitment Landscape Synthesis
  description: |-
    Synthesize the full commitment landscape, now enriched by the
    dialectical pass's working-through of commitment conflicts.
    Hidden implications traced to source commitments, performative
    contradictions surfaced, citation baggage analysis revealing
    inherited commitments the author may not realize they carry,
    package deal identification with incompatibility mapping. The
    dialectical pass distinguished productive from destructive
    contradictions — integrate this into the overall commitment
    landscape synthesis. Where contradictions are productive, the
    synthesis should preserve them as generative tensions. Where
    they are destructive, the synthesis should articulate what
    restructuring of commitments the analysis points toward. The
    result is a map of what you are really signing up for — including
    which tensions come with the package and which signal genuine
    problems in the author's position.
  focus_dimensions:
  - hidden_implications
  - commitment_conflicts
  - logical_dependencies
  focus_capabilities:
  - reveal_hidden_implications
# 2026-09-05: modes per depth (surface = one call, standard = one call + critic, deep = the chain); stance passes kept for reference
depth_sequences:
- depth_key: surface
  mode: oneshot
  passes:
  - pass_number: 1
    stance_key: discovery
    consumes_from: []
- depth_key: standard
  mode: oneshot_checked
  passes:
  - pass_number: 1
    stance_key: discovery
    consumes_from: []
  - pass_number: 2
    stance_key: confrontation
    consumes_from:
    - 1
- depth_key: deep
  mode: dvs
  passes:
  - pass_number: 1
    stance_key: discovery
    consumes_from: []
  - pass_number: 2
    stance_key: confrontation
    consumes_from:
    - 1
  - pass_number: 3
    stance_key: dialectical
    consumes_from:
    - 1
    - 2
  - pass_number: 4
    stance_key: integration
    consumes_from:
    - 1
    - 2
    - 3
- depth_key: dvs
  process: dvs
# The process shape (2026-09-05): communications/study/REDESIGN_inferential_commitment_mapper_2026-09-05.md
process:
  key: dvs
  description: 'A commitment map of the TEXT: what a reader signs up for by accepting its claims — the commitments
    it undertakes, what its concepts entail as it uses them, which commitments exclude each other, what rests on
    what, and what follows for practice. About the text''s score, never about the authors'' minds.'
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: declared
    id_prefix: I1
    name: Declared commitments
    load_bearing: true
    questions:
    - What theses does the text undertake in its own words, and with what verb ("we argue", "constitutes", "we show")?
      Give each a stable id (C1 the main thesis, C2 …), preserving conditions and scope.
    - Which commitments does the text present as its own and which does it take from a cited source (quote the sentence
      that takes it)?
    - Which commitments does the text defend at length and which does it assert once and rely on?
    - Which commitments does the text explicitly refuse (positions it rejects), and what does refusing them commit
      it to?
    answer_shape: '[I1.F<n>] C<k>: "<verbatim commitment>" — dim: declared — verb: <verb> — source: own|cited (<who>)
      — defended: at length|asserted once — anchor: "<verbatim>" — confidence: …'
    method_card: 'Brandom, scorekeeping. Do: keep the text''s score — for each commitment it undertakes, the entitlement
      it claims (argued here, cited, presupposed) and the verb it uses; a refusal is a commitment too (rejecting
      X commits the text to not-X). Quote the sentence that undertakes each.'
    indicators:
    - '"we argue", "we contend", "constitutes", "is not simply"'
    - '"following X", "as X has shown"'
    - a position rejected in one sentence
  - key: entailed
    id_prefix: I2
    name: Entailed commitments (what the concepts commit a reader to)
    load_bearing: true
    questions:
    - For each load-bearing concept, what does accepting it commit a reader to, by the inferential role the text
      gives the concept? Quote where the text draws that inference itself.
    - Where does the text presuppose an entailment it never draws (uses the concept as if the inference were settled)?
      Quote the use.
    - Which entailments does the text draw from one concept and not from another that carries the same inference
      (an asymmetry)? Quote both.
    - Which commitments follow from accepting the main thesis itself, and which require accepting this particular
      derivation or additional premises? Name those premises and test whether another route leaves them optional.
    answer_shape: '[I2.F<n>] Accepting <concept, C<k>, or explicitly endorsed derivation plus named premises>
      entails <commitment> — dim: entailed — basis: conclusion|endorsed derivation — drawn|presupposed
      — anchor: "<verbatim>" — confidence: …'
    method_card: 'Brandom, material inference. Do: for each key concept write the inference the text treats as good
      by the concept''s content rather than by logic ("regulatory control" → interests rearticulated as general
      interest); anchor the inference and name its additional premises. Do not reverse support: premises used
      to establish a conclusion need not follow from accepting it. Distinguish a commitment to the conclusion
      from endorsement of its whole derivation; mark asymmetries where a parallel inference is not drawn.'
    indicators:
    - a concept used as an explanation without the step being argued
    - '"in other words", "that is", "amounts to"'
    - a parallel case treated differently
  - key: incompatibilities
    id_prefix: I3
    name: Incompatibilities
    load_bearing: true
    questions:
    - Which pairs of commitments (declared or entailed) exclude each other in the text's own terms? Quote both sides.
    - How does the text handle each pair — acknowledged and addressed, acknowledged and bracketed ("beyond our scope",
      "this is not to say"), or unnoticed? Quote the handling.
    - Which commitment inherited from a cited source conflicts with the text's own position? Quote both.
    - Which incompatibility is productive (the text draws something from the tension) and which is damaging (the
      text needs both sides)?
    answer_shape: '[I3.F<n>] <commitment A, owner and scope> relates to <commitment B, owner and scope> — dim:
      incompatibilities — relation: incompatibility|productive tension|qualified compatibility|opponent contrast
      — anchor: "<A>" — anchor-b: "<B>" — handled: addressed|bracketed|unnoticed — confidence: …'
    method_card: 'Brandom, incompatibility. Do: for every pair of commitments ask whether holding one precludes
      entitlement to the other in the text''s own terms (not in yours). Identify each claim''s owner, object and
      conditions before testing compatibility. Do not turn an appearance/reality distinction, selective borrowing,
      or a productive tension into contradiction by the answer label. Quote both sides and their handling.'
    indicators:
    - the same phenomenon explained by two mechanisms in different sections
    - '"this is not to say", "beyond the scope"'
    - a criticism of others that the text's own claim also meets
  - key: dependencies
    id_prefix: I4
    name: Dependencies
    questions:
    - Which commitments serve as premises for others, and what entitles the text to them (argument, evidence,
      citation, presupposition)? Distinguish a foundational role from absence of support.
    - What is the chain from the foundational commitments to the main thesis — which commitment is derived from
      which?
    - If a load-bearing commitment is withdrawn, which argument route loses support and which independent routes
      survive? Name a single point of failure only if the text's other routes also depend on it. Quote the premise.
    - Where does the chain circle (A supports B supports A)? Quote both.
    answer_shape: '[I4.F<n>] C<k> is foundational|derived from C<m> — dim: dependencies — anchor: "<verbatim>" —
      failure-takes: <which claims or routes lose support> — survives: <independent support or none shown> — confidence: …'
    method_card: 'Toulmin. Do: inventory support and trace branching routes to the thesis. Removing a premise
      defeats the routes that need it, not automatically the conclusion; keep independently supported conclusions
      and distinguish a failed formulation from a failed historical claim. Name a single point of failure only
      when warranted; quote any circle.'
    indicators:
    - '"therefore", "it follows", "this means"'
    - an assumption introduced as obvious
  - key: consequences
    id_prefix: I5
    name: Consequences drawn and stopped short of
    questions:
    - What does the text say follows from its commitments for practice, policy or method? Quote it; distinguish
      necessary capacities from suggested resources and optional examples.
    - Where does a consequence follow from the text's commitments and the text stops? Quote the sentence where it
      stops.
    - Where does normative vocabulary sit inside a descriptive claim ("neatly", "merely", "obscures")? Quote it
      and say what it commits the text to.
    - Which consequence would the text's own evidence not support? Quote the evidence.
    answer_shape: '[I5.F<n>] C<k> supports <consequence or resource> — dim: consequences
      — force: required|recommended|illustrative|possible — source: text drawn|analyst extension
      — anchor: "<verbatim>" — confidence: …'
    method_card: 'Sellars. Do: keep the space of reasons and the space of causes apart — where the text explains
      by causes what it evaluates by reasons (or the reverse), quote it; where a consequence for practice follows
      and the text stops, quote the stop and label your extension. Keep optional remedies distinct from required
      capacities; read normative words inside descriptive sentences as commitments.'
    indicators:
    - '"beyond the scope", "we leave aside"'
    - evaluative adverbs in descriptive sentences
  - key: shared_score
    id_prefix: X6
    name: The shared score across the corpus
    scope: corpus
    questions:
    - Which commitments do the texts share, with what conditions and scope? Anchor each in every text included
      in the claim. Distinguish a mechanism the author describes from a recommendation the author endorses.
    - Which entailment does one text draw and another explicitly refuse or qualify? Quote both; an omission
      does not itself establish refusal. Preserve historical qualifications and additional premises.
    - Which positions become incompatible, or remain compatible after qualification, when the texts are read
      together? Align their objects, scope and conditions; state the inference and additional premises that
      connect different commitments before classifying their relation.
    answer_shape: '[X6.F<n>] <commitments, owners and scope> — dim: shared_score
      — relation: shared|qualified continuity|divergence|incompatibility — anchor: "<verbatim>" — doc:
      <A> — anchor-b: "<verbatim>" — doc-b: <B> — confidence: …'
    method_card: 'The school''s score. Do: reconcile commitment meanings across texts, preserving owners,
      conditions and inferential roles. Separate descriptive pressures from endorsed remedies, a changed
      emphasis from replacement, and a limited systematic account from a claim to total knowledge. Check
      earlier formulations before naming a later innovation; an edition date alone does not date a position.
      Report qualified continuity where the texts allow it, and name the additional premise needed for an
      alleged incompatibility. Every document covered by the finding needs its own anchor.'
    indicators:
    - the same thesis in two documents in different words
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 16
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - reconcile_ids
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: a reader deciding whether to accept the text's position, who needs to know what accepting it commits
      them to
    tables:
    - commitments
    - entailments
    - incompatibilities
    brief: '1. What you sign up for: the main commitment in the text''s words, retaining its conditions, and the
      commitments a reader cannot refuse once they accept it. State additional premises where needed; distinguish
      accepting the conclusion from accepting this particular derivation. Do not force a minimum number of entailments.

      2. The declared score: the commitments the text undertakes, its own and inherited, defended and merely asserted.

      3. The relations: incompatibilities, productive tensions, qualified compatibilities and contrasts with opponents,
      both sides attributed and quoted, and what the text does with each.

      4. The dependencies: premises and their entitlement, branching routes to the thesis, what loses support
      and what survives when a premise is withdrawn. A single point of failure only where warranted.

      5. The consequences: required capacities, advocated resources and analyst extensions distinguished; where
      the text stops, with the stop quoted.

      6. The judgment: the price of accepting the position, and the one commitment a reader should test first.'
