# Fourth queue: communications/study/REDESIGN_fourth_queue_2026-09-06.md
engine_key: system_boundary_analyzer
engine_name: Boundaries and externalized consequences
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: How does the source's system boundary change what counts as a problem or external cost? A source-defined
    system, included/excluded actors or effects, and evidence for the consequence of boundary choices.
  framing: 'A reading of how the paper’s consequential boundary changes the problem it can see, with inclusion/exclusion/consequence
    rows and an alternative-boundary table distinguishing source claims from an analyst’s proposed reframing. The
    map requires new questions despite an extant base definition: retain stated boundaries, inclusion/exclusion,
    externalities, tensions, alternatives and permeability. Replace routine critique/propose-alternatives and inferred
    effects with a source-defined boundary, evidenced consequence and labeled alternative; no automatic moral diagnosis
    of exclusion.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: boundary
    name: Boundary
    scope: document
    id_prefix: D1
    load_bearing: true
    questions:
    - What system or unit of analysis does the source define, and where are its spatial, temporal or organizational
      limits?
    answer_shape: system; boundary; owner/voice; stated/reconstructed; scope; doc; verbatim anchor(s); uncertainty
    method_card: 'Do: Anchor the definition and identify whether it is endorsed or criticized. Do not attribute
      an opponent’s boundary to the author. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span,
      including within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality,
      status and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate. Retain
      the source distinctions that carry the boundary critique: means versus ends, separate firm attribution versus
      collective production, given preferences versus socially produced wants, the model treating the economy as
      separable from social history, provisional national abstraction versus heterogeneous global production, and
      approximate temporal phases. Identify who draws each boundary and whether it is a criticized exclusion or
      an explicitly provisional analytical device. Do not infer a hidden agenda from the existence of a beneficiary.'
    indicators:
    - system
    - boundary
    - owner/voice
  - key: membership
    name: Membership
    scope: document
    id_prefix: D2
    load_bearing: true
    questions:
    - Which actors, activities or effects are counted inside and outside that boundary?
    answer_shape: included/excluded object; rule; evidence; uncertainty; doc; verbatim anchor(s); uncertainty
    method_card: 'Do: Pair the inclusion rule with its application. Absence from a selective discussion alone cannot
      establish exclusion. Select literal spans that together carry the finding’s actor, predicate, object and necessary
      qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including within one
      document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status and chronology;
      re-anchor, narrow or reject a verbatim quote that omits the claimed predicate. Retain the source distinctions
      that carry the boundary critique: means versus ends, separate firm attribution versus collective production,
      given preferences versus socially produced wants, the model treating the economy as separable from social
      history, provisional national abstraction versus heterogeneous global production, and approximate temporal
      phases. Identify who draws each boundary and whether it is a criticized exclusion or an explicitly provisional
      analytical device. Do not infer a hidden agenda from the existence of a beneficiary.'
    indicators:
    - included/excluded object
    - rule
    - evidence
  - key: consequences
    name: Consequences
    scope: document
    id_prefix: D3
    load_bearing: true
    questions:
    - What supported burden, benefit or responsibility changes when that boundary is used?
    answer_shape: boundary; omitted/included consequence; bearer; causal or accounting relation; doc; verbatim anchor(s);
      uncertainty
    method_card: 'Do: Quote the consequence predicate and its bearer; distinguish an accounting exclusion from proof
      of material harm. Select literal spans that together carry the finding’s actor, predicate, object and necessary
      qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including within one
      document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status and chronology;
      re-anchor, narrow or reject a verbatim quote that omits the claimed predicate. Retain the source distinctions
      that carry the boundary critique: means versus ends, separate firm attribution versus collective production,
      given preferences versus socially produced wants, the model treating the economy as separable from social
      history, provisional national abstraction versus heterogeneous global production, and approximate temporal
      phases. Identify who draws each boundary and whether it is a criticized exclusion or an explicitly provisional
      analytical device. Do not infer a hidden agenda from the existence of a beneficiary.'
    indicators:
    - boundary
    - omitted/included consequence
    - bearer
  - key: permeability
    name: Permeability
    scope: document
    id_prefix: D4
    load_bearing: false
    questions:
    - Which dependencies or crossings challenge the separation of inside and outside?
    answer_shape: crossing relation; endpoints; effect on separability; qualification; doc; verbatim anchor(s);
      uncertainty
    method_card: 'Do: Follow the text’s actual interactions and dependencies. Preserve uncertain magnitude and avoid
      fabricating complete system coverage. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span,
      including within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality,
      status and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate. Retain
      the source distinctions that carry the boundary critique: means versus ends, separate firm attribution versus
      collective production, given preferences versus socially produced wants, the model treating the economy as
      separable from social history, provisional national abstraction versus heterogeneous global production, and
      approximate temporal phases. Identify who draws each boundary and whether it is a criticized exclusion or
      an explicitly provisional analytical device. Do not infer a hidden agenda from the existence of a beneficiary.'
    indicators:
    - crossing relation
    - endpoints
    - effect on separability
  - key: alternatives
    name: Alternatives
    scope: document
    id_prefix: D5
    load_bearing: false
    questions:
    - Which alternative boundary does the source or analyst propose, and what changes under it?
    answer_shape: alternative; source/analyst status; changed question; evidence; tradeoff; doc; verbatim anchor(s);
      uncertainty
    method_card: 'Do: Test an alternative against the strongest source counter-passage. Keep proposed reframing
      separate from an empirically proven solution. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate
      span, including within one document. Never concatenate separated phrases into a quotation. Keep attribution,
      modality, status and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.
      Retain the source distinctions that carry the boundary critique: means versus ends, separate firm attribution
      versus collective production, given preferences versus socially produced wants, the model treating the economy
      as separable from social history, provisional national abstraction versus heterogeneous global production,
      and approximate temporal phases. Identify who draws each boundary and whether it is a criticized exclusion
      or an explicitly provisional analytical device. Do not infer a hidden agenda from the existence of a beneficiary.'
    indicators:
    - alternative
    - source/analyst status
    - changed question
  - key: across_documents
    name: Aligned supplied accounts
    scope: corpus
    id_prefix: CORPUS
    load_bearing: false
    questions:
    - If multiple documents are supplied, what common question can be aligned using a supported local finding from
      each, and what stays incomparable?
    answer_shape: aligned object/question; per-document answer; supported relation; doc/anchor and doc-b/anchor-b;
      coverage limit
    method_card: 'Do: Inventory each supplied work first, then pair actual answers to the same question. Require
      two different document keys for a cross-document claim. A single-paper contrast stays in its document dimension.
      Do not infer transmission, chronological change or field-wide consensus from similarity. Select literal spans
      that together carry the finding’s actor, predicate, object and necessary qualification. If one short span
      cannot do so, use anchor-b/doc-b for a separate span, including within one document. Never concatenate separated
      phrases into a quotation. Keep attribution, modality, status and chronology; re-anchor, narrow or reject a
      verbatim quote that omits the claimed predicate.'
    indicators:
    - same object across supplied texts
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 6
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites retained final finding IDs using separate [F1] [F2] citations. Reread
      the actual final tables against the applied ledger and the source: rewrite or drop cells supported by rejected,
      unverified or narrowed-away claims. Keep granular evidence when merging; use comma-separated full IDs in from:.
      Scope records state coverage or uncertainty and never supply positive evidence. Code checks anchors and IDs;
      models judge meaning. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including
      within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status
      and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
    - 'Retain the source distinctions that carry the boundary critique: means versus ends, separate firm attribution
      versus collective production, given preferences versus socially produced wants, the model treating the economy
      as separable from social history, provisional national abstraction versus heterogeneous global production,
      and approximate temporal phases. Identify who draws each boundary and whether it is a criticized exclusion
      or an explicitly provisional analytical device. Do not infer a hidden agenda from the existence of a beneficiary.'
    - 'Make the boundary reading as useful and specific as the best original questions: trace manufactured preferences,
      regulation versus mobile capital, and periodization where the source supplies them, alongside firm accounting
      and excluded harms. Test the critique against the author''s acceptance of approximate regularities, provisional
      national abstraction and effective production; do not mistake a qualified working model for a claim of universal
      separability. Include only source-supported burdens/bearers and label proposed reframings. Keep complete/partial
      coverage distinct from semantic approval, use exact scope field names, and do not claim broader findings than
      the final ledger retains.'
    - Output exactly one ruling for each exact input finding ID. A row has exactly one status and at most one revised-finding
      field. Use one anchor field per suffix, paired with its doc field; never repeat anchor, anchor-b or revised-finding
      on a row. Keep the valid scope JSON field names dimension_key, finding_ids and coverage (complete, partial
      or unknown).
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the supplied paper open who needs to answer: How does the source''s system boundary change
      what counts as a problem or external cost?'
    tables:
    - system_boundary_analyzer_inventory
    - system_boundary_analyzer_relations
    brief: '1. A reading of how the paper’s consequential boundary changes the problem it can see, with inclusion/exclusion/consequence
      rows and an alternative-boundary table distinguishing source claims from an analyst’s proposed reframing.

      2. Lead with one consequential text-specific judgment, carry its reasoning through the evidence, and test
      the strongest counter-passage.

      3. Render the two named Markdown tables with citable rows; distinguish established relations, interpretations
      and missing evidence.

      4. On one paper, do not pretend there is a supplied corpus. On multiple papers, retain each local inventory
      before aligning.

      Every substantive table cell cites retained final finding IDs using separate [F1] [F2] citations. Reread the
      actual final tables against the applied ledger and the source: rewrite or drop cells supported by rejected,
      unverified or narrowed-away claims. Keep granular evidence when merging; use comma-separated full IDs in from:.
      Scope records state coverage or uncertainty and never supply positive evidence. Code checks anchors and IDs;
      models judge meaning. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including
      within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status
      and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.


      5. Make the boundary reading as useful and specific as the best original questions: trace manufactured preferences,
      regulation versus mobile capital, and periodization where the source supplies them, alongside firm accounting
      and excluded harms. Test the critique against the author''s acceptance of approximate regularities, provisional
      national abstraction and effective production; do not mistake a qualified working model for a claim of universal
      separability. Include only source-supported burdens/bearers and label proposed reframings. Keep complete/partial
      coverage distinct from semantic approval, use exact scope field names, and do not claim broader findings than
      the final ledger retains.'
