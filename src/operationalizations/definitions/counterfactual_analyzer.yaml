# Second queue repair: prompts/cards only; analytical questions preserved.
engine_key: counterfactual_analyzer
engine_name: Audit a counterfactual
process:
  key: dvs
  description: 'Reconstruct the suppositions doing argumentative work in the supplied text. Distinguish

    counterfactual, conditional, concessive, reductio and reconstructed dependency uses. Preserve

    the antecedent''s status, the conclusion''s modal force, and each speaker''s commitment.

    Test fixed and changed conditions and the appropriate inferential warrant. Removing one

    premise may defeat a formulation or route while leaving independent support intact.'
  framing: 'Examine the suppositions that do argumentative work in the text, if any. Distinguish an

    explicit counterfactual, an open conditional, an even-if concession, a reductio, and an

    analyst''s reconstruction of a dependency. Preserve who makes the supposition, what is

    varied or granted, what is held fixed, and what conclusion is claimed. Assess the

    connecting warrant appropriate to the case: conceptual, causal, historical, or normative.

    Identify additional assumptions and independent support that survives their removal.

    Report no relevant instance when the inspected material supports that conclusion,

    stating the scope and limits of the search.


    Eligibility:

    A supposition qualifies when varying, granting or assuming a condition performs an

    identifiable inferential task. Include explicit counterfactuals, open conditionals,

    even-if concessions, reductios and justified reconstructions of dependency, while keeping

    those forms distinct. Every causal sentence is not automatically a necessary but-for claim.

    No explicit counterfactual wording is narrower than no relevant supposition. Do not create

    an analyst''s arbitrary scenario merely to avoid a negative finding.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: supposition_and_function
    id_prefix: CF1
    name: The supposition, its owner and its inferential task
    scope: document
    load_bearing: true
    questions:
    - What antecedent is varied, denied, left open or provisionally granted, and what consequent is claimed? Quote
      the inferential passage, including a counterexample without literal if–then wording, and preserve its modal
      force.
    - Is this an explicit counterfactual, an open conditional, an even-if concession, a reductio, or an analyst's
      reconstruction? Explain the classification from the passage rather than from the word if alone.
    - Who undertakes the supposition here, and what is its task? Distinguish the paper's commitment from an interpreted
      thinker's position, an opponent's premise and an assumption adopted only for argument.
    - Is the conclusion asserted only under that supposition? Before alleging strength drift elsewhere, check that
      the comparison concerns the same proposition under the same antecedent.
    answer_shape: '[CF1.F<n>] <supposition and argumentative task> — dim: supposition_and_function — scenario: <stable
      scenario label> — kind: counterfactual|open_conditional|even_if|reductio|reconstructed_dependency — owner:
      <speaker and endorsement status> — antecedent: <condition and denied, open or granted status> — consequent:
      <claim with modal strength> — function: <causal, conceptual, historical, normative or robustness task> — anchor:
      "<supposition passage>" — doc: <key> — anchor-b: "<separate consequent or attribution passage, if needed>"
      — doc-b: <key> — confidence: high|medium|low'
    method_card: 'Do: Start with the inferential use, not an alternate-history template. An even-if concession can

      establish a requirement that survives granting an antecedent without asserting that antecedent

      is actual or possible. A reductio can deliberately assume what the argument rejects. Mark a

      reconstructed dependence as the analyst''s formulation and cite the textual route it reconstructs;

      a causal attribution alone does not establish that removing this cause removes every possible route. A counterexample
      defeats a universal or primacy claim through its inference; literal conditional syntax is not an eligibility
      test. Repair discipline: Keep granting an opponent premise for argument separate from endorsing it. Reconcile
      attribution across the finding, explanatory prose and table; use separate spans for the speaker and the supposed
      outcome.'
    indicators:
    - if
    - even if
    - suppose
    - without
    - otherwise
    - for the sake of argument
  - key: fixed_and_changed_conditions
    id_prefix: CF2
    name: What is varied, what remains fixed and what is added
    scope: document
    load_bearing: true
    questions:
    - What does the text explicitly hold fixed while varying or granting the antecedent? Distinguish stated background
      conditions from assumptions reconstructed by the analyst.
    - Which further changes follow from the supposition, and which are additional premises needed to obtain the
      proposed result? Identify the textual warrant or state that it is not supplied.
    - Does the scenario require incompatible fixed conditions, or is the apparent incompatibility the deliberate
      object of a reductio or conceptual limit test?
    - For a historical or causal scenario, what earlier conditions would have to differ and does the text disclose
      them? For a conceptual or normative scenario, what commitments define the permissible contrast?
    answer_shape: '[CF2.F<n>] <the scenario''s fixed and changed conditions and their adequacy> — dim: fixed_and_changed_conditions
      — scenario: <stable label> — changed: <antecedent and required consequences> — held-fixed: <stated conditions
      or not specified> — additional-assumption: <extra premise or none established> — basis: stated|reconstructed|unsettled
      — consistency: compatible|conflict|deliberate_reductio|unsettled — anchor: "<condition-changing passage>"
      — doc: <key> — anchor-b: "<background or limiting passage, if available>" — doc-b: <key> — confidence: high|medium|low'
    method_card: 'Do: Audit the contrast actually used. Separate what must change to make the antecedent hold from

      extra changes introduced to secure the conclusion. Apply historical backtracking and similarity

      questions where the scenario has that temporal structure; do not require them of a conceptual

      dependency test. Compatibility is not enough to show that a background condition should remain

      fixed. Conversely, deliberate inconsistency in a reductio is not an unnoticed scenario error.'
    indicators:
    - all else
    - still
    - regardless
    - assume
    - under these conditions
  - key: inferential_path
    id_prefix: CF3
    name: The warrant from supposition to result
    scope: document
    load_bearing: true
    questions:
    - What connects antecedent to consequent here? Identify a conceptual requirement, definition, causal mechanism,
      historical regularity, normative premise or cited argument, and the passage doing that work.
    - Which steps are stated and which are reconstructed? Does restating the consequent answer the dependency question,
      or is a connecting premise still required?
    - Does the support establish necessity, possibility, tendency or a result conditional on further premises? Preserve
      necessary vulnerability separately from inevitable realization and risk separately from actual occurrence.
    - What scope does the warrant support, and what competing or independent route does the text itself supply?
      Do not reverse a sufficient argument into a necessary condition of accepting its conclusion.
    answer_shape: '[CF3.F<n>] <the supported link and its limits> — dim: inferential_path — scenario: <stable label>
      — warrant-kind: conceptual|definitional|causal|historical|normative|cited_argument|mixed — link: <antecedent
      through bridge to consequent> — bridge-status: stated|reconstructed|unsettled — support-strength: necessary|possible|tendency|conditional|underdetermined
      — scope: <objects and additional conditions> — anchor: "<claimed link>" — doc: <key> — anchor-b: "<support
      or qualification, if separate>" — doc-b: <key> — confidence: high|medium|low'
    method_card: 'Do: Make the bridge inspectable and apply the standard appropriate to its task. A hypothetical

      counterexample need not report observed frequencies; an assertion about actual historical

      reception does need evidence of that occurrence. Do not assign numerical probabilities without

      a supplied basis. Keep structural claims, illustrations and empirical premises separate. A paper''s

      argument for a conclusion is one route until it establishes why alternatives cannot support it. Distinguish
      a positive conceptual derivation from an opponent premise rejected along the way. Quote the actual supporting
      step. General contingency or historical intensity does not refute a specifically scoped necessity claim.'
    indicators:
    - would therefore
    - requires
    - only if
    - might
    - tends to
    - because
  - key: alternatives_and_scope
    id_prefix: CF4
    name: Relevant alternatives and the scope of comparison
    scope: document
    load_bearing: false
    questions:
    - What alternative case or interpretation does the text consider under a comparable supposition, and what makes
      it relevant to this consequent?
    - Do different results arise because a background condition, object, modal force or argumentative task changed?
      Quote both cases and identify the difference before calling them inconsistent.
    - For a historical comparison, what warrants the similarity ordering and treatment of earlier causes? For a
      conceptual comparison, which disputed commitments must remain in place for the test to bear on the argument?
    - If an alternative is the analyst's proposed test, what textual premise makes it discriminating, and what would
      need further evidence? Do not present an invented scenario as one the paper claims.
    answer_shape: '[CF4.F<n>] <alternative and what the comparison tests> — dim: alternatives_and_scope — scenario:
      <stable label> — alternative: <case or interpretation> — origin: in_text|analyst_test — relevant-similarity:
      <shared conditions> — scope-difference: <changed object, background, modality or task> — result: supports|qualifies|challenges|does_not_discriminate|unsettled
      — anchor: "<original scenario or tested premise>" — doc: <key> — anchor-b: "<textual alternative or limiting
      passage, if available>" — doc-b: <key> — confidence: high|medium|low'
    method_card: 'Do: Compare the same proposition under controlled qualifications. The failure of a negative critique

      and the plausibility of a conditional constructive proposal are different targets. Start from

      alternatives available in the text. A proposed test can be useful without becoming source evidence;

      label it and anchor the premise it tests, not imaginary dialogue. Do not select a closest world

      or historical probability by intuition and report it as an established fact. Repair discipline: Inspect the
      strongest actual dependencies and counterexamples, including an inference that survives without granting the
      opponent premise and a rhetorical counterexample where supplied. Reconstruct the alternative route with complete
      attributed support before deciding which assumption matters.'
    indicators:
    - by contrast
    - another possibility
    - unless
    - on a different reading
    - in that case
  - key: survival_and_robustness
    id_prefix: CF5
    name: What loses support and what survives
    scope: document
    load_bearing: true
    questions:
    - 'If a disputed premise or additional change is withdrawn, what exactly loses support: this wording, this derivation,
      a stronger modal conclusion, or every route to the result?'
    - What independent conceptual, empirical or normative grounds does the text offer for the same conclusion? Test
      them rather than treating the most prominent route as indispensable.
    - Does a criticism remain intact if the paper's constructive alternative fails? Conversely, does failure of
      one criticism answer other independently developed objections?
    - What is the weakest surviving conclusion and its conditions? State when a subtraction is the text's explicit
      argument, an analyst reconstruction, or a test the available material cannot settle.
    answer_shape: '[CF5.F<n>] <withdrawal and the conclusion it actually leaves> — dim: survival_and_robustness
      — scenario: <stable label> — withdrawn: <premise or extra change> — affected-route: <specific formulation
      or derivation> — surviving-route: <separate support or not established> — conclusion-strength: unchanged|narrowed|this_route_defeated|all_routes_defeated_with_basis|unsettled
      — origin: text|analyst_reconstruction|proposed_test — anchor: "<withdrawn premise or affected route>" — doc:
      <key> — anchor-b: "<independent support or qualification, if available>" — doc-b: <key> — confidence: high|medium|low'
    method_card: 'Do: Remove one premise at a time while holding the remaining argument explicit. Distinguish a

      resource that the author uses from a commitment every accepter must undertake. Separate the

      identity of a theory from the adequacy of a revised descendant, and conceptual reconstruction

      from independently supplied history. Do not invent a casualty: a route can fail while the

      conclusion remains supported. No further support found is scoped to the inspected material. Hold the intervention
      fixed: removing uncertainty differs from rejecting the premise that uncertainty is necessary. Test whether
      purported independent routes survive the exact intervention, not a weaker substitute.'
    indicators:
    - even without
    - independently
    - whether or not
    - sufficient reason
    - remains valid
  - key: suppositions_across_texts
    id_prefix: CX6
    name: Comparable suppositions and changing inferential roles
    scope: corpus
    load_bearing: false
    questions:
    - Do two documents vary or grant the same condition under comparable background assumptions? Identify the shared
      variable and each text's inferential task before comparing outcomes.
    - Does one text deny an antecedent that another merely grants for argument, or do they genuinely make competing
      assertions about the same scenario? Preserve each owner's commitment.
    - Which result changes because the mechanism, object, scope or background changes, and which result remains
      robust? Do not infer revision from a shared conditional phrase alone.
    - What supports chronology or transmission between the texts, and what is only a useful comparison? A shared
      year or input order cannot establish an intellectual development.
    answer_shape: '[CX6.F<n>] <the comparable supposition and its role in each text> — dim: suppositions_across_texts
      — shared-variable: <condition compared> — background: <comparable and changed assumptions> — antecedent-status:
      <denied, open or granted in each text> — relation: continuity|changed_role|qualified_result|different_scope|incompatibility|unsettled
      — uptake-basis: <explicit link, dated order, or comparison only> — anchor: "<verbatim A>" — doc: <A> — anchor-b:
      "<verbatim B>" — doc-b: <B> — confidence: high|medium|low'
    method_card: 'Do: Keep the two local arguments intact. An antecedent granted to test robustness is not an

      empirical endorsement that can simply contradict another text''s historical denial. Trace changes

      in inferential use separately from changes in belief. Retain complete paired anchors and doc

      keys in every corpus descendant. Do not manufacture an alternative history, continuity or

      retraction to make the texts form a sequence. Report comparison limits and unsupported links. Read earlier
      caution before positing later sobriety. Preserve slavery versus later industrial-capitalist scope and any
      Abrahamic or practical qualification with additional anchored rows if needed.'
    indicators:
    - same supposition with another function
    - repeated concession
    - explicit revision
    - different background assumptions
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - 'Judge the warrant actually offered: conceptual, interpretive, causal, historical or normative.

      Lack of empirical evidence is not by itself a defect in a conceptual argument.

      An analyst''s ranking or reconstruction needs anchored grounds and explicit inferential

      status; the exact analytical label need not occur in the source. Distinguish a discussed

      alternative or disanalogy that is inadequately answered from one that is absent.

      Test a proposed counterexample against the actual quantified and modal claim, preserving

      its conditions and the distinctions between possibility, necessity and probability.'
    - check_anchors_in_context
    - reject_biography
    - Check the supposition's owner, denied or granted status, fixed conditions and modal consequent; do not convert
      an even-if grant into an assertion of actuality or necessity.
    - Test each claimed dependency against alternative argument routes and qualifications. A rejected route need
      not defeat the conclusion, and a stated consequent is not its own warrant.
    - merge_duplicates
    - hunt_misses
    - Name only supported must-keep finding IDs and why; do not add scenarios to meet a numerical quota. Preserve
      full source-qualified IDs and both anchors on corpus descendants.
    - Keep the candidate’s five document dimensions and corpus comparison. Correct Harris counterexample eligibility,
      Ganzinger positive-route ownership, Elling structural necessity versus historical intensity, and Deutschmann
      continuity and slavery qualifications. Do not substitute denial of a necessity premise for an intervention
      removing the condition itself.
    - Every consequential table cell must cite a final finding whose complete supporting spans contain the attributed
      fact and qualification. Split compound claims into several rows when <=200 characters cannot carry them. Use
      a separate [F1] [F2] citation per finding. Include an anchor-b with its doc-b for a second supporting span
      when needed, even in the same document; corpus relations always retain at least two distinct source keys.
      Never use a scope record as a positive finding. Use comma-separated full IDs in from:, never space-concatenated
      IDs. Judge meaning and completeness by reading the sources; code checks only anchors and IDs. Before returning,
      read the actual final tables against their cited final rows and the source contexts, including each source
      counted in coverage; repair or narrow unsupported cells. Keep execution/scope diagnostics separate from source
      interpretations; an unchecked record means the check was incomplete, not that the source is meaningless or
      silent.
    - check_matrix_cell_support
    - 'Apply these source-read repair checks: Inspect the strongest actual dependencies and counterexamples, including
      an inference that survives without granting the opponent premise and a rhetorical counterexample where supplied.
      Reconstruct the alternative route with complete attributed support before deciding which assumption matters.
      Keep granting an opponent premise for argument separate from endorsing it. Reconcile attribution across the
      finding, explanatory prose and table; use separate spans for the speaker and the supposed outcome.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: a reader deciding which suppositions carry an argument and how much survives if they change
    tables:
    - scenarios
    - dependencies
    - robustness
    brief: "Keep canonical finding IDs consistent in prose and the final ledger. If final IDs change,\nuse them\
      \ in every prose citation and preserve original IDs in from fields. Every corpus\ncomparison and descendant\
      \ retains complete anchors from both source keys.\n1. State the most consequential supported supposition and\
      \ what it tests. Give a compact\n   inventory distinguishing counterfactuals, open conditionals, concessions,\
      \ reductios and\n   analyst reconstructions, with each owner's actual commitment and the consequent's modality.\n\
      2. Explain what is varied or granted and what remains fixed. Expose additional assumptions\n   without requiring\
      \ an alternate history when the argument is conceptual or normative.\n3. Trace the inferential bridge, its\
      \ supporting passage and the missing step if one remains.\n   Distinguish necessity, vulnerability, tendency\
      \ and possibility; retain limiting conditions.\n4. Examine the strongest relevant alternative under comparable\
      \ conditions. State when the\n   comparison changes the object or background, and mark a reader's proposed\
      \ test as such.\n5. Withdraw the disputed premise or extra change and show the surviving argument. Separate\n\
      \   losing a formulation, losing a route and losing every route; preserve independent grounds\n   and distinguish\
      \ the paper's criticism from the success of its constructive alternative.\n6. For a corpus, establish each\
      \ document's scenario and then compare shared conditions,\n   changed roles and qualified outcomes. Keep all\
      \ source outcomes visible and qualify claims\n   of chronology or uptake. End with what the material settles\
      \ and the one unresolved test\n   that matters most, without inventing a probability or a required casualty.\n\
      Tables: scenarios lists owner, kind, antecedent status, consequent and function; dependencies\nlists changed\
      \ and fixed conditions, bridge and supported scope; robustness lists withdrawn\npremise, affected route, independent\
      \ support and surviving conclusion. Name finding IDs in\nevery row; omit a table that has no supported material\
      \ rather than populating it speculatively.\nA scoped negative or inconclusive outcome requires the separate\
      \ scope report:\nwhat was sought, what was inspected, why no relevant instance was retained, review state\n\
      and limits. No fabricated normal ledger or scenario is permitted. Follow the\nscoped-outcome contract supplied\
      \ in this prompt.\nEvery consequential table cell must cite a final finding whose complete supporting spans\
      \ contain the attributed fact and qualification. Split compound claims into several rows when <=200 characters\
      \ cannot carry them. Use a separate [F1] [F2] citation per finding. Include an anchor-b with its doc-b for\
      \ a second supporting span when needed, even in the same document; corpus relations always retain at least\
      \ two distinct source keys. Never use a scope record as a positive finding. Use comma-separated full IDs in\
      \ from:, never space-concatenated IDs. Judge meaning and completeness by reading the sources; code checks\
      \ only anchors and IDs. Before returning, read the actual final tables against their cited final rows and\
      \ the source contexts, including each source counted in coverage; repair or narrow unsupported cells. Keep\
      \ execution/scope diagnostics separate from source interpretations; an unchecked record means the check was\
      \ incomplete, not that the source is meaningless or silent.\n\nAfter the check, rewrite or drop cells resting\
      \ on rejected or unverified findings; rewrite weakened claims everywhere they occur. A rejection tag is acceptable\
      \ only in prose, not as validation of a table cell. Keep separate granular support when deduplicating. Apply\
      \ the method-card repairs to the final reading and its tables."
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
