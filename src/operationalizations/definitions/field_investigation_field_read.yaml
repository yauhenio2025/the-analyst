engine_key: field_investigation_field_read
engine_name: Read one argument in the field
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Read one argument in the field
  framing: Investigate the supplied question through institutional originals without requiring a
    target thinker. Reconstruct arguments, mechanisms, constraints, interventions and disagreement
    from the actual documents and voices. Keep adoption, signed views, guest contributions and participant
    statements distinct. Prior maps are retained analysis; only original passages support new source
    claims. Describe the considered, searched, acquired and actually read population separately,
    including geographic, language and publication-date coverage. Search misses and unavailable originals
    cannot establish institutional silence. Group by institution without manufacturing consensus
    from internal disagreement, syndicated copies or several formats of one event. Preserve evidence
    identities, exact quotations and native page/time loci. Never invent missing originals, authority,
    dates, transcripts or positions. Treat question premises and causal inferences as hypotheses.
    If validation_errors and previous_draft are supplied, return a complete corrected answer supported
    by the same evidence; preserve uncertainty instead of manufacturing support. When inquiry_type
    is not institutional, also consider the supplied thinker/field question; never attribute a field
    claim to the thinker.
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: evidence
    name: Read the field author in context
    questions:
    - Extract source-grounded claims, mechanisms, empirical design and findings, contrary cases and
      limits. Distinguish what the text demonstrates from what it hypothesizes; name whose claim
      it is. Every row must quote an actually supplied passage of this field source. Do not attribute
      any field fact to the focal thinker.
    method_card: >-
      Extract source-grounded claims, mechanisms, empirical design and findings, contrary
      cases and limits. Distinguish what the text demonstrates from what it hypothesizes; name whose
      claim it is. Every row must quote an actually supplied passage of this field source. Do not
      attribute any field fact to the focal thinker. Name the voice of every finding as direct (the
      speaker's own words, quoted), reported (their words as the author reports them), narration (the
      author's or journalist's own claim) or document (an official or institutional text). A journalist's
      sentence about what a company's purchases should mean to a party is narration, not the
      executive's statement. When a research_state is supplied in context, say which of its
      explanations the finding bears on and whether it supports, undercuts or only gives context; a
      participant advocating an effect supports the claim that they advocate it, not that the effect
      exists.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E1
    answer_shape: '[E1.F<n>] <finding in one sentence> — dim: evidence — uid: <source_metadata.uid>
      — relation: thesis|mechanism|method|counterevidence|qualification — speaker: <actual speaker>
      — voice: direct|reported|narration|document — bears_on: <program explanation ids, or none>
      — bearing: supports|undercuts|context|none
      — scale: <unit and scope> — locus: <supplied page or source characters> — anchor: "<verbatim
      supplied passage, <=200 chars>" — doc: <actual supplied source key> — confidence: high|medium|low'
  - key: gap
    name: State what this reading cannot establish
    questions:
    - Identify weak evidence, untested mechanisms, conflicting interpretations and relevant questions
      unaddressed by these inspected ranges. A missing discussion is not a refutation.
    method_card: Identify weak evidence, untested mechanisms, conflicting interpretations and relevant
      questions unaddressed by these inspected ranges. A missing discussion is not a refutation.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E2
    answer_shape: '[E2.F<n>] <finding in one sentence> — dim: gap — uid: <source_metadata.uid> —
      gap: <specific unresolved issue> — follow_up: <test or text> — anchor: "<verbatim supplied
      passage, <=200 chars>" — doc: <actual supplied source key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 35
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the researcher developing a position through the thinker and field
    brief: 'Write a substantive reading of THIS field text: thesis, mechanism, population and cases,
      research design, evidence strength, rival explanations, normative/strategic stakes, qualifications
      and useful counterevidence. Do not force it into agreement with the thinker. Then give the
      evidence and gap ledger.'
    max_rows: 60
  method_refs:
  - engine_key: multimedia_source_criticism
    version: 1
  - engine_key: causal_mechanism_audit
    version: 1
  - engine_key: institutional_argument_criticism
    version: 1
version: 3
method_metadata:
  applies_when: Reading or mapping field originals in a bilateral or author-independent institutional
    inquiry.
  required_inputs:
  - Question and declared institutional scope
  - Frozen institutional originals and source relationships
  - Actual discovery/acquisition/read coverage and optional prior analysis
  outputs:
  - Source-linked argument and mechanism findings
  - Policy interventions, disagreements, qualifications and open tests
  limitations:
  - Cannot establish official adoption or silence from hosting or search coverage
  - Does not classify an organization from its name or infer funding influence from affiliation
  provenance:
  - kind: commission
    date: '2026-09-09'
    source: the-reporter:communications/COMMISSION_2026-09-09_think_tank_inquiries_in_stacks.md
    evaluation: Deterministic routing tests; substantive evaluation pending
