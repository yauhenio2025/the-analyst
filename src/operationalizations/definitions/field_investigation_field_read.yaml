engine_key: field_investigation_field_read
engine_name: Read one argument in the field
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Read one argument in the field
  framing: 'Investigate a bilateral question between a named thinker and a topical
    research field. The field is a collection of independently authored arguments,
    competing mechanisms, methods and cases, never a homogeneous position and never
    merely secondary commentary on the thinker. Identify what each side can teach
    or challenge in the other, and what should change in the researcher''s own account.
    Distinguish description, causal explanation, normative commitments, strategy,
    historical scope, level of analysis, and conditions of applicability. A field
    author''s finding is not the thinker''s claim: only a verified quotation from
    a supplied primary source can support thinker attribution. A proposed extension
    or application belongs explicitly to this inquiry. Prior memos and profiles are
    provisional context, not primary testimony; compare against them when supplied
    and work independently when they are absent. Attribute coauthors, interviewers,
    opponents and quoted speakers carefully. Edition/reprint dates do not establish
    a new intervention. Search hits guide reading; lexical silence, missing texts,
    excluded sources and inspected windows cannot establish absence across an oeuvre
    or field. Keep counterevidence, qualifications and unresolved cases. Use only
    supplied evidence identities and exact source anchors; never invent a quote, page,
    author position, event or factual claim. Inspected ranges and coverage constrain
    every conclusion. Method interpretation is not mechanically verified by a citation
    match. If validation_errors and a previous_draft are supplied, reconsider the
    identified unsupported claims against the same evidence and return a complete
    corrected output; preserve uncertainty and never manufacture support identities
    or quotations.'
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: evidence
    name: Read the field author in context
    questions:
    - Extract source-grounded claims, mechanisms, empirical design and findings, contrary
      cases and limits. Distinguish what the text demonstrates from what it hypothesizes;
      name whose claim it is. Every row must quote an actually supplied passage of
      this field source. Do not attribute any field fact to the focal thinker.
    method_card: Extract source-grounded claims, mechanisms, empirical design and
      findings, contrary cases and limits. Distinguish what the text demonstrates
      from what it hypothesizes; name whose claim it is. Every row must quote an actually
      supplied passage of this field source. Do not attribute any field fact to the
      focal thinker.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E1
    answer_shape: '[E1.F<n>] <finding in one sentence> — dim: evidence — uid: <source_metadata.uid>
      — relation: thesis|mechanism|method|counterevidence|qualification — speaker:
      <actual speaker> — scale: <unit and scope> — locus: <supplied page or source
      characters> — anchor: "<verbatim supplied passage, <=200 chars>" — doc: <actual
      supplied source key> — confidence: high|medium|low'
  - key: gap
    name: State what this reading cannot establish
    questions:
    - Identify weak evidence, untested mechanisms, conflicting interpretations and
      relevant questions unaddressed by these inspected ranges. A missing discussion
      is not a refutation.
    method_card: Identify weak evidence, untested mechanisms, conflicting interpretations
      and relevant questions unaddressed by these inspected ranges. A missing discussion
      is not a refutation.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E2
    answer_shape: '[E2.F<n>] <finding in one sentence> — dim: gap — uid: <source_metadata.uid>
      — gap: <specific unresolved issue> — follow_up: <test or text> — anchor: "<verbatim
      supplied passage, <=200 chars>" — doc: <actual supplied source key> — confidence:
      high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 35
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the researcher developing a position through the thinker and field
    brief: 'Write a substantive reading of THIS field text: thesis, mechanism, population
      and cases, research design, evidence strength, rival explanations, normative/strategic
      stakes, qualifications and useful counterevidence. Do not force it into agreement
      with the thinker. Then give the evidence and gap ledger.'
    max_rows: 60
