# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: incentives_constrained_choices
engine_name: Incentives and constrained choices
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: What incentives in the supplied account reward or discourage each actor's actions? Actors, documented
    rewards/penalties, constraints and choices; source-reported beliefs or histories only when supplied.
  framing: A reading organized around the strongest documented incentive mechanism and its limits, with an actor/action/reward-or-penalty/constraint/observed-response
    table. A second table tests delegation, information gaps, alternative explanations and explicitly conditional
    response scenarios. Retain reward, punishment, constraint, delegation and observed-response questions from the
    three source engines. Their mandatory worldview profiles, numeric gaming probabilities, principal-agent dysfunction
    and Nash equilibria are not identifiable from an ordinary paper. Ask first whether those relations exist, and
    distinguish response evidence from a conditional model.
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: incentives
    id_prefix: D1
    name: Rewards and penalties
    scope: document
    load_bearing: true
    questions:
    - What does this system actually reward, and why do people act the way they do?
    answer_shape: '[D1.F<n>] <one source-scoped finding> — dim: incentives — actor: <value or unknown> — action:
      <value or unknown> — reward-or-penalty: <value or unknown> — mechanism: <value or unknown> — anchor: "<literal
      actor and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Answer the causal part only to the extent the text supports it. Specify who offers the incentive,
      to whom and conditional on which action. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - incentive
    - subsidy
    - sanction
  - key: constraints
    id_prefix: D2
    name: Feasible choices
    scope: document
    load_bearing: true
    questions:
    - What documented constraints shape the actor’s available choices?
    answer_shape: '[D2.F<n>] <one source-scoped finding> — dim: constraints — actor: <value or unknown> — options:
      <value or unknown> — constraint: <value or unknown> — scope: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Do not invent a complete option set or private utility function. Differentiate technical,
      legal, financial and geopolitical constraints. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - license
    - cost
    - requirement
  - key: responses
    id_prefix: D3
    name: Observed and conditional responses
    scope: document
    load_bearing: true
    questions:
    - Which response is reported, and what evidence links it to the incentive rather than merely preceding it?
    answer_shape: '[D3.F<n>] <one source-scoped finding> — dim: responses — actor: <value or unknown> — response:
      <value or unknown> — observed-or-conditional: <value or unknown> — link: <value or unknown> — anchor: "<literal
      actor and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Quote the response predicate and the source’s causal attribution separately where necessary.
      Retain competing commercial and political explanations. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - after
    - because
    - switched
  - key: delegation
    id_prefix: D4
    name: Delegation and information
    scope: document
    load_bearing: false
    questions:
    - Does the text document delegation, conflicting objectives or unequal information; what control mechanism follows?
    answer_shape: '[D4.F<n>] <one source-scoped finding> — dim: delegation — principal: <value or unknown> — agent:
      <value or unknown> — delegated-task: <value or unknown> — information: <value or unknown> — control: <value
      or unknown> — anchor: "<literal actor and predicate span, <=200 chars>" — doc: <source key> — confidence:
      high|medium|low'
    method_card: 'Do: Do not presume a principal-agent problem from a state-company interaction. Record an absent
      delegation basis as a scoped limit. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - contract
    - monitoring
    - disclosure
  - key: alternatives
    id_prefix: D5
    name: Rival explanations and changed conditions
    scope: document
    load_bearing: false
    questions:
    - What alternative explanation or changed condition would alter the proposed response mechanism?
    answer_shape: '[D5.F<n>] <one source-scoped finding> — dim: alternatives — mechanism: <value or unknown> — rival:
      <value or unknown> — condition: <value or unknown> — prediction-status: <value or unknown> — anchor: "<literal
      actor and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Label analyst scenarios explicitly and ground their constraints in source findings. End with
      what observed evidence distinguishes the accounts and what remains untested. Select literal spans that together
      carry the finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters
      cannot do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text
      or normalize a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without
      the claimed predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology
      and uncertainty in the final claim. No scope record supplies positive evidence.'
    indicators:
    - although
    - alternative
    - if
  - key: across_sources
    id_prefix: X6
    name: Aligned objects across supplied sources
    scope: corpus
    load_bearing: false
    questions:
    - Which supplied sources address the same object on this method’s question, and what aligned agreement or difference
      do their passages support?
    answer_shape: '[X6.F<n>] <scoped relation> — dim: across_sources — object: <aligned object> — relation: <agreement
      or difference> — anchor: "<literal supporting span>" — doc: <A> — anchor-b: "<literal supporting span>" —
      doc-b: <different B> — confidence: high|medium|low'
    method_card: 'Do: Establish a local inventory in each supplied document first. Match identity, question, time
      and scope before relating findings. Preserve two distinct source keys and the predicate on each side. One
      article quoting several authors is still one supplied document. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - same object in two sources
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the source open who needs to answer: What incentives in the supplied account reward or
      discourage each actor''s actions?'
    tables:
    - incentives_constrained_choices_inventory
    - incentives_constrained_choices_relations
    brief: '1. A reading organized around the strongest documented incentive mechanism and its limits, with an actor/action/reward-or-penalty/constraint/observed-response
      table. A second table tests delegation, information gaps, alternative explanations and explicitly conditional
      response scenarios.

      2. Lead with the most consequential supported distinction, organized around source objects and questions.
      Carry one explanatory judgment through the evidence and its strongest counter-passage.

      3. Render the two named Markdown tables, with explicit limits and citable rows; end with what is established
      and the evidence still needed.

      4. With multiple supplied texts, establish local inventories before an aligned relation; with one text do
      not pretend there is a supplied corpus.

      Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
