# Fourth queue: communications/study/REDESIGN_fourth_queue_2026-09-06.md
engine_key: pedagogical_pathway
engine_name: A reader's learning route
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: In what order would a reader need to grasp the concepts in this material? Material to learn plus
    the reader's starting knowledge when a tailored route is requested.
  framing: A proposed learning route through named concepts and passages, with prerequisite/reason/scaffold rows;
    a second table of likely misreadings and alternative entry points, explicitly separating source dependencies
    from advice for an unspecified learner. Keep concepts, prerequisites, sequences, scaffolds, thresholds and misconceptions.
    The legacy learning_sequences asks estimated_duration and target_learner, while threshold fields imply actual
    learner transformation. Without learner evidence these are proposed aids and dependencies, not measured difficulty,
    duration or learning effects.
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: concepts
    name: Concepts
    scope: document
    id_prefix: D1
    load_bearing: true
    questions:
    - Which concepts must a reader distinguish to follow the paper’s question and main answer?
    answer_shape: concept; local meaning; passage to read; role; doc; verbatim anchor(s); uncertainty
    method_card: 'Do: Extract source meanings and keep rival thinkers’ uses distinct. Do not replace the route with
      a generic subject syllabus. Select literal spans that together carry the finding’s actor, predicate, object
      and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including
      within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status
      and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
    indicators:
    - concept
    - local meaning
    - passage to read
  - key: prerequisites
    name: Prerequisites
    scope: document
    id_prefix: D2
    load_bearing: true
    questions:
    - Where does understanding one concept help or enable understanding another, and what passage supports that
      dependence?
    answer_shape: prerequisite; next concept; required/helpful/assumed; textual reason; doc; verbatim anchor(s);
      uncertainty
    method_card: 'Do: Retain prerequisite relations and anchor the passage using both concepts. Mark an inferred
      teaching dependency as a proposal. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span,
      including within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality,
      status and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
    indicators:
    - prerequisite
    - next concept
    - required/helpful/assumed
  - key: sequence
    name: Sequence
    scope: document
    id_prefix: D3
    load_bearing: true
    questions:
    - What sequence of passages would make those dependencies intelligible, and where could another entry point
      work?
    answer_shape: ordered concept/passage; reason; alternative; learner assumption; doc; verbatim anchor(s); uncertainty
    method_card: 'Do: Build an explicit proposed order using supported dependencies. Do not confuse author section
      order with the only valid learning order. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span,
      including within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality,
      status and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
    indicators:
    - ordered concept/passage
    - reason
    - alternative
  - key: scaffolds
    name: Scaffolds
    scope: document
    id_prefix: D4
    load_bearing: false
    questions:
    - Which source examples, analogies or contrasts can help explain a difficult concept, with what limits?
    answer_shape: source aid; concept supported; use; limit; doc; verbatim anchor(s); uncertainty
    method_card: 'Do: Use the source’s actual example or contrast with its predicate. Any new analogy must be visibly
      hypothetical and not misattributed. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span,
      including within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality,
      status and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
    indicators:
    - source aid
    - concept supported
    - use
  - key: misreadings
    name: Misreadings
    scope: document
    id_prefix: D5
    load_bearing: false
    questions:
    - What plausible misreading does a source qualification correct, and what learner difficulty remains unknown?
    answer_shape: possible misreading; corrective passage; proposed checkpoint; uncertainty; doc; verbatim anchor(s);
      uncertainty
    method_card: 'Do: Retain threshold/misconception questions as hypotheses about reading. Do not invent known
      student errors, durations or demonstrated learning gains. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one short span cannot do so, use anchor-b/doc-b for
      a separate span, including within one document. Never concatenate separated phrases into a quotation. Keep
      attribution, modality, status and chronology; re-anchor, narrow or reject a verbatim quote that omits the
      claimed predicate.'
    indicators:
    - possible misreading
    - corrective passage
    - proposed checkpoint
  - key: across_documents
    name: Aligned supplied accounts
    scope: corpus
    id_prefix: CORPUS
    load_bearing: false
    questions:
    - If multiple documents are supplied, what common question can be aligned using a supported local finding from
      each, and what stays incomparable?
    answer_shape: aligned object/question; per-document answer; supported relation; doc/anchor and doc-b/anchor-b;
      coverage limit
    method_card: 'Do: Inventory each supplied work first, then pair actual answers to the same question. Require
      two different document keys for a cross-document claim. A single-paper contrast stays in its document dimension.
      Do not infer transmission, chronological change or field-wide consensus from similarity. Select literal spans
      that together carry the finding’s actor, predicate, object and necessary qualification. If one short span
      cannot do so, use anchor-b/doc-b for a separate span, including within one document. Never concatenate separated
      phrases into a quotation. Keep attribution, modality, status and chronology; re-anchor, narrow or reject a
      verbatim quote that omits the claimed predicate.'
    indicators:
    - same object across supplied texts
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 6
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites retained final finding IDs using separate [F1] [F2] citations. Reread
      the actual final tables against the applied ledger and the source: rewrite or drop cells supported by rejected,
      unverified or narrowed-away claims. Keep granular evidence when merging; use comma-separated full IDs in from:.
      Scope records state coverage or uncertainty and never supply positive evidence. Code checks anchors and IDs;
      models judge meaning. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including
      within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status
      and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the supplied paper open who needs to answer: In what order would a reader need to grasp
      the concepts in this material?'
    tables:
    - pedagogical_pathway_inventory
    - pedagogical_pathway_relations
    brief: '1. A proposed learning route through named concepts and passages, with prerequisite/reason/scaffold
      rows; a second table of likely misreadings and alternative entry points, explicitly separating source dependencies
      from advice for an unspecified learner.

      2. Lead with the most useful source-supported distinction and its limits; give a selective accurate inventory,
      without forcing a novel thesis.

      3. Render the two named Markdown tables with citable rows; distinguish established relations, interpretations
      and missing evidence.

      4. On one paper, do not pretend there is a supplied corpus. On multiple papers, retain each local inventory
      before aligning.

      Every substantive table cell cites retained final finding IDs using separate [F1] [F2] citations. Reread the
      actual final tables against the applied ledger and the source: rewrite or drop cells supported by rejected,
      unverified or narrowed-away claims. Keep granular evidence when merging; use comma-separated full IDs in from:.
      Scope records state coverage or uncertainty and never supply positive evidence. Code checks anchors and IDs;
      models judge meaning. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one short span cannot do so, use anchor-b/doc-b for a separate span, including
      within one document. Never concatenate separated phrases into a quotation. Keep attribution, modality, status
      and chronology; re-anchor, narrow or reject a verbatim quote that omits the claimed predicate.'
