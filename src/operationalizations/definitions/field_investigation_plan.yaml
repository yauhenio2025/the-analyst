engine_key: field_investigation_plan
engine_name: Plan a thinker and field inquiry
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Plan a thinker and field inquiry
  framing: 'Investigate a bilateral question between a named thinker and a topical
    research field. The field is a collection of independently authored arguments,
    competing mechanisms, methods and cases, never a homogeneous position and never
    merely secondary commentary on the thinker. Identify what each side can teach
    or challenge in the other, and what should change in the researcher''s own account.
    Distinguish description, causal explanation, normative commitments, strategy,
    historical scope, level of analysis, and conditions of applicability. A field
    author''s finding is not the thinker''s claim: only a verified quotation from
    a supplied primary source can support thinker attribution. A proposed extension
    or application belongs explicitly to this inquiry. Prior memos and profiles are
    provisional context, not primary testimony; compare against them when supplied
    and work independently when they are absent. Attribute coauthors, interviewers,
    opponents and quoted speakers carefully. Edition/reprint dates do not establish
    a new intervention. Search hits guide reading; lexical silence, missing texts,
    excluded sources and inspected windows cannot establish absence across an oeuvre
    or field. Keep counterevidence, qualifications and unresolved cases. Use only
    supplied evidence identities and exact source anchors; never invent a quote, page,
    author position, event or factual claim. Inspected ranges and coverage constrain
    every conclusion. Method interpretation is not mechanically verified by a citation
    match. If validation_errors and a previous_draft are supplied, reconsider the
    identified unsupported claims against the same evidence and return a complete
    corrected output; preserve uncertainty and never manufacture support identities
    or quotations. When field_evidence_representation is reference_index_to_supplied_argument_maps,
    the complete original field support identities are retained while quotations live
    in the durable source readings. Use only claims and meanings present in the supplied
    argument maps; do not infer new details from an evidence identity. Evidence selection
    or compression never licenses an absence claim.'
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: question
    name: Form bilateral questions
    questions:
    - State what the thinker may illuminate in the field and what the field may correct
      or complicate in the thinker. Identify rival causal mechanisms, units, scales,
      populations, time horizons, empirical and normative questions, and what evidence
      would make the researcher change position. Do not prejudge compatibility.
    method_card: State what the thinker may illuminate in the field and what the field
      may correct or complicate in the thinker. Identify rival causal mechanisms,
      units, scales, populations, time horizons, empirical and normative questions,
      and what evidence would make the researcher change position. Do not prejudge
      compatibility.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E1
    answer_shape: '[E1.F<n>] <finding in one sentence> — dim: question — subquestion:
      <answerable question> — test: <evidence needed> — direction: thinker_to_field|field_to_thinker|bilateral
      — anchor: "<verbatim supplied passage, <=200 chars>" — doc: <actual supplied
      source key> — confidence: high|medium|low'
  - key: query
    name: Expand source reading vocabulary
    questions:
    - Give 12–24 distinct literal search phrases, including mechanisms, actor identities,
      institutions, qualifications and contrary outcomes. These route windows within
      EVERY selected field and author text, not a selection of agreeable texts. No
      Boolean operators.
    method_card: Give 12–24 distinct literal search phrases, including mechanisms,
      actor identities, institutions, qualifications and contrary outcomes. These
      route windows within EVERY selected field and author text, not a selection of
      agreeable texts. No Boolean operators.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E2
    answer_shape: '[E2.F<n>] <finding in one sentence> — dim: query — query: <literal
      phrase> — purpose: <what it could reveal> — anchor: "<verbatim supplied passage,
      <=200 chars>" — doc: <actual supplied source key> — confidence: high|medium|low'
  - key: baseline
    name: Locate a provisional starting position
    questions:
    - For follow_up, identify the supplied prior memo's conclusions and uncertainties
      with its real job/source identity and concrete passages; mark truncated or unavailable
      baseline context. For standalone, formulate a provisional research question
      without inventing a prior investigation.
    method_card: For follow_up, identify the supplied prior memo's conclusions and
      uncertainties with its real job/source identity and concrete passages; mark
      truncated or unavailable baseline context. For standalone, formulate a provisional
      research question without inventing a prior investigation.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: E3
    answer_shape: '[E3.F<n>] <finding in one sentence> — dim: baseline — mode: standalone|follow_up
      — prior_id: <supplied identity or none> — proposition: <starting position or
      unknown> — anchor: "<verbatim supplied passage, <=200 chars>" — doc: <actual
      supplied source key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 35
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the researcher developing a position through the thinker and field
    brief: Plan the bilateral question, tests and reading vocabulary. This is a research
      plan, not a conclusion.
    max_rows: 60
