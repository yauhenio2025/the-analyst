engine_key: author_investigation_memo
engine_name: Answer with evidence and coverage
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Answer with evidence and coverage
  framing: Investigate the supplied question about the named author, building on existing
    profiles, citation ledgers, prior readings, secondary analyses and Referee context.
    Separate the publication date from the historical period discussed. Treat the
    stated event in the question as a question, never as an established fact. Profiles,
    search matches, prior memos, citations and Referee descriptions are leads, not
    the author's testimony. Attribute interlocutors, interviewers, coauthors and quoted
    opponents carefully. Only supplied primary text supports direct claims about what
    the author says. Citation co-occurrence is a retrieval route, not proof of substantive
    engagement. Search absence, unread material and missing text never establish that
    the author never discusses a topic. State the actual corpus and window coverage.
    Keep uncertainty, counterevidence and unresolved cases. Use literal independent
    source anchors, preserving negation and qualifications. Never invent a quote,
    page or source id. An edition, reprint, translated edition or container publication
    date does not establish a new intervention; consult supplied date/edition metadata
    and flag unresolved original dates. A book-section container is not the author's
    own chapter unless the packet establishes authorship. Quotes marked quote_verified
    false are conjectures and cannot support a direct answer.
  scoped_outcomes: false
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: answer
    name: Answer every subquestion
    questions:
    - Give a calibrated answer to each subquestion using the primary evidence already
      read. Cite the exact primary source and quote, with the original speaker and
      historical context. A prior memo can suggest an interpretation but cannot establish
      what the author said.
    method_card: Give a calibrated answer to each subquestion using the primary evidence
      already read. Cite the exact primary source and quote, with the original speaker
      and historical context. A prior memo can suggest an interpretation but cannot
      establish what the author said.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: M1
    answer_shape: '[M1.F<n>] <finding in one sentence> — dim: answer — subquestion:
      <which> — answer: <qualified finding> — support: <reading finding ids> — anchor:
      "<verbatim, <=200 chars>" — doc: <actual supplied source key> — confidence:
      high|medium|low'
  - key: qualification
    name: Separate limits from silence
    questions:
    - Name counterevidence, weak attribution, unknown dates, missing primary bodies,
      windowed readings, deferred texts and exhausted caps affecting each answer.
      Do not state never/no discussion from search silence.
    method_card: Name counterevidence, weak attribution, unknown dates, missing primary
      bodies, windowed readings, deferred texts and exhausted caps affecting each
      answer. Do not state never/no discussion from search silence.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: M2
    answer_shape: '[M2.F<n>] <finding in one sentence> — dim: qualification — limitation:
      <what was not established> — consequence: <how this limits the answer> — anchor:
      "<verbatim, <=200 chars>" — doc: <actual supplied source key> — confidence:
      high|medium|low'
  - key: next
    name: Leave reusable next steps
    questions:
    - Name the highest-value remaining text, citation path or Referee lookup and what
      it could resolve. Missing holdings and external actions remain recommendations.
    method_card: Name the highest-value remaining text, citation path or Referee lookup
      and what it could resolve. Missing holdings and external actions remain recommendations.
    indicators:
    - question
    - evidence
    - context
    scope: document
    load_bearing: true
    id_prefix: M3
    answer_shape: '[M3.F<n>] <finding in one sentence> — dim: next — uid: <uid or
      unknown> — work_key: <canonical work key or unknown> — action: <specific follow-up>
      — reason: <why> — anchor: "<verbatim, <=200 chars>" — doc: <actual supplied
      source key> — confidence: high|medium|low'
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension
    model_tier: cheap
    output: ledger
    max_rows: 40
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - merge_duplicates
    - hunt_misses
    - name_must_keep
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: the researcher investigating this author
    brief: Write the final research memo in connected prose, leading with the answer.
      Address the actual questions separately, including contemporary labor action,
      historical labor struggle, conceptual treatment and any named event only where
      evidence supports them. Cite primary source titles, years and supplied loci
      with finding ids. Explain publication scope and discussed periods, distinguish
      evidence of engagement from absence of evidence, and finish with the material
      coverage limits and next readings. Then give the evidence ledger. Cite evidence
      in prose with its full supplied citation_id in brackets, for example [em:ABCDEFGH/E1.F1].
      A bare E1.F1 is ambiguous across readings. Use only actual evidence ids and
      preserve the source title and year in nearby prose.
    max_rows: 60
