# Second queue repair: prompts/cards only; analytical questions preserved.
engine_key: modal_force_inventory
engine_name: Possibility, necessity and certainty
process:
  key: dvs
  description: What does the text claim must, may or cannot hold, and what supports that force? Text containing
    modal claims or thought experiments; extra evidence only when the claim invokes it.
  framing: 'An operator inventory a reader can inspect: exact proposition and owner, must/may/cannot/ought or epistemic
    hedge, type and scope, supporting warrant, justified force and available alternative. Lead with the most consequential
    force distinction. Desks lift modal-claim and force-change tables; useful coverage is the product, with no compulsory
    discovery of equivocation. Merge modal reasoning, epistemic stance and imagination failure. Preserve operator,
    type, thought-experiment and threshold probes. Replace mandatory deductive proof, arbitrary ignored branches
    and mental incapacity with warrant-appropriate checks and supplied alternatives.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: operators
    id_prefix: D1
    name: Claims and exact operators
    scope: document
    load_bearing: true
    questions:
    - What does the text claim must be the case, and what kind of necessity is invoked?
    - What does the text claim could be different, and how is this possibility established?
    answer_shape: '[D1.F<n>] <one scoped finding> — dim: operators — claim: <owned proposition> — operator: <exact
      words> — kind: <epistemic, alethic, deontic, practical> — anchor: "<verbatim supporting clause, <=200 chars>"
      — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Keep the operator with its proposition and owner. Inventory uncertainty as well as necessity;
      a quoted opponent is not the paper’s commitment.'
    indicators:
    - must
    - may
    - cannot
    - ought
    - probably
  - key: scope
    id_prefix: D2
    name: Scope of the operator
    scope: document
    load_bearing: true
    questions:
    - What object, quantifier, condition and time fall under each modal operator?
    - Does a necessary exposure or capacity leave actual realization contingent?
    answer_shape: '[D2.F<n>] <one scoped finding> — dim: scope — claim: <proposition> — quantifier: <scope> — condition:
      <if clause> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Bracket the operator’s scope explicitly. Separate necessity of vulnerability, frequency of
      realization and probability of a particular outcome. Repair discipline: Give each materially distinct example
      its own finding and literal evidence: an anchor for marriage cannot carry childhood, populism or Nazism. Retain
      the full conditional antecedent and its consequent in separate spans if needed. Preserve bracketed letters
      such as [i]f exactly; do not silently normalize them in a quotation.'
    indicators:
    - always
    - if
    - liable to
    - sometimes
  - key: warrant
    id_prefix: D3
    name: Support for the force
    scope: document
    load_bearing: true
    questions:
    - Does the text distinguish between different grades of necessity and possibility?
    - What conceptual, empirical, normative or practical warrant supports this exact force?
    answer_shape: '[D3.F<n>] <one scoped finding> — dim: warrant — claim: <proposition> — warrant: <passage and
      kind> — justified-force: <assessment> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source
      key> — confidence: high|medium|low'
    method_card: 'Do: Assess the argument actually offered; conceptual necessity need not have frequency data. Separate
      an absent derivation from one present but inadequate.'
    indicators:
    - because
    - by definition
    - evidence suggests
  - key: force_changes
    id_prefix: D4
    name: Changes of modal register
    scope: document
    load_bearing: false
    questions:
    - Are modal operators used consistently, or do they shift meaning across contexts?
    - Does an alleged change concern the same proposition and conditions, or a distinct claim?
    answer_shape: '[D4.F<n>] <one scoped finding> — dim: force_changes — claim: <aligned proposition> — first-force:
      <operator> — second-force: <operator> — reason: <scope relation> — anchor: "<verbatim supporting clause, <=200
      chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Pair both formulations and retain their conditions. Do not infer is-to-ought or epistemic-to-metaphysical
      drift from adjacent vocabulary alone.'
    indicators:
    - could
    - therefore must
    - ought
  - key: possibility_tests
    id_prefix: D5
    name: Scenarios and alternatives
    scope: document
    load_bearing: false
    questions:
    - What background assumptions does the scenario take for granted?
    - Does conceivability in the thought experiment genuinely establish possibility?
    - Which alternative does the text itself consider, and does it vary the condition relevant to this claim?
    answer_shape: '[D5.F<n>] <one scoped finding> — dim: possibility_tests — scenario: <test> — background: <fixed
      conditions> — supports: <modal conclusion> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source
      key> — confidence: high|medium|low'
    method_card: 'Do: Distinguish a coherent conceptual counterexample from a historical forecast. Lack of an imagined
      alternative proves no impossibility. Repair discipline: Distinguish an illustrative possibility, a necessary
      condition and a blocked outcome. Quote the blockage contrast as well as the positive example; preserve whose
      modal judgment is being inventoried.'
    indicators:
    - imagine
    - suppose
    - even if
  - key: thresholds
    id_prefix: D6
    name: Thresholds and limiting cases
    scope: document
    load_bearing: false
    questions:
    - Where does the text assert a sharp boundary between categories?
    - Does the text acknowledge vagueness and gradual transitions, or does it impose false precision?
    answer_shape: '[D6.F<n>] <one scoped finding> — dim: thresholds — boundary: <threshold> — criterion: <rule>
      — consequence: <modal role> — anchor: "<verbatim supporting clause, <=200 chars>" — doc: <source key> — confidence:
      high|medium|low'
    method_card: 'Do: Record only boundaries that do work; assess their criterion using supplied cases. No arbitrary
      numerical cutoff or forced sorites criticism.'
    indicators:
    - only when
    - enough
    - threshold
  - key: modal_comparison
    id_prefix: X7
    name: Comparison across supplied works
    scope: corpus
    load_bearing: false
    questions:
    - Which aligned proposition has a different modal force or warrant in another supplied work?
    - Which difference disappears once conditions and owners are preserved?
    answer_shape: '[X7.F<n>] <one scoped finding> — dim: modal_comparison — relation: <aligned relation> — alignment:
      <object, sense, owner, scope> — order-basis: <dates, uptake, or unordered> — anchor: "<verbatim supporting
      clause, <=200 chars>" — doc: <source key> — anchor-b: "<verbatim supporting clause B>" — doc-b: <different
      source key> — confidence: high|medium|low'
    method_card: 'Do: Pair propositions and their qualifiers. A changed confidence level need not be changed meaning
      or evidence of intellectual development.'
    indicators:
    - explicit reference
    - paired formulations
    - scope qualification
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - Judge the warrant appropriate to the claim; preserve owners, scope, modality and counter-passages. Inspect
      every declared question, not just retained positives.
    - Every consequential table cell must cite a final finding whose complete supporting spans contain the attributed
      fact and qualification. Split compound claims into several rows when <=200 characters cannot carry them. Use
      a separate [F1] [F2] citation per finding. Include an anchor-b with its doc-b for a second supporting span
      when needed, even in the same document; corpus relations always retain at least two distinct source keys.
      Never use a scope record as a positive finding. Use comma-separated full IDs in from:, never space-concatenated
      IDs. Judge meaning and completeness by reading the sources; code checks only anchors and IDs. Before returning,
      read the actual final tables against their cited final rows and the source contexts, including each source
      counted in coverage; repair or narrow unsupported cells. Keep execution/scope diagnostics separate from source
      interpretations; an unchecked record means the check was incomplete, not that the source is meaningless or
      silent.
    - check_matrix_cell_support
    - 'Apply these source-read repair checks: Give each materially distinct example its own finding and literal
      evidence: an anchor for marriage cannot carry childhood, populism or Nazism. Retain the full conditional antecedent
      and its consequent in separate spans if needed. Preserve bracketed letters such as [i]f exactly; do not silently
      normalize them in a quotation. Distinguish an illustrative possibility, a necessary condition and a blocked
      outcome. Quote the blockage contrast as well as the positive example; preserve whose modal judgment is being
      inventoried.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the supplied texts open who needs to answer: What does the text claim must, may or cannot
      hold, and what supports that force?'
    tables:
    - modal_claims
    - force_checks
    brief: '1. An operator inventory a reader can inspect: exact proposition and owner, must/may/cannot/ought or
      epistemic hedge, type and scope, supporting warrant, justified force and available alternative. Lead with
      the most consequential force distinction. Desks lift modal-claim and force-change tables; useful coverage
      is the product, with no compulsory discovery of equivocation.

      2. Establish the most consequential local findings and their qualifications; organize the reading by the objects
      and claims in these texts.

      3. Render the named Markdown tables with final finding IDs in every positive cell. Explain the supported relation
      and the strongest counter-passage; end with what is settled and the exact remaining question.

      4. With multiple sources, build each work’s inventory before the paired comparison, and state alignment and
      chronology limits. With one source, label the result a local inventory where a corpus relation would require
      another work.

      Every consequential table cell must cite a final finding whose complete supporting spans contain the attributed
      fact and qualification. Split compound claims into several rows when <=200 characters cannot carry them. Use
      a separate [F1] [F2] citation per finding. Include an anchor-b with its doc-b for a second supporting span
      when needed, even in the same document; corpus relations always retain at least two distinct source keys.
      Never use a scope record as a positive finding. Use comma-separated full IDs in from:, never space-concatenated
      IDs. Judge meaning and completeness by reading the sources; code checks only anchors and IDs. Before returning,
      read the actual final tables against their cited final rows and the source contexts, including each source
      counted in coverage; repair or narrow unsupported cells. Keep execution/scope diagnostics separate from source
      interpretations; an unchecked record means the check was incomplete, not that the source is meaningless or
      silent.


      After the check, rewrite or drop cells resting on rejected or unverified findings; rewrite weakened claims
      everywhere they occur. A rejection tag is acceptable only in prose, not as validation of a table cell. Keep
      separate granular support when deduplicating. Apply the method-card repairs to the final reading and its tables.'
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
