# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: metaphorical_mappings
engine_name: Metaphorical mappings
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Which source-domain mappings organize the text's understanding of a selected concept? Text containing
    a selected concept or a topic-level set of metaphors; historical sources if claiming inheritance.
  framing: 'A mapping inventory: expression, source domain, target, transferred relation, implication used by the
    argument, and limit or competing frame. A short reading explains which mapping carries the thesis and which
    is only illustrative; a second table records competing frames. Preserve the root-metaphor, source-domain, mapping
    and rival-frame questions. The legacy request for forgotten origins and universal primary metaphors cannot be
    established from one text; ask about conventional expressions and supplied origin claims. A phrase does not
    prove an audience effect or an unstated historical inheritance.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: expressions
    id_prefix: D1
    name: Expressions and targets
    scope: document
    load_bearing: true
    questions:
    - What metaphors structure understanding of this concept?
    answer_shape: '[D1.F<n>] <one source-scoped finding> — dim: expressions — expression: <value or unknown> — target:
      <value or unknown> — owner: <value or unknown> — anchor: "<literal actor and predicate span, <=200 chars>"
      — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Inventory explicit and conventional figurative expressions, including image schemas when the
      wording supports them. Distinguish the author’s metaphors from those quoted or criticized. Select literal
      spans that together carry the finding’s actor, predicate, object and necessary qualification. If one span
      of at most 200 characters cannot do so, use anchor-b/doc-b for another span, including within one document.
      Do not join separated text or normalize a quote into invented wording. Retain both poles of a contrast. A
      verbatim name or prefix without the claimed predicate is insufficient: re-anchor, narrow or reject it. Keep
      source voice, status, chronology and uncertainty in the final claim. No scope record supplies positive evidence.'
    indicators:
    - like
    - as if
    - image
  - key: mappings
    id_prefix: D2
    name: Transferred relations
    scope: document
    load_bearing: true
    questions:
    - For each metaphor, what elements map from source to target? What does the metaphor imply about the concept?
    answer_shape: '[D2.F<n>] <one source-scoped finding> — dim: mappings — source-domain: <value or unknown> — target:
      <value or unknown> — transferred-relation: <value or unknown> — anchor: "<literal actor and predicate span,
      <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Give the relation, not just two nouns. Quote the wording that carries the transfer; literal
      technical or theological uses may coexist with a metaphor. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - as
    - represents
    - embodies
  - key: entailments
    id_prefix: D3
    name: Argumentative implications
    scope: document
    load_bearing: true
    questions:
    - Which conclusion does the passage draw using this mapping, and which premise makes the transfer relevant?
    answer_shape: '[D3.F<n>] <one source-scoped finding> — dim: entailments — mapping: <value or unknown> — conclusion:
      <value or unknown> — warrant: <value or unknown> — anchor: "<literal actor and predicate span, <=200 chars>"
      — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Separate an implication the source uses from a hypothetical analyst extension. Anchor the
      inference as well as the expression. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - therefore
    - promise
    - because
  - key: coherence
    id_prefix: D4
    name: Related expressions
    scope: document
    load_bearing: false
    questions:
    - Which expressions elaborate the same mapping, and where do their transferred relations differ?
    answer_shape: '[D4.F<n>] <one source-scoped finding> — dim: coherence — expressions: <value or unknown> — common-relation:
      <value or unknown> — difference: <value or unknown> — anchor: "<literal actor and predicate span, <=200 chars>"
      — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Pair occurrences before claiming a systematic metaphor network. State image-schema descriptions
      as interpretations, without compulsory theory labels. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - journey
    - container
    - movement
  - key: rivals
    id_prefix: D5
    name: Competing frames and limits
    scope: document
    load_bearing: false
    questions:
    - Are there rival metaphors for the same aspect of the concept? What is at stake in the text’s contrast?
    answer_shape: '[D5.F<n>] <one source-scoped finding> — dim: rivals — frame-a: <value or unknown> — frame-b:
      <value or unknown> — contrast: <value or unknown> — limit: <value or unknown> — anchor: "<literal actor and
      predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Quote both sides and the contrast predicate. Do not turn a technical distinction into a rejected
      metaphor unless the source makes that move. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - rather than
    - but
    - analogy
  - key: across_sources
    id_prefix: X6
    name: Aligned objects across supplied sources
    scope: corpus
    load_bearing: false
    questions:
    - Which supplied sources address the same object on this method’s question, and what aligned agreement or difference
      do their passages support?
    answer_shape: '[X6.F<n>] <scoped relation> — dim: across_sources — object: <aligned object> — relation: <agreement
      or difference> — anchor: "<literal supporting span>" — doc: <A> — anchor-b: "<literal supporting span>" —
      doc-b: <different B> — confidence: high|medium|low'
    method_card: 'Do: Establish a local inventory in each supplied document first. Match identity, question, time
      and scope before relating findings. Preserve two distinct source keys and the predicate on each side. One
      article quoting several authors is still one supplied document. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - same object in two sources
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the source open who needs to answer: Which source-domain mappings organize the text''s
      understanding of a selected concept?'
    tables:
    - metaphorical_mappings_inventory
    - metaphorical_mappings_relations
    brief: '1. A mapping inventory: expression, source domain, target, transferred relation, implication used by
      the argument, and limit or competing frame. A short reading explains which mapping carries the thesis and
      which is only illustrative; a second table records competing frames.

      2. Lead with the most consequential supported distinction, organized around source objects and questions.
      Useful inventory coverage is the deliverable; do not force a novel thesis.

      3. Render the two named Markdown tables, with explicit limits and citable rows; end with what is established
      and the evidence still needed.

      4. With multiple supplied texts, establish local inventories before an aligned relation; with one text do
      not pretend there is a supplied corpus.

      Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
