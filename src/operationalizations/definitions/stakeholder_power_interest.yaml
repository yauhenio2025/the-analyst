# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: stakeholder_power_interest
engine_name: Stakeholders and means of influence
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: Which actors have a stake in the issue and documented means of influencing its outcome? Supplied
    issue or case material identifying actors, stakes and means of influencing outcomes.
  framing: 'An actor-by-stake-and-means table: actor, stated or inferred interest, legal/resource/technical means,
    action, affected party and source status. A relationship table records documented alliances, dependencies and
    conflicts with the mechanism, without invented power scores. Preserve Who has power? Who benefits/loses? and
    the actor/stake/relationship fields. The legacy instructions require calibrated power scores and conflict intensity
    without measurements; replace them with evidenced means and bounded inference.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: actors
    id_prefix: D1
    name: Actors and stakes
    scope: document
    load_bearing: true
    questions:
    - Who has power? Who benefits/loses?
    answer_shape: '[D1.F<n>] <one source-scoped finding> — dim: actors — actor: <value or unknown> — stake: <value
      or unknown> — declared-or-inferred: <value or unknown> — anchor: "<literal actor and predicate span, <=200
      chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Name actors as the source identifies them and distinguish a declared stake from an analyst
      inference grounded in a stated constraint. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - government
    - company
    - interest
  - key: means
    id_prefix: D2
    name: Means of influence
    scope: document
    load_bearing: true
    questions:
    - What resource, authority or technical position gives each actor influence over this outcome?
    answer_shape: '[D2.F<n>] <one source-scoped finding> — dim: means — actor: <value or unknown> — means: <value
      or unknown> — affected-decision: <value or unknown> — anchor: "<literal actor and predicate span, <=200 chars>"
      — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Quote the actor and the operative influence predicate, not a name next to a generic discussion
      of power. Do not assign numeric rankings. Select literal spans that together carry the finding’s actor, predicate,
      object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - licenses
    - owns
    - controls
  - key: actions
    id_prefix: D3
    name: Influence exercised
    scope: document
    load_bearing: true
    questions:
    - What action did the actor take, through which means, with what reported result?
    answer_shape: '[D3.F<n>] <one source-scoped finding> — dim: actions — actor: <value or unknown> — action: <value
      or unknown> — means: <value or unknown> — result-status: <value or unknown> — anchor: "<literal actor and
      predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Separate capability, threat, proposal and completed action. A project announcement establishes
      no delivered capacity. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b for another
      span, including within one document. Do not join separated text or normalize a quote into invented wording.
      Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - blocked
    - offered
    - decided
  - key: relations
    id_prefix: D4
    name: Relationships and coalitions
    scope: document
    load_bearing: false
    questions:
    - Which documented relationships align or oppose the actors, and on what issue?
    answer_shape: '[D4.F<n>] <one source-scoped finding> — dim: relations — actor-a: <value or unknown> — actor-b:
      <value or unknown> — relationship: <value or unknown> — issue: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Require a relationship-bearing clause for every edge; common interests or co-mentions alone
      establish no alliance. Select literal spans that together carry the finding’s actor, predicate, object and
      necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b for another
      span, including within one document. Do not join separated text or normalize a quote into invented wording.
      Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - partner
    - dependent
    - opposes
  - key: limits
    id_prefix: D5
    name: Constraints and contrary evidence
    scope: document
    load_bearing: false
    questions:
    - What limits the stated means of influence, or qualifies an inference about an actor’s preferences?
    answer_shape: '[D5.F<n>] <one source-scoped finding> — dim: limits — actor: <value or unknown> — constraint:
      <value or unknown> — counter-passage: <value or unknown> — limit: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Keep commercial and political constraints distinct. Do not infer private motives or a general
      ranking from one outcome. Select literal spans that together carry the finding’s actor, predicate, object
      and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b for another
      span, including within one document. Do not join separated text or normalize a quote into invented wording.
      Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    indicators:
    - despite
    - constrained
    - uncertainty
  - key: across_sources
    id_prefix: X6
    name: Aligned objects across supplied sources
    scope: corpus
    load_bearing: false
    questions:
    - Which supplied sources address the same object on this method’s question, and what aligned agreement or difference
      do their passages support?
    answer_shape: '[X6.F<n>] <scoped relation> — dim: across_sources — object: <aligned object> — relation: <agreement
      or difference> — anchor: "<literal supporting span>" — doc: <A> — anchor-b: "<literal supporting span>" —
      doc-b: <different B> — confidence: high|medium|low'
    method_card: 'Do: Establish a local inventory in each supplied document first. Match identity, question, time
      and scope before relating findings. Preserve two distinct source keys and the predicate on each side. One
      article quoting several authors is still one supplied document. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence.'
    indicators:
    - same object in two sources
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the source open who needs to answer: Which actors have a stake in the issue and documented
      means of influencing its outcome?'
    tables:
    - stakeholder_power_interest_inventory
    - stakeholder_power_interest_relations
    brief: '1. An actor-by-stake-and-means table: actor, stated or inferred interest, legal/resource/technical means,
      action, affected party and source status. A relationship table records documented alliances, dependencies
      and conflicts with the mechanism, without invented power scores.

      2. Lead with the most consequential supported distinction, organized around source objects and questions.
      Useful inventory coverage is the deliverable; do not force a novel thesis.

      3. Render the two named Markdown tables, with explicit limits and citable rows; end with what is established
      and the evidence still needed.

      4. With multiple supplied texts, establish local inventories before an aligned relation; with one text do
      not pretend there is a supplied corpus.

      Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
