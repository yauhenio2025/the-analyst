# Third queue: bounded source-defect repair, 2026-09-06
engine_key: rules_and_responses
engine_name: Rules and behavioral responses
stance_operationalizations: []
depth_sequences:
- depth_key: surface
  mode: oneshot
- depth_key: standard
  mode: oneshot_checked
- depth_key: deep
  mode: dvs
- depth_key: dvs
  process: dvs
process:
  key: dvs
  description: How do the supplied rules and their interactions affect documented behavior? Dated rules and, for
    effects, implementation or behavioral reports; identify jurisdiction and archive date.
  framing: 'A dated reported-rule inventory: rule identity, jurisdiction, proposal/adoption/effect status, actor
    and operative requirement, with a response table distinguishing observed implementation from expected effects.
    Show unresolved identity and interactions; archive-bound reporting only. Preserve regulatory landscape/evolution/effects/compliance/interactions
    and the dated pulse fields. Arbitrage opportunities require documented responses, not advice. Do not identify
    a proposed amendment with an effective decree just because their topics match; no current-law claim follows
    from an old paper. Copy evidence from the raw supplied text, not from a cleaned reading. Preserve spaces before
    broken-word hyphens and the following newline exactly; a reconstructed word is not a quotation. Page headers,
    footers and columns interrupt spans: use several short literal anchors (anchor-b/doc-b etc., same document allowed)
    on either side instead of joining across the interruption. Prefer short complete clauses of 40–140 characters,
    never more than 200; the combined packet must still carry the named subject, the complete predicate and its
    date/status. A matching prefix that stops before the predicate is insufficient even if a mechanical check accepts
    it. Recopy that packet before returning any ledger or table. If no adequate packet can be retained, narrow the
    claim explicitly; do not keep the full claim on a truncated prefix.'
  scoped_outcomes: true
  routing:
    cheap: openrouter/openai/gpt-5.6-luna
    mid: openrouter/deepseek/deepseek-v4-pro
    strong: openrouter/openai/gpt-5.6-sol
  dimensions:
  - key: rules
    id_prefix: D1
    name: Rule identities and jurisdictions
    scope: document
    load_bearing: true
    questions:
    - How do regulations evolve and affect behavior?
    answer_shape: '[D1.F<n>] <one source-scoped finding> — dim: rules — rule: <value or unknown> — jurisdiction:
      <value or unknown> — actor: <value or unknown> — stated-function: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Inventory the named rules and source-reported function. Separate a program, law, fund and
      agreement; keep unresolved instruments separate. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence. Copy evidence from the raw supplied text, not from a cleaned reading.
      Preserve spaces before broken-word hyphens and the following newline exactly; a reconstructed word is not
      a quotation. Page headers, footers and columns interrupt spans: use several short literal anchors (anchor-b/doc-b
      etc., same document allowed) on either side instead of joining across the interruption. Prefer short complete
      clauses of 40–140 characters, never more than 200; the combined packet must still carry the named subject,
      the complete predicate and its date/status. A matching prefix that stops before the predicate is insufficient
      even if a mechanical check accepts it. Recopy that packet before returning any ledger or table. If no adequate
      packet can be retained, narrow the claim explicitly; do not keep the full claim on a truncated prefix.'
    indicators:
    - Act
    - decree
    - regulation
  - key: status
    id_prefix: D2
    name: Dates and operative status
    scope: document
    load_bearing: true
    questions:
    - What dates and status does the source give for proposal, adoption, entry into force or implementation?
    answer_shape: '[D2.F<n>] <one source-scoped finding> — dim: status — rule: <value or unknown> — date: <value
      or unknown> — precision: <value or unknown> — status: <value or unknown> — anchor: "<literal actor and predicate
      span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Quote the exact event predicate with the date. A proposal and an effective instrument need
      an explicit identity link before merging; no invented deadline. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence. Copy evidence from the raw supplied text,
      not from a cleaned reading. Preserve spaces before broken-word hyphens and the following newline exactly;
      a reconstructed word is not a quotation. Page headers, footers and columns interrupt spans: use several short
      literal anchors (anchor-b/doc-b etc., same document allowed) on either side instead of joining across the
      interruption. Prefer short complete clauses of 40–140 characters, never more than 200; the combined packet
      must still carry the named subject, the complete predicate and its date/status. A matching prefix that stops
      before the predicate is insufficient even if a mechanical check accepts it. Recopy that packet before returning
      any ledger or table. If no adequate packet can be retained, narrow the claim explicitly; do not keep the full
      claim on a truncated prefix.'
    indicators:
    - proposed
    - enacted
    - effective
  - key: requirements
    id_prefix: D3
    name: Requirements and enforcement
    scope: document
    load_bearing: true
    questions:
    - What requirement, eligibility condition, exception or enforcement mechanism is reported for each actor?
    answer_shape: '[D3.F<n>] <one source-scoped finding> — dim: requirements — rule: <value or unknown> — actor:
      <value or unknown> — requirement: <value or unknown> — exception: <value or unknown> — enforcement: <value
      or unknown> — anchor: "<literal actor and predicate span, <=200 chars>" — doc: <source key> — confidence:
      high|medium|low'
    method_card: 'Do: Read the operative condition and its scope. A report of a rule supports reported requirements,
      not an audit of the full unsupplied instrument. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence. Copy evidence from the raw supplied text, not from a cleaned reading.
      Preserve spaces before broken-word hyphens and the following newline exactly; a reconstructed word is not
      a quotation. Page headers, footers and columns interrupt spans: use several short literal anchors (anchor-b/doc-b
      etc., same document allowed) on either side instead of joining across the interruption. Prefer short complete
      clauses of 40–140 characters, never more than 200; the combined packet must still carry the named subject,
      the complete predicate and its date/status. A matching prefix that stops before the predicate is insufficient
      even if a mechanical check accepts it. Recopy that packet before returning any ledger or table. If no adequate
      packet can be retained, narrow the claim explicitly; do not keep the full claim on a truncated prefix.'
    indicators:
    - eligible
    - exempt
    - must
  - key: responses
    id_prefix: D4
    name: Behavior and effects
    scope: document
    load_bearing: false
    questions:
    - Which behavior is reported after or in response to the rule, and which effects remain expected?
    answer_shape: '[D4.F<n>] <one source-scoped finding> — dim: responses — rule: <value or unknown> — behavior:
      <value or unknown> — attribution: <value or unknown> — observed-or-expected: <value or unknown> — anchor:
      "<literal actor and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Quote the causal predicate when attributing an effect. Preserve projected benefits, uncertain
      delivery and observed compliance as different statuses. Select literal spans that together carry the finding’s
      actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot do so,
      use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence. Copy evidence from the raw supplied text,
      not from a cleaned reading. Preserve spaces before broken-word hyphens and the following newline exactly;
      a reconstructed word is not a quotation. Page headers, footers and columns interrupt spans: use several short
      literal anchors (anchor-b/doc-b etc., same document allowed) on either side instead of joining across the
      interruption. Prefer short complete clauses of 40–140 characters, never more than 200; the combined packet
      must still carry the named subject, the complete predicate and its date/status. A matching prefix that stops
      before the predicate is insufficient even if a mechanical check accepts it. Recopy that packet before returning
      any ledger or table. If no adequate packet can be retained, narrow the claim explicitly; do not keep the full
      claim on a truncated prefix.'
    indicators:
    - responded
    - enables
    - expected
  - key: interactions
    id_prefix: D5
    name: Interactions and limits
    scope: document
    load_bearing: false
    questions:
    - Which supplied rules reinforce, constrain or overlap one another, and what evidence carries that relation?
    answer_shape: '[D5.F<n>] <one source-scoped finding> — dim: interactions — rule-a: <value or unknown> — rule-b:
      <value or unknown> — interaction: <value or unknown> — limit: <value or unknown> — anchor: "<literal actor
      and predicate span, <=200 chars>" — doc: <source key> — confidence: high|medium|low'
    method_card: 'Do: Use two spans when needed; shared jurisdiction or topic establishes no operative interaction.
      Report missing implementation evidence without declaring the rule ineffective. Select literal spans that together
      carry the finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters
      cannot do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text
      or normalize a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without
      the claimed predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology
      and uncertainty in the final claim. No scope record supplies positive evidence. Copy evidence from the raw
      supplied text, not from a cleaned reading. Preserve spaces before broken-word hyphens and the following newline
      exactly; a reconstructed word is not a quotation. Page headers, footers and columns interrupt spans: use several
      short literal anchors (anchor-b/doc-b etc., same document allowed) on either side instead of joining across
      the interruption. Prefer short complete clauses of 40–140 characters, never more than 200; the combined packet
      must still carry the named subject, the complete predicate and its date/status. A matching prefix that stops
      before the predicate is insufficient even if a mechanical check accepts it. Recopy that packet before returning
      any ledger or table. If no adequate packet can be retained, narrow the claim explicitly; do not keep the full
      claim on a truncated prefix.'
    indicators:
    - amendment
    - alongside
    - subject to
  - key: across_sources
    id_prefix: X6
    name: Aligned objects across supplied sources
    scope: corpus
    load_bearing: false
    questions:
    - Which supplied sources address the same object on this method’s question, and what aligned agreement or difference
      do their passages support?
    answer_shape: '[X6.F<n>] <scoped relation> — dim: across_sources — object: <aligned object> — relation: <agreement
      or difference> — anchor: "<literal supporting span>" — doc: <A> — anchor-b: "<literal supporting span>" —
      doc-b: <different B> — confidence: high|medium|low'
    method_card: 'Do: Establish a local inventory in each supplied document first. Match identity, question, time
      and scope before relating findings. Preserve two distinct source keys and the predicate on each side. One
      article quoting several authors is still one supplied document. Select literal spans that together carry the
      finding’s actor, predicate, object and necessary qualification. If one span of at most 200 characters cannot
      do so, use anchor-b/doc-b for another span, including within one document. Do not join separated text or normalize
      a quote into invented wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed
      predicate is insufficient: re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty
      in the final claim. No scope record supplies positive evidence. Copy evidence from the raw supplied text,
      not from a cleaned reading. Preserve spaces before broken-word hyphens and the following newline exactly;
      a reconstructed word is not a quotation. Page headers, footers and columns interrupt spans: use several short
      literal anchors (anchor-b/doc-b etc., same document allowed) on either side instead of joining across the
      interruption. Prefer short complete clauses of 40–140 characters, never more than 200; the combined packet
      must still carry the named subject, the complete predicate and its date/status. A matching prefix that stops
      before the predicate is insufficient even if a mechanical check accepts it. Recopy that packet before returning
      any ledger or table. If no adequate packet can be retained, narrow the claim explicitly; do not keep the full
      claim on a truncated prefix.'
    indicators:
    - same object in two sources
    - different answers to an aligned question
  steps:
  - key: extract
    kind: extract
    parallel_over: dimension_x_document
    model_tier: cheap
    output: ledger
    max_rows: 8
  - key: verify
    kind: verify
    consumes:
    - extract
    model_tier: mid
    output: ledger
    duties:
    - check_anchors_in_context
    - reject_biography
    - merge_duplicates
    - hunt_misses
    - name_must_keep
    - check_matrix_cell_support
    - 'Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.'
    - 'Copy evidence from the raw supplied text, not from a cleaned reading. Preserve spaces before broken-word
      hyphens and the following newline exactly; a reconstructed word is not a quotation. Page headers, footers
      and columns interrupt spans: use several short literal anchors (anchor-b/doc-b etc., same document allowed)
      on either side instead of joining across the interruption. Prefer short complete clauses of 40–140 characters,
      never more than 200; the combined packet must still carry the named subject, the complete predicate and its
      date/status. A matching prefix that stops before the predicate is insufficient even if a mechanical check
      accepts it. Recopy that packet before returning any ledger or table. If no adequate packet can be retained,
      narrow the claim explicitly; do not keep the full claim on a truncated prefix.'
  - key: synthesize
    kind: synthesize
    consumes:
    - verify
    model_tier: strong
    output: prose_ledger
    is_final: true
    reader: 'a reader with the source open who needs to answer: How do the supplied rules and their interactions
      affect documented behavior?'
    tables:
    - rules_and_responses_inventory
    - rules_and_responses_relations
    brief: '1. A dated reported-rule inventory: rule identity, jurisdiction, proposal/adoption/effect status, actor
      and operative requirement, with a response table distinguishing observed implementation from expected effects.
      Show unresolved identity and interactions; archive-bound reporting only.

      2. Lead with the most consequential supported distinction, organized around source objects and questions.
      Useful inventory coverage is the deliverable; do not force a novel thesis.

      3. Render the two named Markdown tables, with explicit limits and citable rows; end with what is established
      and the evidence still needed.

      4. With multiple supplied texts, establish local inventories before an aligned relation; with one text do
      not pretend there is a supplied corpus.

      Every substantive table cell cites final finding IDs with separate [F1] [F2] citations. Before returning,
      reread the actual final tables against the retained ledger and full source contexts. Rewrite or drop any cell
      citing a rejected, weakened or unverified claim; never carry a rejected row as valid evidence in a cell. Preserve
      granular support when merging duplicates. Use comma-separated full IDs in from:. No fabricated completion
      of missing cells, attribution reversals or silent replacement of missing evidence with context. The models
      judge meaning; code checks anchors and IDs only. Select literal spans that together carry the finding’s actor,
      predicate, object and necessary qualification. If one span of at most 200 characters cannot do so, use anchor-b/doc-b
      for another span, including within one document. Do not join separated text or normalize a quote into invented
      wording. Retain both poles of a contrast. A verbatim name or prefix without the claimed predicate is insufficient:
      re-anchor, narrow or reject it. Keep source voice, status, chronology and uncertainty in the final claim.
      No scope record supplies positive evidence.


      Copy evidence from the raw supplied text, not from a cleaned reading. Preserve spaces before broken-word hyphens
      and the following newline exactly; a reconstructed word is not a quotation. Page headers, footers and columns
      interrupt spans: use several short literal anchors (anchor-b/doc-b etc., same document allowed) on either
      side instead of joining across the interruption. Prefer short complete clauses of 40–140 characters, never
      more than 200; the combined packet must still carry the named subject, the complete predicate and its date/status.
      A matching prefix that stops before the predicate is insufficient even if a mechanical check accepts it. Recopy
      that packet before returning any ledger or table. If no adequate packet can be retained, narrow the claim
      explicitly; do not keep the full claim on a truncated prefix.'
