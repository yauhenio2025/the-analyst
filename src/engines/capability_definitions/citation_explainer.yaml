# Citation family: one citation explained in its place (owner, 2026-09-06 23:05: "when we are explaining citations,
# shouldn't this also be an operation folded into the engines?"). The Stacks' cites page asked How / Why here /
# In the argument of one citation in app/cites_context.py; those are the engagement map's per-passage dimensions at
# the unit of one citation, so the method lives here and the Stacks call it.
engine_key: citation_explainer
engine_name: One citation explained in its place
version: 1
category: scholarly
kind: comparison
problematique: One citation of a thinker P in a text by A, read in the section where it sits. Say how P is cited
  here (the move made with the citation and the stance toward what is cited), why the passage needs the citation
  (the local claim it carries and the qualification that limits it), and how the passage and the citation fit the
  text's argument (where the section sits in that argument and what the citation does for it). Quote the sentence
  that carries the citation verbatim; the code checks that it is in the section. Confine the reading to the section,
  the profile and the author's other citations of P supplied; never say what P wrote beyond what the text itself
  says of it. Given several texts, say what shifts between them.
researcher_question: How and why does this author cite this thinker here, and what does the citation do for the text's argument?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: how
  description: How the thinker is cited here
  probing_questions:
  - 'What does the author do with the thinker at this passage: authority, evidence, foil, dialogue, genealogy, illustration,
    courtesy, or self-positioning; and does the author adopt, build on, qualify, dispute or merely mention the cited
    position?'
- key: why_here
  description: Why the passage needs the citation
  probing_questions:
  - Which claim, evidence or distinction does the passage advance with the thinker, and what qualification limits that
    reading?
- key: in_argument
  description: How the passage and the citation fit the text's argument
  probing_questions:
  - Where in the text's argument does this section sit, and what does the citation do for that argument?
- key: across_texts
  description: What shifts between the texts
  probing_questions:
  - Across the supplied texts, does the thinker's role persist or change, and which paired passages establish that?
apps:
- critic
function: genealogy
family: analytical
