engine_key: value_ethical_framework
engine_name: Values and moral priorities
version: 2
category: epistemology
kind: synthesis
problematique: A value-to-judgment inventory and a priorities/tradeoffs table, each preserving whose value it is,
  explicit or reconstructed status, the reason it supports a judgment and any unresolved conflict. Text making evaluative
  or normative judgments; reader preferences only for a separately commissioned decision application.
researcher_question: Which values and moral priorities support the text's judgments?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: values
  description: Values
  probing_questions:
  - What does the text explicitly value or disvalue, and what values are implied by its evaluations?
- key: judgments
  description: Judgments
  probing_questions:
  - Which moral or evaluative judgments depend on those values, and how is the dependence stated?
- key: principles
  description: Principles
  probing_questions:
  - Which principles or ethical reasoning patterns does the text actually use?
- key: priorities
  description: Priorities
  probing_questions:
  - Where does the account rank values or accept a tradeoff, and whose priority is it?
- key: prescriptions
  description: Prescriptions
  probing_questions:
  - What ought to be done or preserved, by whom, and which conflicts or limits remain?
apps:
- critic
function: genealogy
family: analytical
