# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: claim_provenance
engine_name: Claim provenance and corroboration
version: 1
category: evidence
kind: synthesis
problematique: A claim-origin-and-chain inventory linking important numbers, dates and mechanisms to the immediate
  cited or reported source, stated transformation and access status. A dependence table distinguishes repeated reporting,
  asserted corroboration and genuinely inspected independent support; missing originals stay unverified. Supplied
  claim-bearing sources and any available originals or intermediaries; record missing links.
researcher_question: Through which sources and transformations did the collection's claims arrive?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: claims
  description: Claims and immediate origins
  probing_questions:
  - Where do these claims come from, and how reliable are those sources?
- key: chains
  description: Documented chains
  probing_questions:
  - Which original or intermediary does the text identify, and which links remain uninspected?
- key: transformations
  description: Reported transformations
  probing_questions:
  - What summarizing, rounding, translation or change of scope is visible in the supplied chain?
- key: dependence
  description: Dependence and corroboration
  probing_questions:
  - Do independent sources corroborate these claims?
- key: conflicts
  description: Conflicts and next evidence
  probing_questions:
  - Where do supplied chains disagree on the same claim, and what missing source would resolve the issue?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: provenance_audit
