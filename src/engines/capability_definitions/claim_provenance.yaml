# Third queue: bounded source-defect repair, 2026-09-06
engine_key: claim_provenance
engine_name: Claim provenance and corroboration
version: 2
category: evidence
kind: synthesis
problematique: 'A claim-origin-and-chain inventory linking important numbers, dates and mechanisms to the immediate
  cited or reported source, stated transformation and access status. A dependence table distinguishes repeated reporting,
  asserted corroboration and genuinely inspected independent support; missing originals stay unverified. Supplied
  claim-bearing sources and any available originals or intermediaries; record missing links. Assign an intermediary
  citation separately to each claim''s full predicate. Inspect the sentence boundary and the exact position of the
  citation: a citation closing one sentence does not automatically cover the next sentence, especially one beginning
  Meanwhile or introducing a different actor, amount or program. When the source states a claim without an attached
  citation, record author assertion / upstream unspecified; a neighboring reference can only be an explicitly unresolved
  candidate. Keep these distinct in every table cell and summary; never merge a cited award and an uncited loan
  into one attributed financial claim. Do not upgrade bibliography metadata into evidence of what an unseen source
  actually says.'
researcher_question: Through which sources and transformations did the collection's claims arrive?
intellectual_lineage:
  primary: source_criticism
