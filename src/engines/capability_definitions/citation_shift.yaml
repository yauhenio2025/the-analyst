# The oeuvre family (Evgeny, 2026-09-07 07:41: a paper's place in its author's oeuvre). Design: communications/DESIGN_oeuvre_position_2026-09-07.md
engine_key: citation_shift
engine_name: What the focal text cites, against the rest
version: 1
category: scholarly
kind: comparison
problematique: 'The focal text''s citations against the author''s other texts: the works and persons it cites for
  the first time, those it drops, those it carries, the clusters unique to it, and the cited literature the library
  does not hold or the Referee does not know — the rows that license action. Sets are computed against the profiles''
  works-cited and people lists and the packet''s ledger; a first citation needs the absence in every earlier profile.'
researcher_question: What does the focal text cite that the author had not cited before, what does it drop, and
  what of it is unexamined?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: first_cited
  description: Cited here for the first time
  probing_questions:
  - Which works and persons does the focal text cite that no earlier text cited?
- key: dropped
  description: Cited before, absent here
  probing_questions:
  - Which works and persons cited in earlier texts does the focal text not cite?
- key: carried
  description: Carried through
  probing_questions:
  - Which citations does the focal text share with the texts before it, and with which use?
- key: anomaly
  description: A cluster unique to this text
  probing_questions:
  - Does the focal text cite a cluster (a field, a debate, a set of authors) that appears nowhere else in the oeuvre?
- key: unexamined
  description: Cited here, not examined by us
  probing_questions:
  - Which cited works are not held, and which cited persons are not thinkers in the Referee?
apps:
- critic
function: genealogy
family: analytical
