# Citation family: Stacks prompts preserved in the study seed archive.
engine_key: citation_reception_map
engine_name: Reception among a thinker's readers
version: 1
category: scholarly
kind: comparison
problematique: 'A reader × theme × position table with the argument and stance of each secondary text, anchored
  in its own words, plus A among P''s readers: consonance, explicit opposition, or no demonstrated engagement. Preserve
  dates, scope and excerpts. Separate counted uncited readers from inferred affinities; if citation counts are absent,
  no most-cited ranking can be made.'
researcher_question: Where does this author's reading sit among the supplied readers of this thinker?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: reader_argument
  description: Each reader's argument about P
  probing_questions:
  - What does this secondary text argue about the thinker, and what problem is that reading meant to answer?
- key: reader_stance
  description: Each reader's stance
  probing_questions:
  - Does this reader defend, reconstruct, criticize, apply or survey P, and toward which proposition?
- key: theme_position
  description: Positions on the engagement's themes
  probing_questions:
  - For each theme A's engagement turns on, how does this reader interpret P and what passage supports that position?
- key: cites_author
  description: Documented engagement with A
  probing_questions:
  - Does the supplied secondary text name or cite A, and what exactly does it do with that citation?
- key: reception_scope
  description: Dates, excerpts and count authority
  probing_questions:
  - What date, excerpt coverage and supplied citation counts delimit this reader's relevance to A?
apps:
- critic
function: genealogy
family: analytical
