engine_key: concept_case_stress_test
engine_name: Test a concept against a case and qualify extensions
version: 1
category: scholarly
kind: synthesis
operation: distinction
problematique: Reconstruct a concept's criteria, scope and inferential commitments
  from its author's actual work, then test a concrete case. Distinguish contradiction,
  counterexample, scope mismatch, overextended application and a proposed extension.
  Keep revisions in this inquiry separate from historical changes in the thinker's
  position.
researcher_question: Test a concept against a case and qualify extensions
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: fit
  description: Reconstruct criteria and assess the case
  probing_questions:
  - Recover the definition, causal or normative status, scope and qualifications from
    supplied primary sources. Preserve coauthors and divergent formulations; edition
    dates and same-year ordering do not establish conceptual development. Independently
    establish the case, map its features to explicit criteria and explain the fit
    or mismatch. Shared vocabulary or a later commentator's gloss cannot establish
    the thinker's own position.
- key: extension
  description: Specify a warranted extension and its limits
  probing_questions:
  - Decide whether the case challenges the definition, one application, a scope restriction
    or an untested mechanism. For an extension, state what explanatory work it adds,
    which qualifying and nonqualifying cases it distinguishes, and what evidence could
    defeat it. Do not widen a concept until everything fits. Identify the proposed
    extension as this inquiry's claim unless primary text supports thinker attribution.
    Preserve competing repairs, retained commitments and unresolved questions; do
    not invent a prior baseline.
apps:
- critic
function: criticism
family: analytical
