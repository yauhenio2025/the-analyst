# Frozen design: communications/study/REDESIGN_second_queue_2026-09-06.md
engine_key: comparative_reasoning_analyzer
engine_name: Audit comparisons and analogies
version: 2
category: argument
kind: extraction
problematique: 'A compact audit ordered by the conclusions that depend on comparison: what is transferred, which
  correspondence warrants it, where disanalogies matter, and what weaker conclusion survives. The desks lift comparison
  → conclusion → correspondence → defeating difference → scoped verdict, plus criteria and alternatives. The reading’s
  categories are the consequential comparisons in this text. A text making comparisons; source and target material
  when the comparison relies on facts outside it.'
researcher_question: Do the text's analogies, classifications and rankings support the conclusions drawn from them?
intellectual_lineage:
  primary:
    name: lakoff_johnson
    description: George Lakoff (1941–) and Mark Johnson (1949–), cognitive linguists whose 'Metaphors We Live By'
      (1980) revolutionized understanding of conceptual metaphor. They demonstrated that metaphor is not merely
      linguistic ornament but constitutive of abstract thought—we systematically understand abstract domains (time,
      causation, morality, argument) through mappings from concrete embodied experience (space, force, containment).
      Their work provides this engine's foundational insight that comparison is not optional rhetorical strategy
      but the deep structure of reasoning itself, with profound implications for what comparisons reveal and conceal.
  secondary:
  - name: aristotle
    description: Aristotle (384–322 BCE) established comparison as central to both logic and rhetoric. His analysis
      of analogy (analogia) as proportional reasoning—perceiving that 'as A is to B, so C is to D'—grounds this
      engine's treatment of proportional reasoning. His discussion of metaphor in the Poetics as 'giving the thing
      a name that belongs to something else' anticipates modern theories of conceptual transfer.
  - name: gentner
    description: Dedre Gentner (1944–), cognitive scientist whose structure-mapping theory provides formal apparatus
      for analyzing analogical reasoning. Her distinction between surface similarity (shared attributes) and structural
      similarity (shared relational patterns) enables precise assessment of which analogies are merely illustrative
      versus genuinely inferential. Her work on analogical transfer grounds this engine's analysis of when mappings
      hold and when they break down.
  - name: perelman
    description: Chaïm Perelman (1912–1984), Belgian philosopher whose 'New Rhetoric' (with Lucie Olbrechts-Tyteca)
      systematically catalogs argumentative techniques including analogy, comparison, and dissociation. His treatment
      of quasi-logical arguments—those that derive persuasive force from resemblance to formal logic without possessing
      its rigor—grounds this engine's critical assessment of comparative arguments' actual inferential validity.
  - name: wittgenstein
    description: Ludwig Wittgenstein (1889–1951), whose later philosophy emphasized 'family resemblance' as an alternative
      to classical definition. His insight that concepts may be unified by overlapping similarities rather than
      shared essences provides theoretical grounding for analyzing typological reasoning and the limits of classification.
      His method of 'perspicuous representation' through comparison of cases informs this engine's attention to
      how juxtaposition functions argumentatively.
  - name: weber
    description: Max Weber (1864–1920), German sociologist whose methodology of ideal types provides a paradigm
      case of typological reasoning in social science. His explicit acknowledgment that ideal types are heuristic
      constructs rather than empirical descriptions—and his analysis of how they function in comparative-historical
      analysis—grounds this engine's assessment of typological reasoning's analytical value and limitations.
  traditions:
  - name: cognitive_linguistics
    description: The tradition emerging from Lakoff, Johnson, Langacker, and others that treats linguistic structure
      as revealing cognitive structure. Its central claim—that abstract concepts are systematically understood through
      embodied metaphor—provides the theoretical foundation for treating comparison not as rhetorical choice but
      as constitutive of reasoning. This tradition's methods for identifying and mapping conceptual metaphors structure
      this engine's analysis of analogical transfer.
  - name: new_rhetoric
    description: The tradition of argumentation theory revived by Perelman, Olbrechts-Tyteca, and Toulmin that treats
      rhetoric not as manipulation opposed to logic but as the study of how reasons actually function in persuasion.
      Its detailed taxonomy of argumentative techniques—including analogy, comparison, dissociation, and the creation
      of presence—provides this engine's vocabulary for classifying comparative moves and assessing their argumentative
      functions.
  - name: comparative_method
    description: The tradition in social science methodology (Mill, Weber, Ragin, Skocpol) that treats systematic
      comparison as the foundation of causal inference in non-experimental settings. Its attention to case selection,
      scope conditions, and the logic of comparative design informs this engine's assessment of whether compared
      items are genuinely comparable and whether conclusions drawn from comparison are warranted.
  - name: structuralism
    description: The tradition originating with Saussure and developed by Lévi-Strauss, Jakobson, and others that
      treats meaning as constituted by difference and opposition within systems. Its insight that concepts are defined
      relationally—that 'nature' means what it means only in opposition to 'culture'—grounds this engine's analysis
      of dichotomies and binary oppositions as meaning-generating structures rather than mere classifications.
  - name: ordinary_language_philosophy
    description: The tradition associated with Austin, Ryle, and the later Wittgenstein that attends carefully to
      how concepts actually function in use. Its method of examining how words work in context—noting subtle distinctions,
      identifying misleading analogies, resisting premature systematization—informs this engine's attention to how
      comparative reasoning operates in actual argumentative practice rather than idealized logical form.
  - name: critical_metaphor_analysis
    description: The tradition in discourse analysis and critical theory that examines how metaphors shape understanding
      of social and political phenomena. Building on Lakoff and Johnson while adding ideological critique, this
      tradition (Charteris-Black, Musolff, Goatly) analyzes how dominant metaphors naturalize particular understandings
      while obscuring alternatives. This grounds the engine's attention to what comparisons conceal as well as reveal.
  key_concepts:
  - name: analogical_mapping
    definition: The systematic transfer of relational structure from a source domain to a target domain, where relations
      rather than attributes are the primary content transferred. Gentner's structure-mapping theory formalizes
      this as alignment of relational predicates, with higher-order relations (relations between relations) being
      more important than first-order attributes for genuine analogical inference.
  - name: conceptual_metaphor
    definition: A systematic mapping between a concrete source domain and an abstract target domain that structures
      understanding of the target in terms of the source. Unlike literary metaphor, conceptual metaphors are largely
      unconscious, conventional, and constitutive of ordinary reasoning—we cannot think about argument without drawing
      on mappings from war, journey, or building.
  - name: false_dichotomy
    definition: A binary opposition presented as exhaustive when a third (or fourth, or nth) option exists—the 'suppressed
      middle' or 'excluded alternative.' False dichotomies function argumentatively by constraining the space of
      possibilities, forcing choice between two options when the most defensible position may lie elsewhere or combine
      elements of both.
  - name: ideal_type
    definition: Weber's methodological concept of a conceptual construct that accentuates certain features of empirical
      phenomena for purposes of comparison and analysis. Ideal types are explicitly not descriptions of reality
      but heuristic tools—their value lies not in correspondence to cases but in their capacity to illuminate deviation
      and variation through comparison.
  - name: synecdoche
    definition: A figure in which a part stands for the whole or the whole for a part—extended in this engine to
      cover argumentative moves where a single case represents a class, an example stands for a principle, or a
      particular embodies a universal. The critical question is always whether the part is genuinely representative
      or whether selection has been tendentious.
  - name: scalar_implicature
    definition: The inference pattern generated by positioning claims on implicit scales—saying 'some' implicates
      'not all,' saying 'warm' implicates 'not hot.' Scalar arguments exploit these implicature patterns, positioning
      phenomena along continua in ways that generate conclusions about degree, tendency, and relative standing.
  - name: dissociation
    definition: Perelman's concept for the argumentative technique of splitting a unified concept into two distinct
      concepts, typically a 'mere appearance' and a 'true reality' (apparent freedom vs. real freedom, nominal democracy
      vs. genuine democracy). Dissociation creates evaluative hierarchies through conceptual division.
  - name: base_rate_neglect
    definition: The cognitive bias relevant to comparative reasoning wherein comparisons focus on salient features
      of compared cases while ignoring background rates and base frequencies. Juxtaposition of cases invites comparison
      of features while obscuring whether those features are common or rare in the relevant reference class.
analytical_dimensions:
- key: transfer_claim
  description: What the comparison must establish
  probing_questions:
  - What inferential work does the analogy perform—does it generate predictions, explanations, or evaluations?
  - Which conclusion depends on which comparison, and is the move illustrative, classificatory or an evidential
    transfer?
- key: correspondence
  description: The relevant correspondence
  probing_questions:
  - What specific relations are mapped from source to target domain?
  - Which attributes of the source domain are transferred versus left behind?
- key: defeating_difference
  description: Differences that bear on the conclusion
  probing_questions:
  - Where does the analogy break down—which source domain features have no target domain counterpart?
  - Which stated disanalogy changes the transferred conclusion, and does the text answer it or merely acknowledge
    it?
- key: criterion
  description: Criteria, scales and category boundaries
  probing_questions:
  - On what criteria are the compared items being evaluated?
  - How are the endpoints of the scale defined and anchored?
  - How does the typology handle borderline, mixed, or anomalous cases?
- key: alternatives
  description: Alternatives and representative cases
  probing_questions:
  - Are the two options presented as genuinely exhaustive of the possibility space?
  - What part, example, or case is made to stand for a larger whole or class?
  - Which supplied alternative or counter-case tests exhaustiveness or representativeness, and which proposed test
    needs more evidence?
- key: surviving_conclusion
  description: Supported conclusion and repair
  probing_questions:
  - Once the relevant difference or criterion limit is retained, what conclusion still follows and at what force?
  - Which independent route supports the conclusion if this comparison fails?
apps:
- critic
function: genealogy
family: analytical
