# The distinction family (Evgeny, 2026-09-07 13:34: thinking with and against others; design communications/DESIGN_distinction_maker_2026-09-07.md).
engine_key: interlocutor_position
engine_name: What the interlocutors argue on the owner's questions
version: 1
category: scholarly
kind: relational
problematique: 'The owner''s turn argues in distinction to named interlocutors; their texts are supplied. Read the questions
  his turn is arguing, in his words; then, per interlocutor and question, what their text argues — anchored in their text
  with its locus — and the role the turn gives them; and where a text is silent on a question the turn puts to it. The function
  of his distinctiveness is his understanding of the inner workings of their discourse (the owner, 2026-07-24): read the text,
  never the reputation.'
researcher_question: On the questions the owner is arguing, what does each interlocutor argue, in their own text?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: question
  description: A question the owner's turn argues
  probing_questions:
  - Which questions is the turn arguing, in the owner's words?
- key: their_claim
  description: What an interlocutor argues on that question
  probing_questions:
  - Per interlocutor and question, what does their text argue, where, and in what role does the turn cast them?
- key: their_silence
  description: A question the text does not address
  probing_questions:
  - Which of the turn's questions does an interlocutor's held text not address?
