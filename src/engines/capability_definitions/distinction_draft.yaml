# The distinction family (Evgeny, 2026-09-07 13:34: thinking with and against others; design communications/DESIGN_distinction_maker_2026-09-07.md).
engine_key: distinction_draft
engine_name: The owner's position against theirs, and the question back
version: 1
category: scholarly
kind: comparison
operation: distinction
problematique: 'Over the interlocutors'' claims and the owner''s turn and argument: his position on each question as best
  inferred from his words, the relation of his position to each interlocutor''s (parallel · collides · overlaps then diverges
  · absorbs · irrelevant) on a named axis with ours and theirs in a clause each and the bridge, and the concrete question
  back to him — confirm, restate, elaborate, choose. Making a distinction is kept apart from sharpening his formulation (the
  owner, 2026-07-13): the draft proposes, he decides.'
researcher_question: Where does the owner's emerging position stand to each interlocutor's, and what must he be asked to settle
  it?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: your_position
  description: The owner's position on a question, inferred
  probing_questions:
  - What is his position on this question, from his turn and his argument's parts?
- key: relation
  description: The relation of his position to an interlocutor's
  probing_questions:
  - Parallel, collides, overlaps then diverges, absorbs, or irrelevant — on which axis, ours and theirs, and what bridges
    or forbids?
- key: question_back
  description: The question to the owner
  probing_questions:
  - What must he confirm, restate, elaborate or choose for the distinction to stand?
apps:
- critic
function: genealogy
family: analytical
