# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: periodization_critic
engine_name: Testing historical periods
version: 2
category: temporal
kind: synthesis
problematique: A judgment of the source’s strongest historical boundary, with a period/boundary/criterion/evidence/continuity
  table. A second table compares a source-grounded alternative cut and its costs. Lead with what the periodization
  explains, and distinguish approximate overlapping thresholds from a factual contradiction. A text's proposed periods
  with evidence about boundaries, continuity and the relevant analytical object.
researcher_question: Are the time boundaries used by the source justified by its evidence and question?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: periods
  description: Periods and their object
  probing_questions:
  - Are the proposed time periods analytically justified?
- key: boundaries
  description: Boundary criteria
  probing_questions:
  - What change or criterion justifies each beginning or end, and how precise is the source’s date?
- key: coherence
  description: Within-period coherence
  probing_questions:
  - Which evidence supports a period’s coherence, and which differences within it matter to the question?
- key: continuities
  description: Continuities across a cut
  probing_questions:
  - What continues across the proposed boundary, and does the source acknowledge it?
- key: alternatives
  description: Alternative cuts and costs
  probing_questions:
  - What source-supported alternative boundary would answer the stated question differently, and with what tradeoff?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: periodization_critic
