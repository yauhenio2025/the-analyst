# Constructive inquiry, 2026-09-08. The reusable method lives in the operationalization.
engine_key: constructive_inquiry
engine_name: Develop a constructive account
version: 1
category: argument
kind: synthesis
operation: composition
problematique: >-
  A developing position has selected author commitments, a question and held case sources.
  Construct a tentative answer with an explicit derivation or mechanism and bounded scope,
  keeping what the sources claim distinct from the construction proposed from them.
  Return the evidence, a discriminating next question or test, possible local and broader
  revisions, and scrutiny of whether the account protects itself with exceptions.
researcher_question: What can these commitments explain in this case, and what would make the proposed account change?
intellectual_lineage:
  primary: philosophy_of_science
analytical_dimensions:
- key: commitments
  description: The selected commitments and question, preserving author corrections and uncertainty
  probing_questions:
  - Which supplied commitments constrain the answer, and which formulations has the author corrected?
- key: construction
  description: A tentative account with its derivation or mechanism and scope
  probing_questions:
  - How do the commitments and case evidence lead to an answer, and where is an additional assumption needed?
- key: evidence
  description: Source claims, supporting and challenging evidence, and the limits of inspection
  probing_questions:
  - What do the selected held sources actually claim, and how does each passage bear on the proposed account?
- key: next_test
  description: A discriminating new question or test and the evidence that could answer it
  probing_questions:
  - What next observation or argument would distinguish this account from a plausible alternative?
- key: revision
  description: Possible local changes and wider consequences for the selected commitments
  probing_questions:
  - Which finding would require a local repair, and which would change a broader commitment or connected account?
- key: self_scrutiny
  description: Whether exceptions and scope restrictions explain the case or merely protect the theory
  probing_questions:
  - What could count against the construction, and have its exceptions removed that possibility?
composability:
  shares_with:
    construction: Tentative account, assumptions, scope, evidence and revision possibilities
    next_test: Specific selectable tests for constructive_retest
  synergy_engines:
  - constructive_retest
  - hypothesis_evidential_frame
depth_levels:
- key: surface
  description: A concise construction and one discriminating next test over the selected case
  typical_passes: 1
- key: standard
  description: A developed construction with competing readings, revision paths and explicit limits
  typical_passes: 1
- key: deep
  description: A fuller derivation and scrutiny of the supplied case, without inventing additional research
  typical_passes: 1
apps:
- critic
function: logic
output_mode: prose
