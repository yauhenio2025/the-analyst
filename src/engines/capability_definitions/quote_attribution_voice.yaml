engine_key: quote_attribution_voice
engine_name: Whose voices count
version: 2
category: rhetoric
kind: synthesis
problematique: A speaker-and-statement inventory with direct/reported/narrating level, quoted proposition, the authority
  or objection it supplies, and the narrator’s stance. A voice-relation table makes nested attribution and disagreement
  visible without numerical authority rankings. A text or collection with quoted, reported or narrated voices.
researcher_question: Whose voices appear in the text, and what authority or role is each given?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: speakers
  description: Speakers and statements
  probing_questions:
  - Who is speaking, what are they saying, and why does their voice matter?
- key: attribution
  description: Attribution levels
  probing_questions:
  - Which words are directly quoted, paraphrased or reported through another speaker?
- key: functions
  description: Roles in the argument
  probing_questions:
  - What claim does this voice support, qualify, exemplify or oppose in this passage?
- key: relations
  description: Agreement and disagreement
  probing_questions:
  - Where does the narrator align or contrast the voices on the same question?
- key: coverage
  description: Voice distribution and limits
  probing_questions:
  - Which voices recur in the inspected argument, and what does the text establish about their roles or absence?
apps:
- critic
function: genealogy
family: analytical
