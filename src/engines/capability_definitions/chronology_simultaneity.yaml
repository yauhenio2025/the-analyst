# Third queue: bounded source-defect repair, 2026-09-06
engine_key: chronology_simultaneity
engine_name: Parallel timelines
version: 3
category: temporal
kind: synthesis
problematique: Parallel process lanes with actor, event or interval, date precision and status; an overlap table
  identifies which intervals intersect and whether a source establishes synchronization, discrepancy or merely approximate
  contemporaneity. No causal arrows follow from overlap alone. Two or more source-supported processes with dates
  or bounded intervals. Before making an interval or a sequence, identify the same event or instrument by its explicit
  name and an identity predicate in the source. Nearby dates about related laws, proposals or programs do not establish
  successive stages of one instrument. Keep separately named instruments in separate event rows unless the text
  explicitly links their identity. Two dated endpoints alone do not establish continuous activity between them.
  Mark the intervening activity unknown unless the source states duration. Recompute every overlap/intersection
  table from the retained supported intervals; remove all relations derived from an unsupported interval. Distinguish
  an article's publication/reference year from the date of the reported event.
researcher_question: Which documented events and processes overlap in time?
intellectual_lineage:
  primary: source_criticism
