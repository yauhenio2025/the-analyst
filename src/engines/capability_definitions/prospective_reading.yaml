# The oeuvre family (Evgeny, 2026-09-07 07:41: a paper's place in its author's oeuvre). Design: communications/DESIGN_oeuvre_position_2026-09-07.md
engine_key: prospective_reading
engine_name: The focal text as step one of a journey
version: 1
category: scholarly
kind: synthesis
problematique: 'Read the focal text knowing only what the author wrote after it: which of its seeds later texts
  develop and how, which later works take it up, what in it is never taken up, and whether it is the origin of the
  later agenda, a way-station, or a dead end. Nothing that came before is in view.'
researcher_question: 'Read as if nothing preceded: what in the focal text is developed later, what is abandoned,
  and is it an origin?'
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: seed
  description: A seed developed later
  probing_questions:
  - Which concept, claim or move of the focal text do later texts develop?
- key: developed_into
  description: What the later texts make of it
  probing_questions:
  - 'Which later works take the focal text up as a whole, and in what role: source, foil, framework, courtesy?'
- key: abandoned
  description: What is not taken up
  probing_questions:
  - What in the focal text does no later text return to?
- key: verdict
  description: Origin or not
  probing_questions:
  - 'Read only with what came after: is the focal text the origin of the later agenda, a way-station, or a dead
    end?'
apps:
- critic
function: genealogy
family: analytical
