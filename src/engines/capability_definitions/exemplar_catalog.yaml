engine_key: exemplar_catalog
engine_name: Cases and examples used by the sources
version: 2
category: evidence
kind: synthesis
problematique: 'A source-example inventory: case or hypothetical example, owner, attributes, claim illustrated or
  challenged, inferential function, and limits of representativeness. A case-to-claim table preserves distinct examples
  and the difference between illustrating a possibility and establishing a general history. Texts containing cases,
  anecdotes, examples or precedents; identify their argumentative function.'
researcher_question: Which cases and examples does the text use, and what does each illustrate or support?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: examples
  description: Cases and examples
  probing_questions:
  - What concrete cases illustrate the arguments?
- key: attributes
  description: Relevant attributes
  probing_questions:
  - Which attributes of each example matter to the claim it is used to support?
- key: functions
  description: Inferential functions
  probing_questions:
  - Does the example illustrate, support, test or defeat a claim, and what passage establishes that role?
- key: comparisons
  description: Repeated and contrasting uses
  probing_questions:
  - Where does the text reuse or contrast examples, and does their argumentative role change?
- key: limits
  description: Representativeness and qualifications
  probing_questions:
  - What does the source establish about the example’s scope, and which generalization would exceed it?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: exemplar_catalog
