# Third queue: bounded source-defect repair, 2026-09-06
engine_key: entity_extraction
engine_name: Entity and relationship index
version: 3
category: evidence
kind: synthesis
problematique: 'An entity index with source name, alias or unresolved identity, type, role and location, followed
  by an evidenced subject–relation–object table. Index people, organizations, places, products/projects and events;
  keep acronym and case identities unresolved when the source does. One text or a collection with named actors/objects
  and supporting relationship passages. Copy evidence from the raw supplied text, not from a cleaned reading. Preserve
  spaces before broken-word hyphens and the following newline exactly; a reconstructed word is not a quotation.
  Page headers, footers and columns interrupt spans: use several short literal anchors (anchor-b/doc-b etc., same
  document allowed) on either side instead of joining across the interruption. Prefer short complete clauses of
  40–140 characters, never more than 200; the combined packet must still carry the named subject, the complete predicate
  and its date/status. A matching prefix that stops before the predicate is insufficient even if a mechanical check
  accepts it. Recopy that packet before returning any ledger or table. If no adequate packet can be retained, narrow
  the claim explicitly; do not keep the full claim on a truncated prefix.'
researcher_question: Who and what appear in the collection, in which roles and relationships?
intellectual_lineage:
  primary: source_criticism
