# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: metaphorical_mappings
engine_name: Metaphorical mappings
version: 1
category: concepts
kind: synthesis
problematique: 'A mapping inventory: expression, source domain, target, transferred relation, implication used by
  the argument, and limit or competing frame. A short reading explains which mapping carries the thesis and which
  is only illustrative; a second table records competing frames. Text containing a selected concept or a topic-level
  set of metaphors; historical sources if claiming inheritance.'
researcher_question: Which source-domain mappings organize the text's understanding of a selected concept?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: expressions
  description: Expressions and targets
  probing_questions:
  - What metaphors structure understanding of this concept?
- key: mappings
  description: Transferred relations
  probing_questions:
  - For each metaphor, what elements map from source to target? What does the metaphor imply about the concept?
- key: entailments
  description: Argumentative implications
  probing_questions:
  - Which conclusion does the passage draw using this mapping, and which premise makes the transfer relevant?
- key: coherence
  description: Related expressions
  probing_questions:
  - Which expressions elaborate the same mapping, and where do their transferred relations differ?
- key: rivals
  description: Competing frames and limits
  probing_questions:
  - Are there rival metaphors for the same aspect of the concept? What is at stake in the text’s contrast?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: concept_metaphorical_ground
