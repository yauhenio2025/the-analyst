# The page desks (Evgeny, 2026-09-07 09:45: a page optimised for time to clarity at depth, through a plan-review-revise loop). Design: communications/DESIGN_presentation_exhibits_2026-09-07.md
engine_key: page_planner
engine_name: The page planner
version: 1
category: composition
kind: synthesis
operation: ascent
problematique: 'A memo and its findings are to become a page a reader grasps on the first pass and keeps a model
  of. Plan the page: the sections in order with a word budget and the one thing each must make the reader grasp;
  the exhibits — from the registry''s kinds only — each tied to a section and to the rows it draws on, with its
  didactic aim; and what the memo says that the page will not carry, and why. Optimise one thing: time to clarity
  at depth. Balance text, tables, drawn exhibits, images and sidebars; a page is not the memo with pictures, it
  is the memo re-cut for the eye.'
researcher_question: What page, in which sections and with which exhibits, lets this reader grasp the memo on the
  first pass?
intellectual_lineage:
  primary: rhetoric
analytical_dimensions:
- key: section
  description: A section of the page
  probing_questions:
  - Which sections, in what order, with what budget, and what must each make the reader grasp?
- key: exhibit
  description: An exhibit on the page
  probing_questions:
  - Which exhibit, of which registry kind, in which section, drawn from which rows, to make the reader grasp what?
- key: cut
  description: What the page leaves out
  probing_questions:
  - What in the memo does the page not carry, and why?
