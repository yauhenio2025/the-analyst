# Frozen design: communications/study/REDESIGN_second_queue_2026-09-06.md
engine_key: revision_presentation
engine_name: How revisions are presented
version: 1
category: rhetoric
kind: comparison
problematique: An earlier-position / later-position / claimed-relation table. Compare the text’s own account of
  continuity, concession or clarification with changes in force, scope and support. Lead with the consequential
  match or mismatch, then the exact wording and what it changes for the argument. Desks lift revision and evidence-change
  tables; honest continuity is a valid result. Earlier position, later treatment and any response or declared continuity
  claim; dated ordering if available.
researcher_question: How does a later text present its relationship to positions in earlier supplied works?
intellectual_lineage:
  primary:
    name: goffman
    description: 'Erving Goffman (1922-1982), Canadian-American sociologist who pioneered the dramaturgical analysis
      of social life, examining how individuals perform and manage their public identities through strategic self-presentation.
      His framework is primary here because intellectual self-management across time is fundamentally a problem
      of impression management: authors must construct and maintain a coherent intellectual persona even as their
      actual positions shift, employing tactics that preserve face and credibility before their audience of readers
      and peers.'
  secondary:
  - name: bourdieu
    description: 'Pierre Bourdieu (1930-2002), French sociologist and anthropologist who theorized how cultural
      capital operates as a form of power in intellectual and artistic fields. His framework adds to Goffman''s
      dramaturgical lens by explaining what is at stake in intellectual self-management: accumulated credibility
      and authority that must be preserved, deployed strategically, and protected from devaluation when positions
      change—these tactics are moves in a competitive field where symbolic capital is the currency.'
  - name: kuhn
    description: Thomas Kuhn (1922-1996), American physicist and philosopher of science whose analysis of paradigm
      shifts and scientific revolutions explains why intellectual self-management tactics intensify at certain moments.
      His framework helps this engine understand that authors experience internal paradigm shifts—moments when their
      own conceptual frameworks reorganize—and these transitions create the most acute need for retrospective coherence-building
      and tactical relationship management with prior work.
  - name: lakatos
    description: Imre Lakatos (1922-1974), Hungarian philosopher of mathematics and science who developed the methodology
      of research programmes, emphasizing how scientists protect theoretical cores through strategic auxiliary hypotheses
      and problem-shift management. His work informs this engine's understanding of how authors construct protective
      belts around their evolving positions, using tactics to shield core commitments while allowing peripheral
      elements to shift—intellectual self-management as progressive versus degenerative programme management.
  traditions:
  - name: dramaturgical_sociology
    description: 'A sociological approach treating social interaction as theatrical performance, where individuals
      strategically manage impressions through front-stage presentations while backstage realities may differ. This
      tradition provides the engine''s fundamental analytical stance: viewing intellectual production as performance
      before audiences, where maintaining character consistency across time requires dramaturgical skill, and detecting
      the tactics authors use to sustain their performed intellectual identity despite position changes.'
  - name: field_theory
    description: Bourdieu's analytical framework examining how social spaces operate as competitive fields where
      agents struggle for position and capital accumulation according to field-specific rules and stakes. This tradition
      informs the engine's understanding that intellectual self-management occurs within a structured competitive
      space where credibility and authority are scarce resources, making tactics not merely psychological but strategic
      responses to field pressures and the imperative to maintain position.
  - name: philosophy_of_science
    description: The disciplinary tradition examining the logic, methods, and dynamics of scientific knowledge production,
      including how theories develop, compete, and succeed or fail over time. This tradition provides the engine
      with frameworks for understanding intellectual change itself—distinguishing progressive from degenerative
      shifts, recognizing paradigmatic transitions, and identifying the methodological commitments that structure
      how authors justify their evolving positions.
  - name: rhetoric_of_science
    description: An interdisciplinary tradition analyzing scientific discourse as persuasive communication, examining
      how scientists use rhetorical strategies to establish credibility, construct facts, and manage controversy.
      This tradition sensitizes the engine to the textual and linguistic evidence of tactical self-management—how
      vocabulary choices, hedging patterns, citation practices, and framing devices reveal authors' strategic work
      to position current claims relative to prior commitments.
  - name: intellectual_history
    description: 'The historical study of ideas and thinkers across time, examining how concepts develop, migrate
      between contexts, and how individual intellectuals'' thought evolves through engagement with predecessors
      and contemporaries. This tradition provides the engine with methodology for diachronic analysis: comparing
      texts across career spans, tracking conceptual transformations, and recognizing that intellectual development
      is rarely linear but involves complex negotiations between continuity and rupture that require tactical management.'
  key_concepts:
  - name: impression_management
    definition: The strategic control of information and performance that individuals use to shape how others perceive
      them. For this engine, it names the overarching process authors engage in when managing their intellectual
      identity across time—using specific tactics to control how readers perceive the relationship between earlier
      and current work, preserving an impression of coherence, rigor, and purposeful development.
  - name: face_work
    definition: 'The communicative actions taken to maintain one''s positive social value and avoid embarrassment
      or loss of credibility when interactions threaten it. The engine uses this to understand why certain tactics
      appear: authors employ them as face-saving moves when position changes might otherwise create vulnerability
      to charges of inconsistency, error, or intellectual opportunism.'
  - name: cultural_capital
    definition: 'Accumulated prestige, credentials, knowledge, and authority that function as assets in intellectual
      and cultural fields, enabling influence and access to further resources. This concept explains what authors
      protect through their self-management tactics: the credibility capital earned through prior work that could
      be devalued if position changes appear arbitrary or unprincipled rather than as legitimate intellectual evolution.'
  - name: habitus
    definition: The durable, transposable dispositions and unconscious schemas that structure how individuals perceive,
      evaluate, and act in social fields. For this engine, habitus explains why many self-management tactics operate
      below conscious awareness—they reflect deeply internalized disciplinary and professional dispositions about
      what constitutes legitimate intellectual conduct and how position changes must be handled to preserve standing.
  - name: paradigm_shift
    definition: A fundamental reorganization of the conceptual framework, methods, and problem definitions that
      structure inquiry within a domain. The engine uses this to identify moments when authors undergo internal
      paradigm shifts—major theoretical reorientations that create the most acute need for retrospective relationship
      management with prior work that was produced under different conceptual commitments.
  - name: research_programme
    definition: Lakatos's term for a structured sequence of theories sharing a protected hard core of commitments
      surrounded by a flexible protective belt of auxiliary hypotheses that can be modified without abandoning the
      core. This concept helps the engine distinguish tactical maneuvers that defend core intellectual commitments
      (legitimate programme development) from those that obscure genuine core changes (degenerative tactical management).
  - name: performative_coherence
    definition: 'The achieved appearance of intellectual consistency and purposeful development constructed through
      textual and rhetorical performance rather than reflecting actual linear progression. This names what authors
      create through successful self-management tactics: a performed narrative of coherent evolution that papers
      over actual discontinuities, opportunistic pivots, and reactive position changes.'
  - name: strategic_self_presentation
    definition: The deliberate crafting of one's public identity and biographical narrative to achieve specific
      goals or maintain desired impressions. For this engine, it encompasses the full range of tactics authors use
      to present their intellectual trajectory as principled, progressive, and coherent—actively constructing the
      relationship between past and present work rather than simply reporting it.
analytical_dimensions:
- key: position
  description: The position undertaken
  probing_questions:
  - What position does this text undertake, on what object and under what conditions?
  - Which position does it attribute to a prior work or opponent, rather than undertake itself?
- key: claimed_relation
  description: The relation the text claims
  probing_questions:
  - Where does the text call its move a clarification, extension, correction, concession or departure?
  - What exactly is said to remain unchanged and what is expressly relinquished?
- key: scope_and_force
  description: Scope and force of the wording
  probing_questions:
  - How is the position qualified by quantifier, modality, time or domain?
  - Which local formulations change those conditions and what is their argumentative role?
- key: support
  description: Support supplied for the position
  probing_questions:
  - What evidence or derivation is offered for this position?
  - Does the text identify new evidence or a new argument as its reason for changing the formulation?
- key: concession_consequence
  description: What a concession changes
  probing_questions:
  - What does the text concede and which conclusion does that concession narrow or preserve?
  - Does it answer the conceded difficulty, distinguish its scope or leave it open?
apps:
