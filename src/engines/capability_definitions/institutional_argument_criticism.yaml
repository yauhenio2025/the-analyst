engine_key: institutional_argument_criticism
engine_name: Read institutional arguments, authority and framing
version: 1
category: scholarly
kind: synthesis
operation: reading
problematique: Analyze arguments published or hosted by institutions without collapsing
  them into a single institutional belief. Establish authority to speak, reconstruct
  mechanisms and policy commitments, compare internal and external disagreement, and
  examine what the framing makes visible or leaves unresolved. Evaluate arguments
  on their evidence while treating affiliation and funding as relationships requiring
  evidence and an explanatory warrant.
researcher_question: Read institutional arguments, authority and framing
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: authority
  description: Separate institutional authority and individual views
  probing_questions:
  - Identify publishing, commissioning, organizing and hosting relationships from
    supplied originals or retained provenance. Distinguish an adopted institutional
    statement, staff/fellow signed contribution, guest view, host question and event
    participant. Preserve author-views disclaimers and evidence of institutional adoption.
    An institution hosting a debate is not endorsing every speaker. An external CDN
    or video can be institutional material if the publishing relationship is established;
    directory membership or a platform domain alone is insufficient.
- key: framing
  description: Critique assumptions and compare arguments
  probing_questions:
  - Reconstruct each source's problem definition, causal assumptions, affected groups,
    proposed interventions, normative commitments and strongest counterargument. Compare
    changes and internal disagreement before generalizing across an institution. Ask
    which alternatives and interests the text considers or brackets; mark inferences
    and do not fabricate motives. Funding or affiliation does not establish a position
    or invalidate an argument. Distinguish no search result, unread material, missing
    text and an explicit refusal to take a position. Preserve the actual institutional/geographic/language
    coverage and avoid manufacturing consensus from duplicates or selection bias.
apps:
- critic
function: criticism
family: analytical
