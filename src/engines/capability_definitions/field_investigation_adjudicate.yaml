engine_key: field_investigation_adjudicate
engine_name: Adjudicate tensions and revise the account
version: 2
category: scholarly
kind: synthesis
operation: verification
problematique: 'Investigate a bilateral question between a named thinker and a topical
  research field. The field is a collection of independently authored arguments, competing
  mechanisms, methods and cases, never a homogeneous position and never merely secondary
  commentary on the thinker. Identify what each side can teach or challenge in the
  other, and what should change in the researcher''s own account. Distinguish description,
  causal explanation, normative commitments, strategy, historical scope, level of
  analysis, and conditions of applicability. A field author''s finding is not the
  thinker''s claim: only a verified quotation from a supplied primary source can support
  thinker attribution. A proposed extension or application belongs explicitly to this
  inquiry. Prior memos and profiles are provisional context, not primary testimony;
  compare against them when supplied and work independently when they are absent.
  Attribute coauthors, interviewers, opponents and quoted speakers carefully. Edition/reprint
  dates do not establish a new intervention. Search hits guide reading; lexical silence,
  missing texts, excluded sources and inspected windows cannot establish absence across
  an oeuvre or field. Keep counterevidence, qualifications and unresolved cases. Use
  only supplied evidence identities and exact source anchors; never invent a quote,
  page, author position, event or factual claim. Inspected ranges and coverage constrain
  every conclusion. Method interpretation is not mechanically verified by a citation
  match. If validation_errors and a previous_draft are supplied, reconsider the identified
  unsupported claims against the same evidence and return a complete corrected output;
  preserve uncertainty and never manufacture support identities or quotations. When
  field_evidence_representation is reference_index_to_supplied_argument_maps, the
  complete original field support identities are retained while quotations live in
  the durable source readings. Use only claims and meanings present in the supplied
  argument maps; do not infer new details from an evidence identity. Evidence selection
  or compression never licenses an absence claim.'
researcher_question: Adjudicate tensions and revise the account
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: judgment
  description: Judge compatibility, tension and evidence
  probing_questions:
  - Use thinker_position only with primary evidence_ids, field_finding only with field
    evidence_ids, and comparison only with evidence from BOTH populations. An unresolved
    claim may lack support but cannot assert facts. Explain the warrant, alternative
    interpretation, level/scale mismatch and what would reverse the judgment. Do not
    award generic convergence by common vocabulary.
- key: revision
  description: Specify what should change
  probing_questions:
  - Compare the researcher's conclusion with the actual supplied prior baseline, or
    mark standalone when no prior exists. Preserve positions that survive, revise
    overbroad claims, add new distinctions and leave insufficiently supported claims
    open. A revision to the researcher's account is not a historical change in the
    thinker's beliefs.
apps:
- critic
function: genealogy
family: analytical
