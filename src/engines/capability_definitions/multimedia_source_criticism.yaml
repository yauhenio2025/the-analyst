engine_key: multimedia_source_criticism
engine_name: Critically read reporting and recorded testimony
version: 1
category: scholarly
kind: synthesis
operation: reading
problematique: Establish what an original media source warrants and whose claim it
  preserves. Separate independent reporting, journalistic interpretation, company
  statements, participant testimony, host questions and quoted third parties. Published
  captions establish an extracted utterance, not its truth or its speaker. Discovery
  notes, snippets and directory descriptions guide acquisition; they are not original
  testimony.
researcher_question: Critically read reporting and recorded testimony
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: attribution
  description: Establish the speaker and the claim
  probing_questions:
  - Identify the byline, quoted speaker, host and source of each assertion from supplied
    evidence. Separate assertion, question, quotation, hypothesis, denial and retrospective
    account. A title naming two participants does not identify the speaker of an individual
    caption. Keep mixed or unknown speakers unknown; distinguish publishing, event
    and retrieval dates. Attribute a thinker only from their own speech or text, and
    label this inquiry's applications and extensions.
- key: warrant
  description: Evaluate the source and its independence
  probing_questions:
  - Reconstruct the claim in surrounding context, including qualifications and denials.
    Distinguish first-hand observation, named or anonymous reporting, interested testimony
    and independent corroboration. Several outlets repeating one press release or
    several formats of one event are not independent witnesses. Use native timestamp/page
    spans where supplied; never invent missing locators or transcriptions. Preserve
    partial extraction and inaccessible-body limits. A verified quotation is not mechanical
    verification of its meaning or truth.
apps:
- critic
function: criticism
family: analytical
