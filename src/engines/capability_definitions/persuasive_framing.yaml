engine_key: persuasive_framing
engine_name: Persuasive appeals and framing
version: 1
category: rhetoric
kind: synthesis
problematique: A reading of the paper’s strongest persuasive movement and its tension or limit, supported by an
  appeals/framing table and a sequence-of-reinforcement table; describe invited audience positions while leaving
  actual reception and private motives unknown. The text and its stated context; audience reception data only if
  evaluating actual effects.
researcher_question: How do the text's appeals, framing and style work together to invite assent?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: invitation
  description: Invitation
  probing_questions:
  - What problem and reader position does the text establish as a reason to listen?
- key: appeals
  description: Appeals
  probing_questions:
  - How do reason, credibility and emotion support particular claims in these passages?
- key: frames
  description: Frames
  probing_questions:
  - Which framing contrasts or acts of identification make a position salient and an alternative less available?
- key: presence
  description: Presence
  probing_questions:
  - How do repetition, amplification, examples and style give particular considerations weight?
- key: interaction
  description: Interaction
  probing_questions:
  - How do these moves combine across the argument, and which counter-passage complicates that persuasive reading?
