# The distinction family (Evgeny, 2026-09-07 17:40: 'encounter, then impact scan'). The impact scan is OAAS review_pilot's dependency-impact scan as an engine: what a settled distinction changes elsewhere in the argument.
engine_key: impact_scan
engine_name: What a settled distinction changes elsewhere in the argument
version: 1
category: scholarly
kind: relational
problematique: 'A distinction or an encounter has settled (the owner''s answer, the S1 rows): re-read the whole argument —
  every part, his and the desk''s drafts, and his hunches — for what it changes: the parts it moves, supports, complicates
  or contradicts, the parts that rest on those and so change at one remove, and the tests that must run again (a hunch, a
  reference re-read, a frame). Structure alone cannot see this reach; the reading must (the owner, 2026-09-07 15:55: a change
  to the higher or lower parts of the stack has repercussions that must be ironed out sooner).'
researcher_question: Given what the owner has just settled, which parts of his argument change, which change at one remove,
  and what must be re-tested?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: impact
  description: A part the settled distinction touches directly
  probing_questions:
  - Which part moves, gains support, must qualify, or cannot stand as written, and how?
- key: dependency
  description: A part that changes at one remove
  probing_questions:
  - Which part rests on a touched part and so changes too, and how?
- key: retest
  description: What must run again
  probing_questions:
  - Which hunch, reference re-read or frame rested on the old formulation and must be re-run?
apps:
- critic
function: genealogy
family: analytical
