# The oeuvre family (Evgeny, 2026-09-07 12:17: "the only reasonable action there would be to add the thinker to the Referee with us
# suggesting what schools of thought he would fit in or propose a new school of thought around him with potential other candidates").
engine_key: thinker_placement
engine_name: Where an unknown thinker belongs
version: 1
category: scholarly
kind: relational
operation: placement
problematique: 'A person the author cites whom the Referee does not know: read how the oeuvre cites them (as evidence, as
  an opponent, as a source, in which debates, beside whom) and say where they belong — an existing school of thought in the
  Referee, or a new school proposed around them with candidate members drawn from the persons cited alongside, or no
  candidate at all (an editor, a translator, a name in passing). Only persons the packet lists as unknown; only schools the
  packet lists; only candidates the oeuvre actually cites.'
researcher_question: Which school of thought would this cited person fit, or which new school should be proposed around them?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: fit
  description: An existing school the person fits
  probing_questions:
  - Which school in the packet does the person's use in the oeuvre place them in, on what evidence?
- key: new_school
  description: A new school proposed around the person
  probing_questions:
  - If no listed school fits, what school would this person anchor, and which persons cited alongside them belong to it?
- key: verdict
  description: The placement verdict per person
  probing_questions:
  - Fits a listed school, anchors a new one, or not a candidate for the Referee at all?
apps:
- critic
function: genealogy
family: analytical
