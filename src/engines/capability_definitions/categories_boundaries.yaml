engine_key: categories_boundaries
engine_name: Categories and boundaries
version: 1
category: concepts
kind: synthesis
problematique: A category/criterion/instance inventory plus a boundary-and-overlap table showing nonexclusive membership,
  disputed cases and criteria that change by context. Preserve the author’s classifications and competing attributed
  definitions before judging their consequences. A text or supplied collection containing classifications, criteria
  and relevant instances.
researcher_question: How does the text classify the domain, and where are its criteria or memberships contested?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: categories
  description: Categories and purpose
  probing_questions:
  - How are things classified in this domain, and what do the categories reveal?
- key: criteria
  description: Inclusion and exclusion
  probing_questions:
  - Which stated criterion includes an instance in a category, and what would exclude it?
- key: instances
  description: Instances and membership
  probing_questions:
  - Which named instances does the text assign to each category, under which criterion?
- key: relations
  description: Hierarchies and overlaps
  probing_questions:
  - How do the classifications nest, intersect or cross-cut one another?
- key: boundaries
  description: Contested edges
  probing_questions:
  - Where does the text contest a criterion or supply a borderline case, and what does changing that threshold change?
