# The oeuvre family (Evgeny, 2026-09-07 07:41: a paper's place in its author's oeuvre). Design: communications/DESIGN_oeuvre_position_2026-09-07.md
engine_key: oeuvre_position_memo
engine_name: 'The paper''s place in the oeuvre: the memo'
version: 1
category: scholarly
kind: synthesis
operation: ascent
problematique: 'The holistic reading: the upstream phases read the focal text retrospectively (as a culmination),
  prospectively (as an origin), tested it for rupture, mapped the oeuvre''s agendas and the citation shifts. Join
  them into one memo on the paper''s importance in the unfolding of the argument: what it is in the whole (the joined
  verdict), what it inherits and what it seeds, what it breaks with and what persists, the three to five texts to
  read next and why, and the open question. Never assume it is a middle point: the joined verdict may be an end,
  a reorientation, or an outlier.'
researcher_question: What role does this paper play in the author's oeuvre, read whole?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: position
  description: The joined verdict
  probing_questions:
  - 'Read whole, what is the focal text in the oeuvre: the retrospective verdict, the prospective verdict and the
    rupture verdict joined into one position?'
- key: read_next
  description: What to read next
  probing_questions:
  - Which three to five texts (held or not) would a reader open next to see the place claimed, and why?
- key: open
  description: The open question
  probing_questions:
  - What about the paper's place remains undecided, and what would decide it?
