engine_key: causal_mechanism_audit
engine_name: Audit causal attribution and rival mechanisms
version: 1
category: scholarly
kind: synthesis
operation: verification
problematique: Test a proposed causal explanation by separating observed relationships
  from interventions, mechanisms and outcomes. Establish the relevant units, timing
  and counterfactual, assess evidence for each link and preserve plausible rival accounts.
  Political proximity, a revolving door and a benefit to a system are not by themselves
  evidence that political intervention caused an individual firm's returns.
researcher_question: Audit causal attribution and rival mechanisms
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: mechanism
  description: Trace the proposed causal links
  probing_questions:
  - Specify the explanandum and trace supported links between the proposed cause and
    outcome. For political-economic cases distinguish connection/access, an alleged
    intervention, who benefits and effects on costs, market access, asset values or
    returns. Adapt this sequence to the actual case rather than treating it as a universal
    model. Distinguish person, company, sector and system; formal eligibility from
    asymmetrical incidence; public support from net additional benefit. Record which
    links are observed, alleged or missing.
- key: alternatives
  description: Compare rivals and reversal conditions
  probing_questions:
  - Consider commercial, technological, monetary, organizational and historical alternatives
    that the sources support. A chronological sequence alone does not establish causation;
    a general policy can have unequal effects without being designed for one beneficiary.
    Test competing explanations against the same outcome and time window. State what
    evidence would distinguish them or reverse the judgment. Treat the question's
    causal premise as a hypothesis, not as an established fact.
apps:
- critic
function: criticism
family: analytical
