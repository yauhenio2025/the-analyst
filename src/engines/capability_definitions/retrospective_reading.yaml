# The oeuvre family (Evgeny, 2026-09-07 07:41: a paper's place in its author's oeuvre). Design: communications/DESIGN_oeuvre_position_2026-09-07.md
engine_key: retrospective_reading
engine_name: The focal text as the culmination of what came before
version: 1
category: scholarly
kind: synthesis
problematique: 'Read the focal text knowing only what the author wrote before it: what it inherits from earlier
  texts (concepts, claims, problems), which earlier tension or problem it resolves, whom it argues with (inherited
  or new interlocutors), and whether it is the culmination of the earlier agenda, a continuation, or a departure
  from it. Nothing that came after is in view.'
researcher_question: 'Read as if nothing followed: what does the focal text inherit, what does it resolve, and is
  it a culmination of what came before?'
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: inheritance
  description: What it inherits
  probing_questions:
  - Which concepts, claims or problems of the earlier texts does the focal text take up?
- key: resolution
  description: What it resolves
  probing_questions:
  - Which tension, gap or objection left open by the earlier texts does the focal text answer?
- key: interlocutor
  description: Whom it argues with
  probing_questions:
  - Whom does the focal text argue with, and are those interlocutors inherited from the earlier texts or new?
- key: verdict
  description: Culmination or not
  probing_questions:
  - 'Read only with what came before: is the focal text the culmination of the earlier agenda, a continuation of
    it, or a departure from it?'
apps:
- critic
function: genealogy
family: analytical
