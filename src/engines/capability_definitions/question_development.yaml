engine_key: question_development
engine_name: Develop and reframe a research question
version: 1
category: argument
kind: synthesis
operation: composition
problematique: >-
  A research problem can be more productive when its explanandum, unit of analysis,
  comparison or assumptions change. Develop one useful question from the author's
  problem, explain the consequential change and what survives, and identify what
  would make an answer possible. Questions are intellectual objects, not merely
  prompts for verifying a settled claim or collecting more literature.
researcher_question: What is the more useful question here, why does it matter, and what would make it answerable?
intellectual_lineage:
  primary: philosophy_of_science
analytical_dimensions:
- key: motivation
  description: The intellectual problem and why answering it would matter
  probing_questions:
  - What understanding would an answer enable, and whose purpose is actually supplied?
- key: reframe
  description: A proposed question and its change of assumptions, scope or explanatory object
  probing_questions:
  - What does the revised formulation make visible that the current question obscures?
- key: continuity
  description: What prior work remains useful and what the changed question would retire
  probing_questions:
  - Which conclusions survive a changed question and which require reconsideration?
- key: answerability
  description: Essential prerequisites, useful alternatives and an appropriate next activity
  probing_questions:
  - What next step could advance this question without pretending an answer or accepted belief already exists?
composability:
  shares_with:
    reframe: Proposed question, motivation, assumptions, preserved work and retired framing
    answerability: Prerequisites and a proposed next activity with actual supplied commitments when needed
  synergy_engines:
  - question_preparation
  - constructive_inquiry
  - author_investigation_plan
  - interlocutor_position
depth_levels:
- key: surface
  description: One consequential question with its motivation and next step
  typical_passes: 1
- key: standard
  description: A developed reframing with alternatives, prerequisites and source-grounded limits
  typical_passes: 1
- key: deep
  description: Work through competing framings and the implications for prior conclusions
  typical_passes: 1
apps:
- critic
function: logic
output_mode: prose
