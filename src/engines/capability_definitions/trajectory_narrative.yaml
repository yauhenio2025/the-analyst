problematique: 'The register records what we did — the actions run and what came of them, the runs made, the steps added,
  the owner''s answers on the Brief. Read it and say what we are doing, in the owner''s terms: the projects in flight with
  their thinkers and intents and what moved this session, what each intent has had done for it and where it stalled, and what
  the trajectory makes possible next as macro directions. The narrative is a record other organs'' planners read to contextualise
  what they search for (the owner: ''this meta-narration engine will come in handy for other services — the Reporter etc.'');
  never a log.'
