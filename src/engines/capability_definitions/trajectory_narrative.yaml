# The governance family (Evgeny, 2026-09-07 18:30: 'a self-constructing narrative that always narrates what we do so that macro actions become possible'). Design: communications/DESIGN_readings_and_macro_actions_2026-09-07.md §2.
engine_key: trajectory_narrative
