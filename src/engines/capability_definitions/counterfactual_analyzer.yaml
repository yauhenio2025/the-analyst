# Frozen design: communications/study/REDESIGN_second_queue_2026-09-06.md
engine_key: counterfactual_analyzer
engine_name: Audit a counterfactual
version: 2
category: methodology
kind: synthesis
problematique: 'A one-page audit of the text’s consequential suppositions: antecedent and owner, fixed background
  and extra changes, bridge and modal force, relevant alternative, and what independently survives. Desks lift scenarios,
  dependencies and robustness tables. A genuine inferential counterexample qualifies without literal if–then syntax.
  A text advancing a what-if or counterexample, with historical background only where its kind of claim requires
  it.'
researcher_question: What does a text's counterfactual establish once its changed and retained assumptions are made
  explicit?
intellectual_lineage:
  primary:
    name: lewis
    description: 'David Lewis (1941–2001), American philosopher whose possible worlds semantics for counterfactuals
      revolutionized modal logic and the philosophy of causation. His analysis holds that a counterfactual ''if
      A had been the case, C would have been the case'' is true just in case C holds in all the closest possible
      worlds where A holds, with closeness determined by a similarity ordering that prioritizes avoiding large miracles,
      maximizing perfect match with actuality, and avoiding small miracles. Lewis''s framework provides this engine''s
      foundational architecture: the concepts of minimal rewrite, similarity ordering, miracle requirements, and
      the distinction between backtracking and non-backtracking readings that structure every counterfactual analysis.'
  secondary:
  - name: stalnaker
    description: Robert Stalnaker (1940–), American philosopher who developed a parallel possible worlds semantics
      for conditionals that emphasizes the selection function picking out the single closest antecedent-world. His
      work on pragmatic presupposition and context-dependence in counterfactual evaluation complements Lewis's approach,
      highlighting how the same counterfactual sentence can express different propositions depending on what is
      held fixed in the conversational context.
  - name: goodman
    description: 'Nelson Goodman (1906–1998), American philosopher whose work on counterfactuals in ''Fact, Fiction,
      and Forecast'' identified the cotenability problem: we cannot simply hold fixed everything compatible with
      the antecedent, because some truths are only true because the antecedent is false. His analysis revealed the
      deep difficulties in specifying what remains constant under counterfactual supposition, a problem this engine
      addresses through explicit cotenability constraint analysis.'
  - name: weber
    description: Max Weber (1864–1920), German sociologist whose methodology of objective possibility and adequate
      causation provided foundational tools for historical counterfactual reasoning. Weber argued that causal attribution
      requires showing both that the cause was nomologically capable of producing the effect and that, according
      to rules of experience, it would have been likely to do so—criteria this engine applies through its plausibility
      assessment framework.
  - name: lebow
    description: Richard Ned Lebow (1942–), American political scientist whose work on historical counterfactuals
      established rigorous criteria for responsible 'what if' reasoning. His requirements that antecedents be clearly
      specified, consistent with historical context, connected to defensible causal theories, and capable of supporting
      plausible consequence projection form core components of this engine's plausibility evaluation methodology.
  - name: tetlock
    description: Philip Tetlock (1954–), American psychologist whose research on expert political judgment and counterfactual
      thought experiments identified the conditions under which counterfactual reasoning can be disciplined rather
      than speculative. His emphasis on well-specified antecedents, avoidance of runaway butterfly effects, and
      the possibility of expert convergence provides this engine's criteria for thought experiment quality.
  traditions:
  - name: possible_worlds_semantics
    description: 'The tradition in modal logic and philosophy of language that analyzes modal and counterfactual
      claims in terms of quantification over possible worlds—complete ways things might have been. This framework
      provides the ontological basis for counterfactual evaluation: asking what would have happened is asking what
      happens in the closest worlds where the antecedent obtains.'
  - name: causal_inference_tradition
    description: The interdisciplinary tradition spanning philosophy, statistics, and social science that grounds
      causal claims in counterfactual analysis. From Hume's regularity theory through Lewis's counterfactual theory
      of causation to Pearl's structural causal models, this tradition establishes that 'A caused B' fundamentally
      means 'if A had not occurred, B would not have occurred.'
  - name: historical_methodology
    description: The tradition of methodological reflection on historical explanation, from Weber through Carr,
      Fischer, and contemporary philosophers of history. This tradition grapples with how historians can make justified
      causal claims about unique events, developing criteria for responsible counterfactual reasoning that avoids
      both excessive determinism and unbounded speculation.
  - name: thought_experiment_methodology
    description: The philosophical tradition examining how hypothetical scenarios can generate genuine knowledge,
      from Galileo's falling bodies through Einstein's elevators to contemporary philosophical puzzles. This tradition
      asks when and how reasoning about non-actual situations can reveal truths about actual causal and modal structures.
  - name: modal_epistemology
    description: The philosophical inquiry into how we can have knowledge of possibilities and necessities—things
      that might have been otherwise or could not have been otherwise. This tradition grounds the epistemic status
      of counterfactual judgments, asking what warrants claims about unactualized scenarios.
  - name: pragmatic_theories_of_explanation
    description: The tradition holding that explanation is interest-relative and context-dependent, from van Fraassen's
      pragmatic theory through contemporary contrastive approaches. This framework reveals how the same event can
      be explained by different causes depending on what contrast class is relevant, directly shaping which counterfactuals
      are appropriate to evaluate.
  key_concepts:
  - name: minimal_rewrite_principle
    definition: The requirement that the closest possible world where a counterfactual antecedent holds should differ
      from the actual world only in what is necessary to make the antecedent true plus its lawful consequences.
      Violations of this principle—changing more than necessary—allow authors to smuggle in convenient additional
      changes that bias their conclusions.
  - name: similarity_ordering
    definition: 'Lewis''s hierarchical criteria for ranking possible worlds by their closeness to actuality: first
      avoid large miracles (widespread violations of natural law), then maximize the spatiotemporal region of perfect
      match with the actual world, then avoid small miracles, then approximate similarity of particular facts. This
      ordering determines which possible world is relevant for evaluating any given counterfactual.'
  - name: backtracking_counterfactual
    definition: A counterfactual reading that traces backward from the antecedent to revise earlier history in order
      to make the antecedent true in a natural, non-miraculous way. Contrasted with non-backtracking readings that
      hold the past fixed and introduce a localized miracle at the antecedent time. The distinction is crucial because
      the two readings yield different truth-values for the same counterfactual sentence.
  - name: cotenability
    definition: Goodman's term for the property a proposition must have to be legitimately held fixed alongside
      a counterfactual antecedent. The cotenability problem arises because we cannot hold fixed everything true—some
      truths depend on the antecedent being false. Determining the scope of legitimate ceteris paribus is a core
      challenge in counterfactual evaluation.
  - name: miracle
    definition: 'Lewis''s term for a violation of natural law required to make a counterfactual antecedent true.
      Miracles are ranked by size: a small miracle might be a single neuron firing differently; a large miracle
      might require suspending laws of physics across wide regions. The smallest miracle sufficient to produce the
      antecedent yields the closest possible world.'
  - name: overdetermination
    definition: The situation where an effect has multiple independently sufficient causes, breaking simple counterfactual
      dependence. If both assassin A and assassin B fired, and either shot alone would have been fatal, then the
      victim's death does not counterfactually depend on A's shot alone—complicating causal attribution.
  - name: preemption
    definition: The situation where an actual cause preempts a backup cause that would have produced the same effect.
      The backup's presence means the effect does not counterfactually depend on the actual cause (it would have
      happened anyway), yet intuition attributes causation to the actual cause. Preemption cases reveal limits of
      simple counterfactual theories of causation.
  - name: butterfly_effect
    definition: The phenomenon where small changes in initial conditions produce large, unpredictable consequences
      over time due to sensitive dependence in complex systems. In counterfactual reasoning, butterfly effects can
      either be exploited (tracing only favorable consequence chains) or used to dismiss counterfactuals as inherently
      speculative. Disciplined counterfactual methodology requires acknowledging butterfly effects symmetrically.
analytical_dimensions:
- key: supposition_and_function
  description: The supposition, its owner and its inferential task
  probing_questions:
  - What antecedent is varied, denied, left open or provisionally granted, and what consequent is claimed? Quote
    the inferential passage, including a counterexample without literal if–then wording, and preserve its modal
    force.
  - Is this an explicit counterfactual, an open conditional, an even-if concession, a reductio, or an analyst's
    reconstruction? Explain the classification from the passage rather than from the word if alone.
  - Who undertakes the supposition here, and what is its task? Distinguish the paper's commitment from an interpreted
    thinker's position, an opponent's premise and an assumption adopted only for argument.
  - Is the conclusion asserted only under that supposition? Before alleging strength drift elsewhere, check that
    the comparison concerns the same proposition under the same antecedent.
- key: fixed_and_changed_conditions
  description: What is varied, what remains fixed and what is added
  probing_questions:
  - What does the text explicitly hold fixed while varying or granting the antecedent? Distinguish stated background
    conditions from assumptions reconstructed by the analyst.
  - Which further changes follow from the supposition, and which are additional premises needed to obtain the proposed
    result? Identify the textual warrant or state that it is not supplied.
  - Does the scenario require incompatible fixed conditions, or is the apparent incompatibility the deliberate object
    of a reductio or conceptual limit test?
  - For a historical or causal scenario, what earlier conditions would have to differ and does the text disclose
    them? For a conceptual or normative scenario, what commitments define the permissible contrast?
- key: inferential_path
  description: The warrant from supposition to result
  probing_questions:
  - What connects antecedent to consequent here? Identify a conceptual requirement, definition, causal mechanism,
    historical regularity, normative premise or cited argument, and the passage doing that work.
  - Which steps are stated and which are reconstructed? Does restating the consequent answer the dependency question,
    or is a connecting premise still required?
  - Does the support establish necessity, possibility, tendency or a result conditional on further premises? Preserve
    necessary vulnerability separately from inevitable realization and risk separately from actual occurrence.
  - What scope does the warrant support, and what competing or independent route does the text itself supply? Do
    not reverse a sufficient argument into a necessary condition of accepting its conclusion.
- key: alternatives_and_scope
  description: Relevant alternatives and the scope of comparison
  probing_questions:
  - What alternative case or interpretation does the text consider under a comparable supposition, and what makes
    it relevant to this consequent?
  - Do different results arise because a background condition, object, modal force or argumentative task changed?
    Quote both cases and identify the difference before calling them inconsistent.
  - For a historical comparison, what warrants the similarity ordering and treatment of earlier causes? For a conceptual
    comparison, which disputed commitments must remain in place for the test to bear on the argument?
  - If an alternative is the analyst's proposed test, what textual premise makes it discriminating, and what would
    need further evidence? Do not present an invented scenario as one the paper claims.
- key: survival_and_robustness
  description: What loses support and what survives
  probing_questions:
  - 'If a disputed premise or additional change is withdrawn, what exactly loses support: this wording, this derivation,
    a stronger modal conclusion, or every route to the result?'
  - What independent conceptual, empirical or normative grounds does the text offer for the same conclusion? Test
    them rather than treating the most prominent route as indispensable.
  - Does a criticism remain intact if the paper's constructive alternative fails? Conversely, does failure of one
    criticism answer other independently developed objections?
  - What is the weakest surviving conclusion and its conditions? State when a subtraction is the text's explicit
    argument, an analyst reconstruction, or a test the available material cannot settle.
apps:
- critic
function: genealogy
family: analytical
