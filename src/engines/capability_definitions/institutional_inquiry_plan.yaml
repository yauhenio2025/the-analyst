engine_key: institutional_inquiry_plan
engine_name: Plan an institutional debate inquiry
version: 1
category: scholarly
kind: synthesis
operation: placement
problematique: Investigate the supplied question through institutional originals without requiring
  a target thinker. Reconstruct arguments, mechanisms, constraints, interventions and disagreement
  from the actual documents and voices. Keep adoption, signed views, guest contributions and participant
  statements distinct. Prior maps are retained analysis; only original passages support new source
  claims. Describe the considered, searched, acquired and actually read population separately, including
  geographic, language and publication-date coverage. Search misses and unavailable originals cannot
  establish institutional silence. Group by institution without manufacturing consensus from internal
  disagreement, syndicated copies or several formats of one event. Preserve evidence identities,
  exact quotations and native page/time loci. Never invent missing originals, authority, dates, transcripts
  or positions. Treat question premises and causal inferences as hypotheses. If validation_errors
  and previous_draft are supplied, return a complete corrected answer supported by the same evidence;
  preserve uncertainty instead of manufacturing support.
researcher_question: Plan an institutional debate inquiry
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: question
  description: Form institutional research questions
  probing_questions:
  - Identify answerable questions about rival mechanisms, constraints, policy choices, assumptions,
    affected interests and discriminating evidence. Do not presume a position, balance or exhaustive
    representation. Use the supplied institutional population independently of any optional later
    comparison target.
- key: query
  description: Expand source reading vocabulary
  probing_questions:
  - Give 12–24 distinct literal search phrases, including mechanisms, actor identities, institutions,
    qualifications and contrary outcomes. These route windows within EVERY selected institutional
    text, not a selection of agreeable texts. No Boolean operators.
- key: baseline
  description: Locate a provisional starting position
  probing_questions:
  - For follow_up, identify the supplied prior memo's conclusions and uncertainties with its real
    job/source identity and concrete passages; mark truncated or unavailable baseline context. For
    standalone, formulate a provisional research question without inventing a prior investigation.
apps:
- critic
function: genealogy
family: analytical
