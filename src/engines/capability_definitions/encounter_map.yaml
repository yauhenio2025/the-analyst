# The distinction family (Evgeny, 2026-09-07 17:40: 'encounter, then impact scan'). The encounter is the deep operation around ONE thinker (2026-07-15), read across their oeuvre through the owner's whole model.
engine_key: encounter_map
engine_name: One thinker's system, mapped for the owner
version: 1
category: scholarly
kind: relational
problematique: 'One thinker the owner has chosen to encounter, several of their texts supplied and windowed: their positions
  on the owner''s questions across the oeuvre (early and late, with the turns between), the load-bearing concepts the owner
  would have to adopt, translate or refuse, the opponents the thinker argues against (shared opponents most of all), and the
  silences. Every row anchored in the thinker''s text with its locus. The owner''s questions come from his argument and his
  stated hypothesis about the thinker, never from the thinker''s own agenda.'
researcher_question: Across their oeuvre, where does this thinker stand on the questions the owner's model asks, with what
  concepts, against whom, and where did they move?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: position
  description: The thinker's position on an owner's question, per text or period
  probing_questions:
  - What does the thinker hold on this question, in which text, and does a later text hold it still?
- key: concept
  description: A load-bearing concept of the thinker's
  probing_questions:
  - Which of the thinker's concepts carries the position, and what would the owner have to do with it?
- key: opponent
  description: Whom the thinker argues against
  probing_questions:
  - Against whom is the position built, and is that an opponent of the owner's too?
- key: turn
  description: Where the thinker's position moved
  probing_questions:
  - Between which texts did the thinker's position on an owner's question change, and to what?
- key: silence
  description: An owner's question the thinker never addresses
  probing_questions:
  - Which of the owner's questions do the held texts not address?
apps:
- critic
function: genealogy
family: analytical
