engine_key: stakeholder_power_interest
engine_name: Stakeholders and means of influence
version: 2
category: power
kind: synthesis
problematique: 'An actor-by-stake-and-means table: actor, stated or inferred interest, legal/resource/technical
  means, action, affected party and source status. A relationship table records documented alliances, dependencies
  and conflicts with the mechanism, without invented power scores. Supplied issue or case material identifying actors,
  stakes and means of influencing outcomes.'
researcher_question: Which actors have a stake in the issue and documented means of influencing its outcome?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: actors
  description: Actors and stakes
  probing_questions:
  - Who has power? Who benefits/loses?
- key: means
  description: Means of influence
  probing_questions:
  - What resource, authority or technical position gives each actor influence over this outcome?
- key: actions
  description: Influence exercised
  probing_questions:
  - What action did the actor take, through which means, with what reported result?
- key: relations
  description: Relationships and coalitions
  probing_questions:
  - Which documented relationships align or oppose the actors, and on what issue?
- key: limits
  description: Constraints and contrary evidence
  probing_questions:
  - What limits the stated means of influence, or qualifies an inference about an actor’s preferences?
apps:
- critic
function: genealogy
family: analytical
