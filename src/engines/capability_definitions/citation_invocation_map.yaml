# Fourth queue: communications/study/REDESIGN_fourth_queue_2026-09-06.md
engine_key: citation_invocation_map
engine_name: Citation and invocation map
version: 1
category: scholarly
kind: synthesis
problematique: A selective citation-use register (citing passage, cited work, attributed proposition, use, access)
  and an engagement table distinguishing support, criticism, background and uncertain allusion; explain the consequential
  citation pattern without certifying fidelity to unsupplied works. One text with references or a supplied set of
  citing texts; access to cited texts is optional and separately recorded.
researcher_question: How do the supplied works cite one another and use those citations?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: references
  description: References
  probing_questions:
  - Which named works or thinkers are invoked in the argument, and which are only listed in the references?
- key: propositions
  description: Propositions
  probing_questions:
  - What proposition is assigned to each selected source, and who is making that attribution?
- key: uses
  description: Uses
  probing_questions:
  - 'How is each citation used here: as support, criticism, method, example or background?'
- key: clusters
  description: Clusters
  probing_questions:
  - Which references are grouped or opposed by the supplied text, and on what shared question?
- key: recognition
  description: Recognition
  probing_questions:
  - Where does the passage confer authority, acknowledge a debt or leave a possible allusion uncertain?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: citation_network
