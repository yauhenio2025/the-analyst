engine_key: constructive_inquiry_review
engine_name: Review an account against its research problem
version: 1
category: argument
kind: comparison
operation: verification
problematique: An account can be source-anchored yet silently narrow the author's problem or favor a desired
  outcome. Review its explanatory coverage and next-step reasoning before publication.
researcher_question: Does the account earn its explanatory scope and proposed next step?
intellectual_lineage:
  primary: philosophy_of_science
analytical_dimensions:
- key: fidelity
  description: Problem fidelity, substantive rivals and justified next steps
  probing_questions:
  - Where does the account answer, narrow or leave open the author's problem?
composability:
  shares_with:
    fidelity: A bounded review of a proposed inquiry account
  synergy_engines:
  - constructive_inquiry
  - constructive_retest
depth_levels:
- key: surface
  description: A concise construction and one discriminating next test over the selected case
  typical_passes: 1
- key: standard
  description: A developed construction with competing readings, revision paths and explicit limits
  typical_passes: 1
- key: deep
  description: A fuller derivation and scrutiny of the supplied case, without inventing additional research
  typical_passes: 1
apps:
- critic
function: logic
output_mode: prose
