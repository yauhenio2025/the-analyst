# Third queue: communications/study/REDESIGN_third_queue_2026-09-06.md
engine_key: resource_distribution
engine_name: Distribution of resources, benefits and risks
version: 1
category: power
kind: synthesis
problematique: A resource-flow and burden inventory with supplying actor, receiving actor, resource, mechanism,
  amount/unit/date/status when given, and beneficiary or risk bearer. Explain documented asymmetries without converting
  a fund total into a project allocation or a benefit into a motive. Documented arrangement with named actors and
  source-supported transfers or burdens.
researcher_question: Who supplies resources, receives benefits and bears risks in the documented arrangement?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: flows
  description: Resource flows
  probing_questions:
  - Who pays? Who profits? Who bears the risks?
- key: quantities
  description: Amounts and status
  probing_questions:
  - What amount, unit, period and commitment or realization status belongs to each reported flow?
- key: benefits
  description: Benefits and value chains
  probing_questions:
  - Who receives the stated benefit, at which stage of the arrangement, through what mechanism?
- key: burdens
  description: Costs and risks
  probing_questions:
  - Which actor bears a stated cost or risk, and does the text describe a transfer of that burden?
- key: asymmetries
  description: Supported asymmetries
  probing_questions:
  - Which evidenced flows or burdens support a distributional asymmetry, and what limits the comparison?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: resource_flow_asymmetry
