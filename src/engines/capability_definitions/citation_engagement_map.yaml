# Citation family: Stacks prompts preserved in the study seed archive.
engine_key: citation_engagement_map
engine_name: Engagement with a thinker across texts
version: 1
category: scholarly
kind: comparison
operation: reading
problematique: A bibliographic reading of A on P, led by P's place in these arguments. Give a passage × cited object
  × move × stance × reading × locus table, then a text/year trajectory table. Distinguish evidence, foil and dialogue;
  pair the actual passages before claiming development. Give a scholar three to five passages to open first and
  say why.
researcher_question: How does this author use and read this thinker across the supplied citing texts?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: place_in_text
  description: The thinker's place in this argument
  probing_questions:
  - What does this text argue, and what place does the named thinker have in that argument?
- key: cited_object
  description: What each passage cites
  probing_questions:
  - For each supplied passage, what work, idea or named thinker is cited, and at what locus?
- key: citation_move
  description: The move made with the citation
  probing_questions:
  - 'What does the author do with the thinker at each passage: authority, evidence, foil, dialogue, genealogy, illustration,
    courtesy, or self-positioning?'
- key: citation_stance
  description: The stance toward what is cited
  probing_questions:
  - At each passage does the author adopt, build on, qualify, dispute or merely mention the cited position?
- key: passage_reading
  description: What the citation accomplishes here
  probing_questions:
  - Which claim, evidence or distinction does the author advance with the thinker here, and what qualification limits
    that reading?
apps:
- critic
function: genealogy
family: analytical
