# Frozen design: communications/study/REDESIGN_second_queue_2026-09-06.md
engine_key: theory_construction_analyzer
engine_name: How a theory is built
version: 2
category: methodology
kind: synthesis
problematique: 'A construction ledger: problem and scope → inputs → move → resulting concept or mechanism → warrant
  → limit. Lead with how the text earns its proposed contribution, distinguishing claimed novelty from demonstrated
  work. Desks lift construction moves and theory–evidence articulation tables; a well-supported inventory is sufficient.
  Text proposing, revising or combining theory; empirical measures only where empirical claims are undertaken.'
researcher_question: By which moves does the text build and justify its proposed theory?
intellectual_lineage:
  primary:
    name: kuhn
    description: Thomas Kuhn (1922–1996), American philosopher and historian of science whose 'The Structure of
      Scientific Revolutions' (1962) transformed understanding of how scientific knowledge develops. His concept
      of paradigms — overarching frameworks that define legitimate problems, methods, and solutions within a scientific
      community — provides this engine's foundation for understanding how theoretical work operates within constraining
      assumptions that often remain invisible to practitioners. Kuhn's insight that paradigm shifts involve not
      just new theories but new ways of seeing makes visible the deep commitments encoded in any theoretical framework.
  secondary:
  - name: merton
    description: Robert K. Merton (1910–2003), American sociologist who articulated the concept of 'theories of
      the middle range' — theoretical constructions that mediate between grand unified theories and mere empirical
      generalizations. His methodological writings provide the vocabulary for assessing when theories are appropriately
      modest versus overreaching, and how scope conditions determine a theory's proper domain of application.
  - name: star
    description: Susan Leigh Star (1954–2010), American sociologist and information scientist who, with James Griesemer,
      developed the concept of 'boundary objects' — concepts or artifacts flexible enough to be meaningful across
      different communities of practice while robust enough to maintain identity. This concept illuminates how certain
      theoretical terms function precisely because of their productive ambiguity.
  - name: lakatos
    description: Imre Lakatos (1922–1974), Hungarian philosopher of science who developed the methodology of scientific
      research programmes, distinguishing between a theory's 'hard core' of unfalsifiable commitments and its 'protective
      belt' of auxiliary hypotheses. His framework provides tools for mapping which elements of a theoretical construction
      are foundational versus derivative.
  - name: laudan
    description: Larry Laudan (1941–2022), American philosopher of science whose work on research traditions and
      problem-solving effectiveness provides criteria for assessing theoretical progress beyond simple truth claims.
      His emphasis on theories as problem-solving instruments grounds the evaluation of theoretical parsimony and
      fecundity tradeoffs.
  traditions:
  - name: history_of_science
    description: The historical study of scientific development reveals that theories are not discovered but constructed
      through specific social and intellectual processes. This tradition provides concrete examples of how paradigms
      constrain inquiry, how concepts migrate across domains, and how theoretical innovations emerge from crisis
      and creative recombination.
  - name: sociology_of_knowledge
    description: The sociological examination of how knowledge is produced, legitimated, and transmitted within
      communities. This tradition emphasizes that theory-building is a social practice embedded in institutional
      contexts, and that theoretical concepts often serve boundary-spanning functions across different epistemic
      communities.
  - name: philosophy_of_science
    description: 'The normative and descriptive analysis of scientific reasoning, theory structure, and theory change.
      This tradition provides the conceptual vocabulary for analyzing theoretical architecture: what makes a theory
      well-formed, what distinguishes legitimate from illegitimate theoretical moves, how theories relate to evidence.'
  - name: pragmatist_epistemology
    description: The philosophical tradition emphasizing that theories are instruments for organizing experience
      and guiding action rather than mirrors of nature. This orientation grounds the assessment of theoretical parsimony
      and fecundity — theories are evaluated by what they enable us to do, not merely by correspondence to an independent
      reality.
  - name: conceptual_history
    description: The study of how concepts emerge, transform, and migrate across intellectual contexts. This tradition,
      associated with Reinhart Koselleck and Quentin Skinner, provides methods for tracking conceptual bootstrapping
      — how terms carry hidden freight from their domains of origin into new theoretical contexts.
  key_concepts:
  - name: paradigm
    definition: An overarching framework of assumptions, methods, and exemplary solutions that defines a scientific
      community's approach to inquiry. Paradigms constrain what questions can be asked, what methods are legitimate,
      and what counts as a satisfactory answer — often without practitioners' awareness of these constraints.
  - name: middle_range_theory
    definition: Theoretical constructions that occupy the space between grand unified theories and empirical generalizations.
      Middle-range theories specify mechanisms for delimited phenomena with explicit scope conditions, making them
      testable while remaining theoretically substantive.
  - name: boundary_object
    definition: Concepts, methods, or artifacts that maintain enough stability to be recognizable across different
      communities of practice while remaining flexible enough to serve different purposes in different contexts.
      Boundary objects facilitate communication across epistemic communities precisely through their productive
      ambiguity.
  - name: conceptual_bootstrapping
    definition: The intellectual move of importing concepts from one domain and repurposing them in another. Bootstrapping
      transfers not just the concept but often hidden assumptions, connotations, and inferential connections from
      the source domain — sometimes productively, sometimes distortingly.
  - name: theoretical_parsimony
    definition: The methodological value of explaining phenomena with the minimum necessary theoretical apparatus.
      Parsimony trades against fecundity — the ability of a theory to generate new insights, predictions, and research
      directions. Appropriate balance depends on the phenomenon and stage of inquiry.
  - name: operationalization
    definition: The translation of abstract theoretical concepts into observable, measurable indicators. Operationalization
      is necessary for empirical engagement but always involves decisions that may distort what the concept originally
      meant, creating gaps between theoretical and operational definitions.
  - name: scope_conditions
    definition: The explicit or implicit boundaries delimiting where a theory claims to apply. Scope conditions
      specify the domain within which a theory's mechanisms are expected to operate, distinguishing legitimate from
      illegitimate applications and preventing overreach.
  - name: hard_core
    definition: In Lakatos's framework, the central commitments of a research programme that are treated as unfalsifiable
      by methodological decision. The hard core is protected by a belt of auxiliary hypotheses; anomalies are addressed
      by modifying the belt rather than abandoning the core.
analytical_dimensions:
- key: problem_and_scope
  description: Problem and intended reach
  probing_questions:
  - What specific phenomenon does the theory claim to explain?
  - What scope conditions delimit where the theory applies?
- key: inputs
  description: Borrowed and assumed inputs
  probing_questions:
  - What concepts does the text borrow from other domains?
  - What premises or earlier results does the construction adopt, revise or provisionally grant?
- key: moves
  description: Moves and resulting mechanisms
  probing_questions:
  - What mechanisms are proposed to account for the phenomenon?
  - Which passage derives, abstracts, redefines or combines inputs into that mechanism or concept?
- key: synthesis
  description: Compatibility of combined frameworks
  probing_questions:
  - What distinct theoretical frameworks does the text combine?
  - Are the combined frameworks logically compatible?
  - Where do tensions between frameworks remain unresolved?
- key: contribution
  description: What the innovation adds
  probing_questions:
  - What new concepts does the text introduce?
  - What existing concepts, if any, does the innovation replace or supplement?
  - What analytical work does the new concept enable?
- key: evidence_direction
  description: Theory and evidence articulation
  probing_questions:
  - 'What is the direction of inference: evidence to theory, theory to evidence, or iterative?'
  - Where empirical claims are undertaken, how are abstract concepts operationalized into observable indicators?
  - Where does a conceptual derivation supply the justification, and which step remains disputed?
apps:
- critic
function: genealogy
