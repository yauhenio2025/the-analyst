engine_key: institutional_source_identity
engine_name: Establish institutional source identity
version: 1
category: scholarly
kind: synthesis
operation: verification
problematique: Assess organizational classification and original publishing relationships from supplied
  institution website extracts and original source pages. Registry descriptions and names are leads,
  not proof. Classify a think tank only with concrete original evidence of its policy research and
  organizational identity; distinguish universities, government agencies, central banks, companies,
  unions and advocacy organizations. A mixed or ambiguous body stays unknown unless the declared
  scope expressly admits it. Do not infer ideology, funding influence or positions from names or
  countries. Quote the exact supplied passage that warrants the classification and preserve its source
  key. For each original publication distinguish publishing, commissioning, organizing or hosting
  from merely being mentioned, quoted or linked as an outside reference. A shared-platform host alone
  cannot establish the institution. An external PDF/video requires retained original relationship
  evidence. Record signed view, guest contribution, adopted statement, event participant, host question
  and third-party quotation separately; unknown authority stays unknown. Preserve author-views disclaimers.
  These are bounded classifications of supplied evidence, not findings about the research question.
researcher_question: Which organization and publishing relationship do these originals establish?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: identity
  description: Establish organization and publisher identity
  probing_questions:
  - Return a classification, exact source quote, supporting source key, uncertainty and reason. For
    a source relationship retain its original URL and exact supporting passage. No original evidence
    means unknown; never fill a missing quote from memory.
apps:
- critic
function: criticism
family: analytical
