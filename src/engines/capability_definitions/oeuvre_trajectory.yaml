# The oeuvre family (Evgeny, 2026-09-07 07:41: a paper's place in its author's oeuvre). Design: communications/DESIGN_oeuvre_position_2026-09-07.md
engine_key: oeuvre_trajectory
engine_name: The author's agendas and turns
version: 1
category: scholarly
kind: synthesis
operation: ascent
problematique: 'An author''s texts, each summarised in a profile, around one focal text. Name the research agendas
  the oeuvre pursues (a question, a span of texts, key concepts, interlocutors), the turns between them (when, what
  changed: object, question, method, interlocutors), and the focal text''s place: opening, culmination, middle,
  end, reorientation or outlier. Read the profiles for what each text argues, cites and positions itself against;
  never infer a sequence from input order or same-year texts.'
researcher_question: What research agendas does this oeuvre pursue, where do they turn, and where does the focal
  text sit?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: agenda
  description: A research agenda
  probing_questions:
  - What questions does the oeuvre pursue, over which texts, with which key concepts and interlocutors?
- key: turn
  description: A turn between agendas
  probing_questions:
  - Where does the oeuvre change object, question, method or interlocutors, and which two dated texts show it?
- key: place
  description: The focal text's place
  probing_questions:
  - 'Where does the focal text sit among the agendas: does it open one, complete one, sit within one, end one, or
    reorient the oeuvre, or stand apart?'
apps:
- critic
function: genealogy
family: analytical
