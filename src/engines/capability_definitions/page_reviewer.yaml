# The page desks (Evgeny, 2026-09-07 09:45: a page optimised for time to clarity at depth, through a plan-review-revise loop). Design: communications/DESIGN_presentation_exhibits_2026-09-07.md
engine_key: page_reviewer
engine_name: The page reviewer
version: 1
category: quality
kind: extraction
problematique: 'Read the assembled page as the stated reader would, once, and say what fails the first pass: an
  element too dense or too detailed (simplify), the wrong element for its point (replace), one that repeats the
  text (drop), one in the wrong place (move), or one that reads (keep); and, per section, whether the reader grasps
  its one thing on the first pass. The verdicts are for the planner''s next round; reasons name the element and
  what would fix it.'
researcher_question: Does this page read on the first pass, and what fails?
intellectual_lineage:
  primary: rhetoric
analytical_dimensions:
- key: verdict
  description: A verdict on an element
  probing_questions:
  - Does this element earn its place for this reader, and if not, what would?
- key: clarity
  description: First-pass clarity of a section
  probing_questions:
  - Does the reader grasp the section's one thing on the first pass?
apps:
