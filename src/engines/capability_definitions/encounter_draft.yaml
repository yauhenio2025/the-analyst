# The distinction family (Evgeny, 2026-09-07 17:40: 'encounter, then impact scan'). The encounter is the deep operation around ONE thinker (2026-07-15), read across their oeuvre through the owner's whole model.
engine_key: encounter_draft
engine_name: 'The encounter drafted: axes, relations, takes, the route in'
version: 1
category: scholarly
kind: comparison
operation: distinction
problematique: 'Over the map and the owner''s argument and hunches: the two to four axes that organise the whole encounter,
  the relation of the owner''s position to the thinker''s on each (parallel · collides · overlaps then diverges · absorbs
  · irrelevant) with ours, theirs and the bridge and the parts it bears on, what the owner does with each of the thinker''s
  elements (absorb · translate · refuse · defer), the questions back to him, and the texts of the thinker''s to read next,
  ranked. The draft proposes; he decides; making the encounter is kept apart from rewriting his parts.'
researcher_question: On which axes does the owner meet this thinker, what does he take from them and refuse, what must he
  settle, and what should he read next in them?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: axis
  description: An axis that organises the encounter
  probing_questions:
  - Which two to four axes organise the whole meeting of the two systems?
- key: relation
  description: The relation on an axis
  probing_questions:
  - On this axis, is the owner's position parallel, colliding, overlapping then diverging, absorbing, or is the axis irrelevant
    — with ours, theirs, the bridge, and the parts it bears on?
- key: take
  description: What the owner does with an element of the thinker's
  probing_questions:
  - Absorb, translate, refuse or defer — which concept or position, and why?
- key: question_back
  description: The question to the owner
  probing_questions:
  - What must he confirm, restate, elaborate or choose for the encounter to settle?
- key: read_next
  description: The thinker's text to read next
  probing_questions:
  - Which of the thinker's texts, held or not, would move the encounter furthest, and why?
