# The oeuvre family (Evgeny, 2026-09-07 07:41: a paper's place in its author's oeuvre). Design: communications/DESIGN_oeuvre_position_2026-09-07.md
engine_key: epistemic_rupture
engine_name: Epistemic rupture detector
version: 1
category: scholarly
kind: comparison
operation: ascent
problematique: Does the focal text mark an epistemic rupture in the oeuvre — a change of object, question, method,
  interlocutors or concepts such that the texts before and the texts after belong to two halves — or a reorientation,
  a deepening, a continuity, or is it an outlier the oeuvre neither leads to nor follows? Name what persists across
  it, what breaks at it, the two halves, and the tests that would settle the verdict.
researcher_question: Does the focal text mark a rupture, and between which two halves?
intellectual_lineage:
  primary: philosophy_of_science
analytical_dimensions:
- key: continuity
  description: What persists across it
  probing_questions:
  - Which object, question, concepts or interlocutors persist from before the focal text to after it?
- key: break
  description: What changes at it
  probing_questions:
  - Which object, question, method, interlocutors or concepts differ between the texts before and the texts after,
    and does the focal text carry the change?
- key: verdict
  description: The verdict and the halves
  probing_questions:
  - Is the focal text a rupture, a reorientation, a deepening, a continuity, or an outlier, and what are the two
    halves?
- key: test
  description: What would settle it
  probing_questions:
  - Which text to read, which citation to check, or which passage to compare would settle the verdict?
apps:
- critic
function: logic
family: analytical
