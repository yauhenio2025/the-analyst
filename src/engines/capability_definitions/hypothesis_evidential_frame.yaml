# The evidential frame of a hypothesis test (owner's ask, 2026-09-06 19:28: "what would change this verdict" as an explicit step).
engine_key: hypothesis_evidential_frame
engine_name: What would change this verdict
version: 1
category: argument
kind: synthesis
problematique: A hypothesis was tested against a bundle of texts and given a verdict. Say what would change it, from the
  supplied memo and its verified findings and from the held works — the evidence that would strengthen or weaken it
  (named works, passages or data, held or not), the form the argument would have to take for the hypothesis to hold
  (what it must claim and what each account must grant), the decisive tests ordered by how far they would move the
  verdict, and what no available evidence can decide. Name works, not wishes; separate what the corpus lacks from
  what the argument lacks; never restate the verdict.
researcher_question: What evidence and what argument would change this verdict, and which tests would settle it?
intellectual_lineage:
  primary: philosophy_of_science
analytical_dimensions:
- key: strengthen
  description: Evidence that would strengthen the hypothesis
  probing_questions:
  - What evidence, in which named work, passage or dataset, would count for the hypothesis, and is it held?
- key: weaken
  description: Evidence that would weaken the hypothesis
  probing_questions:
  - What evidence, in which named work, passage or dataset, would count against the hypothesis, and is it held?
- key: form
  description: The form the argument must take
  probing_questions:
  - What would the hypothesis have to claim, and what would each account have to grant, for it to hold?
- key: decisive_test
  description: The tests that would settle it
  probing_questions:
  - Which question, answered from which sources, would move the verdict most, and can it be decided now?
- key: residual
  description: What no available evidence decides
  probing_questions:
  - What remains undecidable because the corpus lacks it, or because the argument itself is under-determined?
apps:
- critic
function: logic
family: analytical
