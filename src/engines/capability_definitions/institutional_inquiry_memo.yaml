engine_key: institutional_inquiry_memo
engine_name: Write an institutional debate memo
version: 1
category: scholarly
kind: synthesis
operation: composition
problematique: Investigate the supplied question through institutional originals without requiring
  a target thinker. Reconstruct arguments, mechanisms, constraints, interventions and disagreement
  from the actual documents and voices. Keep adoption, signed views, guest contributions and participant
  statements distinct. Prior maps are retained analysis; only original passages support new source
  claims. Describe the considered, searched, acquired and actually read population separately, including
  geographic, language and publication-date coverage. Search misses and unavailable originals cannot
  establish institutional silence. Group by institution without manufacturing consensus from internal
  disagreement, syndicated copies or several formats of one event. Preserve evidence identities,
  exact quotations and native page/time loci. Never invent missing originals, authority, dates, transcripts
  or positions. Treat question premises and causal inferences as hypotheses. If validation_errors
  and previous_draft are supplied, return a complete corrected answer supported by the same evidence;
  preserve uncertainty instead of manufacturing support.
researcher_question: Write an institutional debate memo
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: answer
  description: Give supported and attributed conclusions
  probing_questions:
  - Support every substantive conclusion with exact verified field evidence identities, attributed
    to the publishing institution and actual author/speaker with adoption unknown where unsupported.
    Use claim_kind field_finding or unresolved. Cite the same evidence identities in prose. Do not
    invent a thinker comparison.
- key: revision
  description: Make learning explicit
  probing_questions:
  - Supply separate rows for concrete changed, retained, new and unresolved positions as applicable,
    explicitly comparing with the actual available baseline. baseline MUST be prior in follow_up
    mode and standalone otherwise. If baseline text is partial, identify that limit. Do not manufacture
    a change merely because a second memo was requested.
- key: counterevidence
  description: Keep the strongest challenge
  probing_questions:
  - Name the strongest available counterevidence to your own preferred account and explain why it
    does or does not overturn the bounded judgment.
- key: question
  description: State next discriminating questions
  probing_questions:
  - Give specific research questions or source gaps that could change the memo. Do not turn generic
    future reading into evidence for a present conclusion.
apps:
- critic
function: genealogy
family: analytical
