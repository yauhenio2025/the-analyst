# Fourth queue: communications/study/REDESIGN_fourth_queue_2026-09-06.md
engine_key: rival_explanations
engine_name: Rival explanations and diagnostic evidence
version: 2
category: methodology
kind: synthesis
problematique: A reading of what the supplied evidence actually distinguishes between the paper’s rival explanations,
  with hypothesis/prediction/evidence-relation rows and a diagnostic-evidence table stating the reason, assumptions
  and remaining uncertainty for each comparison. A specified explanatory question, source-proposed hypotheses and
  evidence; additional analyst alternatives must be labeled.
researcher_question: Which rival explanations are distinguished by the supplied evidence?
intellectual_lineage:
  primary: source_criticism
analytical_dimensions:
- key: problem
  description: Problem
  probing_questions:
  - What specific outcome is being explained, and what alternative explanations does the source actually propose?
- key: predictions
  description: Predictions
  probing_questions:
  - What observation would each explanation lead one to expect under its stated assumptions?
- key: evidence
  description: Evidence
  probing_questions:
  - Which reported observations bear on each rival, and are they supportive, adverse, shared or silent?
- key: diagnosticity
  description: Diagnosticity
  probing_questions:
  - Which observations discriminate between rivals rather than merely fitting both, and why?
- key: sensitivity
  description: Sensitivity
  probing_questions:
  - Which assumptions or untested alternatives could change the conclusion, and what does the source evidence permit
    now?
apps:
- critic
function: genealogy
family: analytical
legacy_engine_key: competing_explanations_analyzer
